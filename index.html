<!DOCTYPE html>
<html lang="id">
<head>

  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;

    .sidebar {
      transition: transform .25s ease;
    }

    .modal {
      display: none;

    .modal.active {

      transform: translateY(-20px);

      pointer-events: none;
      transition: all .25s ease;

      opacity: 1;

        font-size: 13px;
      }

      .sidebar {

      }

      .desktop-title {
        font-size: 16px !important;
      }

      .mobile-small {
        font-size: 11px !important;
      }

      input,
      select,
      textarea {
        font-size: 13px !important;
        padding: 8px 10px !important;
      }

      button {
        font-size: 12px;
      }

      table {
        font-size: 11px !important;
      }

      th,
      td {
        padding: 7px 6px !important;
      }

      .card-number {
        font-size: 20px !important;
      }

      .modal-box {
        width: calc(100% - 20px) !important;
        margin: 10px;
      }

      .page-container {
        padding: 10px !important;
      }

      .dashboard-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      }

      .desktop-only {
        display: none !important;
      }
    }

    @media (min-width: 641px) {
      .mobile-only {
        display: none !important;
      }
    }
  </style>
</head>

<!-- =========================================================
     JAVASCRIPT UTAMA
========================================================= -->
<script>

  /* =========================================================
     STATE
  ========================================================= */

  window.appState = {

    currentUser: null,

    currentRole: "bendahara",

    activeTab: "beranda",

    siswa: {},

    kasMasuk: {},

    kasKeluar: {},

    isFirebaseConnected: false

  };


  const KAS_PER_WEEK = 10000;


  /* =========================================================
     HELPER
  ========================================================= */

  function rupiah(number) {

    return new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }).format(Number(number) || 0);

  }


  function formatTanggal(date) {

    if (!date) return "-";

    const d = new Date(date + "T00:00:00");

    if (isNaN(d)) return date;

    return d.toLocaleDateString("id-ID", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });

  }


  function today() {

    const d = new Date();

    return d.toISOString().split("T")[0];

  }


  function showToast(message, type = "success") {

    const toast = document.getElementById("toast");
    const content = document.getElementById("toastContent");

    if (!toast || !content) return;

    let icon = "fa-circle-check";

    if (type === "error") {
      icon = "fa-circle-exclamation";
    }

    if (type === "warning") {
      icon = "fa-triangle-exclamation";
    }

    content.innerHTML = `
      <i class="fa-solid ${icon} mr-2"></i>
      ${message}
    `;

    toast.classList.add("show");

    setTimeout(() => {
      toast.classList.remove("show");
    }, 3000);

  }


  function showLoading(status) {

    const loading = document.getElementById("loading");

    if (!loading) return;

    loading.classList.toggle("active", status);

  }


  /* =========================================================
     LOGIN
  ========================================================= */

  document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      /*
       * LOGIN SESUAI LOGIN LAMA
       */

      if (
        username === "iissumirat123" &&
        password === "112233"
      ) {

        sessionStorage.setItem(
          "kasKelasLogin",
          username
        );

        window.appState.currentUser = username;

        openApp();

        return;

      }


      showToast(
        "Username atau password salah.",
        "error"
      );

    });


  function checkLogin() {

    const user =
      sessionStorage.getItem("kasKelasLogin");

    if (user) {

      window.appState.currentUser = user;

      openApp();

    }

  }


  function openApp() {

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("app")
      .classList.remove("hidden");

    document.getElementById("sidebarUser").textContent =
      window.appState.currentUser || "Bendahara";

    document.getElementById("navbarUser").textContent =
      window.appState.currentUser || "Bendahara";

    navigate("beranda");

  }


  function logout() {

    sessionStorage.removeItem("kasKelasLogin");

    location.reload();

  }


  /* =========================================================
     NAVIGATION
  ========================================================= */

  function navigate(page) {

    window.appState.activeTab = page;

    const titles = {

      beranda: "Beranda",

      kasMasuk: "Kas Masuk",

      kasKeluar: "Kas Keluar",

      siswa: "Daftar Siswa"

    };

    document.getElementById("pageTitle").textContent =
      titles[page] || "Kas Kelas";


    document.querySelectorAll(".nav-btn").forEach(btn => {

      const active =
        btn.dataset.nav === page;

      btn.classList.toggle(
        "bg-blue-50",
        active
      );

      btn.classList.toggle(
        "text-blue-600",
        active
      );

      btn.classList.toggle(
        "font-semibold",
        active
      );

    });


    refreshAllViews();

    closeSidebar();

  }


  /* =========================================================
     MOBILE SIDEBAR
  ========================================================= */

  function toggleSidebar() {

    const sidebar =
      document.getElementById("sidebar");

    const overlay =
      document.getElementById("sidebarOverlay");

    sidebar.classList.toggle("-translate-x-full");

    if (
      sidebar.classList.contains("-translate-x-full")
    ) {

      overlay.classList.add("hidden");

    } else {

      overlay.classList.remove("hidden");

    }

  }


  function closeSidebar() {

    const sidebar =
      document.getElementById("sidebar");

    const overlay =
      document.getElementById("sidebarOverlay");

    if (!sidebar) return;

    sidebar.classList.add("-translate-x-full");

    overlay.classList.add("hidden");

  }


  /* =========================================================
     MODAL
  ========================================================= */

  function openModal(id) {

    const modal =
      document.getElementById(id);

    if (!modal) return;

    modal.classList.add("active");

  }


  function closeModal(id) {

    const modal =
      document.getElementById(id);

    if (!modal) return;

    modal.classList.remove("active");

  }


  /* =========================================================
     DASHBOARD
  ========================================================= */

  function getTotalKasMasuk() {

    return Object.values(
      window.appState.kasMasuk
    ).reduce(
      (total, item) =>
        total + Number(item.nominal || 0),
      0
    );

  }


  function getTotalKasKeluar() {

    return Object.values(
      window.appState.kasKeluar
    ).reduce(
      (total, item) =>
        total + Number(item.nominal || 0),
      0
    );

  }


  function getSaldo() {

    return (
      getTotalKasMasuk() -
      getTotalKasKeluar()
    );

  }


  function renderDashboard() {

    const totalSiswa =
      Object.keys(window.appState.siswa).length;

    const masuk =
      getTotalKasMasuk();

    const keluar =
      getTotalKasKeluar();

    const saldo =
      masuk - keluar;


    const recentMasuk =
      Object.entries(window.appState.kasMasuk)
        .sort(
          (a, b) =>
            Number(b[1].createdAt || 0) -
            Number(a[1].createdAt || 0)
        )
        .slice(0, 5);


    document.getElementById("pageContent").innerHTML = `

      <div class="mb-5">

        <h2 class="text-xl font-bold text-gray-800">
          Selamat Datang 👋

  function prepareKasMasuk() {

    const form =
      document.getElementById("formKasMasuk");

    form.reset();

    delete form.dataset.editId;

    document.getElementById(
      "kasMasukTanggal"
    ).value = today();

    document.getElementById(
      "kasMasukKeterangan"
    ).value = "Pembayaran kas";

    document.getElementById(
      "modalKasMasukTitle"
    ).textContent = "Tambah Kas Masuk";

    populateSiswaSelect();

    openModal("modalKasMasuk");

  }


  function populateSiswaSelect(selected = "") {

    const select =
      document.getElementById("kasMasukSiswa");

    const siswa =
      Object.entries(window.appState.siswa)
        .sort((a, b) =>
          String(a[1].nama || "")
            .localeCompare(
              String(b[1].nama || ""),
              "id"
            )
        );

    select.innerHTML =
      `<option value="">Pilih siswa</option>` +

      siswa.map(([id, item]) => `

        <option
          value="${escapeAttribute(id)}"
          ${id === selected ? "selected" : ""}
        >
          ${escapeHtml(item.nama || "-")}
        </option>

      `).join("");

  }


  async function saveKasMasuk(event) {

    event.preventDefault();

    const form = event.target;

    const id =
      form.dataset.editId || "";

    const tanggal =
      document.getElementById(
        "kasMasukTanggal"
      ).value;

    const siswaId =
      document.getElementById(
        "kasMasukSiswa"
      ).value;

    const keterangan =
      document.getElementById(
        "kasMasukKeterangan"
      ).value.trim();

    const nominal =
      Number(
        document.getElementById(
          "kasMasukNominal"
        ).value
      );


    if (!tanggal || !siswaId || !nominal) {

      showToast(
        "Lengkapi data terlebih dahulu.",
        "error"
      );

      return;
    }


    if (!window.dbRef?.db) {

      showToast(
        "Firebase belum siap.",
        "error"
      );

      return;
    }


    if (!window.appState.isFirebaseConnected) {

      showToast(
        "Firebase sedang tidak terhubung.",
        "error"
      );

      return;
    }


    const siswa =
      window.appState.siswa[siswaId];


    const payload = {

      tanggal,

      siswaId,

      namaSiswa:
        siswa?.nama || "",

      keterangan:
        keterangan || "Pembayaran kas",

      nominal,

      updatedAt:
        Date.now(),

      createdBy:
        window.appState.currentUser ||
        "bendahara"

    };


    try {

      const db =
        window.dbRef.db;


      if (id) {

        await window.dbRef.update(

          window.dbRef.ref(
            db,
            `kelasVIIIB/kasMasuk/${id}`
          ),

          payload

        );


        showToast(
          "Kas masuk berhasil diperbarui.",
          "success"
        );

      } else {

        payload.createdAt =
          Date.now();


        const newRef =
          window.dbRef.push(
            window.dbRef.ref(
              db,
              "kelasVIIIB/kasMasuk"
            )
          );


        await window.dbRef.set(
          newRef,
          payload
        );


        showToast(
          "Kas masuk berhasil disimpan.",
          "success"
        );

      }


      form.reset();

      delete form.dataset.editId;

      closeModal("modalKasMasuk");


    } catch (error) {

      console.error(error);

      showToast(
        "Gagal menyimpan ke Firebase: " +
        error.message,
        "error"
      );

    }

  }


  function editKasMasuk(id) {

    const item =
      window.appState.kasMasuk[id];

    if (!item) return;


    const form =
      document.getElementById("formKasMasuk");


    form.dataset.editId = id;


    populateSiswaSelect(
      item.siswaId || ""

    document.getElementById(
      "kasMasukTanggal"

    document.getElementById(
      "kasMasukKeterangan"

    ).value =
      item.nominal || "";


    document.getElementById(
      "modalKasMasukTitle"
    ).textContent =
      "Edit Kas Masuk";


    openModal("modalKasMasuk");

  }

                      Belum ada siswa.
                    </td>
                  </tr>
                `

                :

                data.map(([id, item], index) => `

                  <tr class="border-t hover:bg-gray-50">

                    <td class="px-4 py-3 text-xs">
                      ${index + 1}
                    </td>

                    <td class="px-4 py-3">

                      <div class="flex items-center gap-2">

                        <div
                          class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center"
                        >
                          <i class="fa-solid fa-user text-xs"></i>
                        </div>

                        <span class="font-semibold text-sm">
                          ${escapeHtml(item.nama || "-")}
                        </span>

                      </div>

                    </td>

                    <td class="px-4 py-3 text-xs">
                      ${escapeHtml(item.nis || "-")}
                    </td>

                    <td class="px-4 py-3 text-xs">
                      ${escapeHtml(item.kelas || "VII B")}
                    </td>

                    <td class="px-4 py-3">

                      <div class="flex justify-center gap-1">

                        <button
                          onclick="editSiswa('${id}')"
                          class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600"
                        >
                          <i class="fa-solid fa-pen text-xs"></i>
                        </button>

                        <button
                          onclick="deleteSiswa('${id}')"
                          class="w-8 h-8 rounded-lg bg-red-50 text-red-600"
                        >
                          <i class="fa-solid fa-trash text-xs"></i>
                        </button>

                      </div>

                    </td>

                  </tr>

                `).join("")

              }

            </tbody>

          </table>

        </div>

      </div>

    `;

  }


  function prepareSiswa() {

    const form =
      document.getElementById("formSiswa");

    form.reset();

    delete form.dataset.editId;

    document.getElementById(
      "siswaKelas"
    ).value = "VII B";

    document.getElementById(
      "modalSiswaTitle"
    ).textContent =
      "Tambah Siswa";

    openModal("modalSiswa");

  }


  async function saveSiswa(event) {

    event.preventDefault();

    const form = event.target;

    const id =
      form.dataset.editId || "";


    const nama =
      document.getElementById(
        "siswaNama"
      ).value.trim();


    const nis =
      document.getElementById(
        "siswaNis"
      ).value.trim();


    const kelas =
      document.getElementById(
        "siswaKelas"
      ).value.trim();


    if (!nama) {

      showToast(
        "Nama siswa wajib diisi.",
        "error"
      );

      return;

    }


    if (!window.dbRef?.db) {

      showToast(
        "Firebase belum siap.",
        "error"
      );

      return;

    }


    if (!window.appState.isFirebaseConnected) {

      showToast(
        "Firebase sedang tidak terhubung.",
        "error"
      );

      return;

    }


    const payload = {

      nama,

      nis,

      kelas:
        kelas || "VII B",

      updatedAt:
        Date.now()

    };


    try {

      const db =
        window.dbRef.db;


      if (id) {

        await window.dbRef.update(

          window.dbRef.ref(
            db,
            `kelasVIIIB/siswa/${id}`
          ),

          payload

        );


        showToast(
          "Data siswa berhasil diperbarui.",
          "success"
        );

      } else {

        payload.createdAt =
          Date.now();


        const newRef =
          window.dbRef.push(

            window.dbRef.ref(
              db,
              "kelasVIIIB/siswa"
            )

          );


        await window.dbRef.set(
          newRef,
          payload
        );


        showToast(
          "Siswa berhasil disimpan.",
          "success"
        );

      }


      form.reset();

      delete form.dataset.editId;

      closeModal("modalSiswa");


    } catch (error) {

      console.error(error);

      showToast(
        "Gagal menyimpan siswa: " +
        error.message,
        "error"
      );

    }

  }


  function editSiswa(id) {

    const item =
      window.appState.siswa[id];

    if (!item) return;


    const form =
      document.getElementById(
        "formSiswa"
      );


    form.dataset.editId = id;


    document.getElementById(
      "siswaNama"
    ).value =
      item.nama || "";


    document.getElementById(
      "siswaNis"
    ).value =
      item.nis || "";


    document.getElementById(
      "siswaKelas"
    ).value =
      item.kelas || "VII B";


    document.getElementById(
      "modalSiswaTitle"
    ).textContent =
      "Edit Siswa";


    openModal("modalSiswa");

  }


  async function deleteSiswa(id) {

    if (!confirm(
      "Yakin ingin menghapus siswa ini?"
    )) {
      return;
    }


    if (!window.dbRef?.db) {

      showToast(
        "Firebase belum siap.",
        "error"
      );

      return;
    }


    try {

      await window.dbRef.remove(

        window.dbRef.ref(
          window.dbRef.db,
          `kelasVIIIB/siswa/${id}`
        )

      );


      showToast(
        "Data siswa berhasil dihapus.",
        "success"
      );

    } catch (error) {

      console.error(error);

      showToast(
        "Gagal menghapus siswa.",
        "error"
      );

    }

  }


  /* =========================================================
     REFRESH VIEW
  ========================================================= */

  function refreshAllViews() {

    if (
      !document.getElementById("app") ||
      document
        .getElementById("app")
        .classList.contains("hidden")
    ) {
      return;
    }


    switch (
      window.appState.activeTab
    ) {

      case "kasMasuk":
        renderKasMasuk();
        break;

      case "kasKeluar":
        renderKasKeluar();
        break;

      case "siswa":
        renderSiswa();
        break;

      default:
        renderDashboard();

    }

  }


  /* =========================================================
     ESCAPE HTML
  ========================================================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return String(value ?? "")
      .replace(/"/g, "&quot;");

  }


  /* =========================================================
     FORM EVENTS
  ========================================================= */

  document
    .getElementById("formKasMasuk")
    .addEventListener(
      "submit",
      saveKasMasuk
    );


  document
    .getElementById("formKasKeluar")
    .addEventListener(
      "submit",
      saveKasKeluar
    );


  document
    .getElementById("formSiswa")
    .addEventListener(
      "submit",
      saveSiswa
    );


  /* =========================================================
     START
  ========================================================= */

  checkLogin();

</script>
