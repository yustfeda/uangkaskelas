<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kas Kelas VII B</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginPage {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.18);
    }

    .login-logo {
      width: 70px;
      height: 70px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px auto;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    .login-logo i {
      font-size: 28px;
    }

    .login-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-title h1 {
      margin: 0;
      font-size: 23px;
      font-weight: 700;
      color: #111827;
    }

    .login-title p {
      margin: 6px 0 0;
      color: #6b7280;
      font-size: 13px;
    }

    .login-field {
      margin-bottom: 16px;
    }

    .login-field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    .login-input-wrapper {
      position: relative;
      width: 100%;
    }

    .login-input-wrapper i {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      z-index: 2;
      pointer-events: none;
    }

    .login-input {
      width: 100%;
      height: 45px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 0 13px 0 40px;
      outline: none;
      font-size: 14px;
      background: white;
      position: relative;
      z-index: 1;
    }

    .login-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    .login-button {
      width: 100%;
      height: 45px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-button:hover {
      background: #1d4ed8;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      transition: transform .25s ease;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      display: none;
    }

    .modal.active {
      display: flex;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      opacity: 0;
      transform: translateY(-15px);
      pointer-events: none;
      transition: .25s;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:640px) {

      html {
        font-size: 13px;
      }

      body {
        font-size: 13px;
      }

      #loginPage {
        padding: 15px;
      }

      .login-card {
        max-width: 360px;
        padding: 25px 19px;
        border-radius: 17px;
      }

      .login-logo {
        width: 62px;
        height: 62px;
        border-radius: 16px;
        margin-bottom: 15px;
      }

      .login-logo i {
        font-size: 24px;
      }

      .login-title {
        margin-bottom: 20px;
      }

      .login-title h1 {
        font-size: 20px;
      }

      .login-title p {
        font-size: 11px;
      }

      .login-field {
        margin-bottom: 13px;
      }

      .login-field label {
        font-size: 12px;
        margin-bottom: 5px;
      }

      .login-input {
        height: 42px;
        font-size: 12px;
      }

      .login-button {
        height: 42px;
        font-size: 12px;
      }

      table {
        font-size: 11px !important;
      }

      th,
      td {
        padding: 7px 6px !important;
      }

      .page-container {
        padding: 10px !important;
      }

      .sidebar {
        width: 245px !important;
      }

      .modal-box {
        width: calc(100% - 20px) !important;
        max-width: 390px !important;
        margin: 10px;
      }

      input,
      select,
      textarea {
        font-size: 12px !important;
      }

      button {
        font-size: 12px;
      }
    }

  </style>
</head>

<body>


<!-- =========================================================
     LOGIN
========================================================= -->

<div id="loginPage">

  <div class="login-card">

    <div class="login-logo">
      <i class="fa-solid fa-wallet"></i>
    </div>

    <div class="login-title">

      <h1>Kas Kelas VII B</h1>

      <p>
        Sistem Pengelolaan Uang Kas Kelas
      </p>

    </div>


    <form id="loginForm">

      <div class="login-field">

        <label>
          Username
        </label>

        <div class="login-input-wrapper">

          <i class="fa-solid fa-user"></i>

          <input
            id="username"
            class="login-input"
            type="text"
            autocomplete="username"
            placeholder="Masukkan username"
            required
          >

        </div>

      </div>


      <div class="login-field">

        <label>
          Password
        </label>

        <div class="login-input-wrapper">

          <i class="fa-solid fa-lock"></i>

          <input
            id="password"
            class="login-input"
            type="password"
            autocomplete="current-password"
            placeholder="Masukkan password"
            required
          >

        </div>

      </div>


      <button
        type="submit"
        class="login-button"
      >
        <i class="fa-solid fa-right-to-bracket mr-2"></i>
        Masuk
      </button>

    </form>


    <div class="text-center text-xs text-gray-400 mt-5">
      Kas Kelas VII B
    </div>

  </div>

</div>


<!-- =========================================================
     APPLICATION
========================================================= -->

<div
  id="app"
  class="hidden min-h-screen"
>


  <!-- SIDEBAR -->

  <aside
    id="sidebar"

    <div class="h-16 border-b flex items-center px-5">

      >
        <i class="fa-solid fa-wallet"></i>
      </div>

      <div>

        <div class="font-bold">

        </div>

        <div class="text-xs text-gray-400">
          VII B
        </div>

      </div>

    </div>


    <div class="p-3">

      <div class="text-[10px] uppercase text-gray-400 font-bold px-3 py-2">
        Menu
      </div>


      <button
        onclick="navigate('beranda')"
        data-nav="beranda"

        <div

          <i class="fa-solid fa-user"></i>
        </div>

        <div class="min-w-0">

          <div
            id="sidebarUser"

            Bendahara

        </div>

      </div>


      <button

      >
        <i class="fa-solid fa-right-from-bracket mr-2"></i>
        Keluar

    </div>

  </aside>


  <!-- OVERLAY -->

  <div
    id="sidebarOverlay"
    onclick="closeSidebar()"

  <!-- CONTENT -->

  <div class="lg:ml-64 min-h-screen">


    <!-- NAVBAR -->

    >

      <div class="flex items-center gap-3">

        <!-- GARIS TIGA -->

        <button

        >

        </button>


        <div>

          <h1

            class="font-bold text-lg"

            Beranda
          </h1>

          <div class="text-[10px] text-gray-400">
            Pengelolaan Kas Kelas VII B
          </div>

        </div>

      </div>


      <div class="flex items-center gap-3">

        <div
          id="firebaseStatus"
          class="flex items-center gap-1 text-xs"
        >
          <span
            class="w-2 h-2 bg-gray-400 rounded-full"
          ></span>

          <span class="hidden sm:block">
            Menghubungkan...
          </span>

        </div>


        <div class="hidden sm:flex items-center gap-2">

<!-- =========================================================

<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

  /* =========================================================
     STATE
  ========================================================= */

  window.appState = {

    currentUser: null,

    currentRole: "bendahara",

    activeTab: "beranda",

    siswa: {},

    kasMasuk: {},

    kasKeluar: {}

  };


  /* =========================================================
     HELPER
  ========================================================= */

  function rupiah(value) {

    return new Intl.NumberFormat(
      "id-ID",
      {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }
    ).format(Number(value) || 0);

  }


  function formatTanggal(value) {

    if (!value) return "-";

    const d =
      new Date(value + "T00:00:00");

    if (isNaN(d.getTime())) {
      return value;
    }

    return d.toLocaleDateString(
      "id-ID",
      {
        day: "2-digit",
        month: "short",
        year: "numeric"
      }
    );

  }


  function today() {

    const d = new Date();

    const month =
      String(d.getMonth() + 1).padStart(2, "0");

    const day =
      String(d.getDate()).padStart(2, "0");

    return `${d.getFullYear()}-${month}-${day}`;

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function showToast(
    message,
    type = "success"
  ) {

    const toast =
      document.getElementById("toast");

    const content =
      document.getElementById("toastContent");


    let icon =
      type === "error"
        ? "fa-circle-exclamation"
        : "fa-circle-check";


    content.innerHTML = `
      <i class="fa-solid ${icon} mr-2"></i>
      ${escapeHtml(message)}
    `;


    toast.classList.add("show");


    setTimeout(() => {

      toast.classList.remove("show");

    }, 3000);

  }


  /* =========================================================
     LOGIN
  ========================================================= */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const username =
          document
            .getElementById("username")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        if (
          username === "iissumirat123" &&
          password === "112233"
        ) {

          sessionStorage.setItem(
            "kasKelasLogin",
            username
          );


          window.appState.currentUser =
            username;


          openApp();


        } else {

          showToast(
            "Username atau password salah.",
            "error"
          );

        }

      }
    );


  function checkLogin() {

    const user =
      sessionStorage.getItem(
        "kasKelasLogin"
      );


    if (user) {

      window.appState.currentUser =
        user;

      openApp();

    }

  }


  function openApp() {

    document
      .getElementById("loginPage")
      .classList.add("hidden");


    document
      .getElementById("app")
      .classList.remove("hidden");


    document
      .getElementById("sidebarUser")
      .textContent =
      window.appState.currentUser;


    document
      .getElementById("navbarUser")
      .textContent =
      window.appState.currentUser;


    navigate("beranda");

  }


  function logout() {

    sessionStorage.removeItem(
      "kasKelasLogin"
    );

    location.reload();

  }


  /* =========================================================
     NAVIGATION
  ========================================================= */

  function navigate(page) {

    window.appState.activeTab =
      page;


    const titles = {

      beranda: "Beranda",

      kasMasuk: "Kas Masuk",

      kasKeluar: "Kas Keluar",

      siswa: "Daftar Siswa"

    };


    document
      .getElementById("pageTitle")
      .textContent =
      titles[page];


    document
      .querySelectorAll(".nav-btn")
      .forEach(button => {

        const active =
          button.dataset.nav === page;


        button.classList.toggle(
          "bg-blue-50",
          active
        );


        button.classList.toggle(
          "text-blue-600",
          active
        );


        button.classList.toggle(
          "font-semibold",
          active
        );

      });


    refreshAllViews();

    closeSidebar();

  }


  function toggleSidebar() {

    const sidebar =
      document.getElementById(
        "sidebar"
      );


    const overlay =
      document.getElementById(
        "sidebarOverlay"
      );


    sidebar.classList.toggle(
      "-translate-x-full"
    );


    if (
      sidebar.classList.contains(

  /* =========================================================
     SIMPAN SISWA KE FIREBASE
  ========================================================= */

  async function saveSiswa(event) {

    event.preventDefault();


    const form =
      event.target;


    const id =
      form.dataset.editId || "";


    const nama =
      document
        .getElementById("siswaNama")
        .value
        .trim();


    const nis =
      document
        .getElementById("siswaNis")
        .value
        .trim();


    const kelas =
      document
        .getElementById("siswaKelas")
        .value
        .trim();


    if (!nama) {

      showToast(
        "Nama siswa wajib diisi.",
        "error"
      );

      return;

    }


    /*
     * PASTIKAN FIREBASE SUDAH ADA
     */

    if (!window.firebaseDB) {

      showToast(
        "Firebase belum siap. Tunggu sebentar lalu coba lagi.",
        "error"
      );

      return;

    }


    const data = {

      nama: nama,

      nis: nis,

      kelas: kelas || "VII B",

      updatedAt: Date.now()

    };


    try {

      let targetRef;


      if (id) {

        targetRef =
          window.firebaseRef(
            window.firebaseDB,
            "kelasVIIIB/siswa/" + id
          );


        await window.firebaseUpdate(
          targetRef,
          data
        );


        showToast(
          "Data siswa berhasil diperbarui."
        );

      } else {

        targetRef =
          window.firebasePush(
            window.firebaseRef(
              window.firebaseDB,
              "kelasVIIIB/siswa"
            )
          );


        data.createdAt =
          Date.now();


        await window.firebaseSet(
          targetRef,
          data
        );


        showToast(
          "Data siswa berhasil disimpan ke database."
        );

      }


      form.reset();

      delete form.dataset.editId;

      closeModal("modalSiswa");


    } catch (error) {

      console.error(
        "Firebase SAVE SISWA ERROR:",
        error
      );


      showToast(
        "Gagal menyimpan: " +
        error.message,
        "error"
      );

    }

  }

        );


        showToast(
          "Kas keluar berhasil diperbarui."
        );


      } else {

        data.createdAt =
          Date.now();


        const targetRef =
          window.firebasePush(

            window.firebaseRef(
              window.firebaseDB,
              "kelasVIIIB/kasKeluar"
            )

          );


        await window.firebaseSet(
          targetRef,
          data
        );


        showToast(
          "Kas keluar berhasil disimpan."
        );

      }


      form.reset();

      delete form.dataset.editId;

      closeModal(
        "modalKasKeluar"
      );


    } catch (error) {

      console.error(
        "SAVE KAS KELUAR:",
        error
      );


      showToast(
        "Gagal menyimpan: " +
        error.message,
        "error"
      );

    }

  }


  function editKasKeluar(id) {

    const item =
      window.appState.kasKeluar[id];


    if (!item) return;


    const form =
      document.getElementById(
        "formKasKeluar"
      );


    form.dataset.editId =
      id;


    document.getElementById(
      "kasKeluarTanggal"
    ).value =
      item.tanggal || "";


    document.getElementById(
      "kasKeluarKeterangan"
    ).value =
      item.keterangan || "";


    document.getElementById(
      "kasKeluarNominal"
    ).value =
      item.nominal || "";


    document.getElementById(
      "modalKasKeluarTitle"
    ).textContent =
      "Edit Kas Keluar";


    openModal(
      "modalKasKeluar"
    );

  }


  async function deleteKasKeluar(id) {

    if (!confirm(
      "Hapus transaksi ini?"
    )) return;


    try {

      await window.firebaseRemove(

        window.firebaseRef(
          window.firebaseDB,
          "kelasVIIIB/kasKeluar/" + id
        )

      );


      showToast(
        "Kas keluar berhasil dihapus."
      );


    } catch (error) {

      console.error(error);

      showToast(
        "Gagal menghapus data.",
        "error"
      );

    }

  }


  /* =========================================================
     REFRESH
  ========================================================= */

  function refreshAllViews() {

    if (
      document
        .getElementById("app")
        .classList.contains("hidden")
    ) {

      return;

    }


    switch (
      window.appState.activeTab
    ) {

      case "siswa":

        renderSiswa();

        break;


      case "kasMasuk":

        renderKasMasuk();

        break;


      case "kasKeluar":

        renderKasKeluar();

        break;


      default:

        renderDashboard();

    }

  }


  /* =========================================================
     FORM LISTENER
  ========================================================= */

  document
    .getElementById("formSiswa")
    .addEventListener(
      "submit",
      saveSiswa
    );


  document
    .getElementById("formKasMasuk")
    .addEventListener(
      "submit",
      saveKasMasuk
    );


  document
    .getElementById("formKasKeluar")
    .addEventListener(
      "submit",
      saveKasKeluar
    );


  /* =========================================================
     START
  ========================================================= */

  checkLogin();

</script>

    ref,
    push,

  } from

  /* =========================================================
     FIREBASE CONFIG BARU
  ========================================================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAmy4PcVbc3bUnIEti0rhkhyPvGiLwFRYc",

    authDomain:
      "absenguru-615da.firebaseapp.com",

    databaseURL:
      "https://absenguru-615da-default-rtdb.firebaseio.com",

    projectId:

    storageBucket:

    messagingSenderId:
      "1014411980118",

    appId:
      "1:1014411980118:web:6f3f702d8aad89af57faf7"

  };


  try {

    /*
     * INITIALIZE FIREBASE
     */

    const app =
      initializeApp(
        firebaseConfig
      );


    /*
     * DATABASE
     */

    const database =
      getDatabase(app);


    /*
     * SIMPAN API FIREBASE
     * KE WINDOW AGAR BISA DIPAKAI
     * OLEH SCRIPT UTAMA
     */

    window.firebaseDB =
      database;


    window.firebaseRef =
      ref;


    window.firebasePush =
      push;


    window.firebaseSet =
      set;


    window.firebaseUpdate =
      update;


    window.firebaseRemove =
      remove;


    /*
     * STATUS KONEKSI
     */

    const connectedRef =
      ref(
        database,
        ".info/connected"
      );


    onValue(
      connectedRef,
      snapshot => {

        const status =
          document.getElementById(
            "firebaseStatus"
          );


        const connected =
          snapshot.val() === true;


        if (!status) return;


        if (connected) {

          status.innerHTML = `
            <span
              class="w-2 h-2 bg-green-500 rounded-full"
            ></span>

            <span class="hidden sm:block">
              Terhubung
            </span>
          `;


          status.className =
            "flex items-center gap-1 text-green-600 text-xs";


        } else {

          status.innerHTML = `
            <span
              class="w-2 h-2 bg-red-500 rounded-full"
            ></span>

            <span class="hidden sm:block">
              Tidak terhubung
            </span>
          `;


          status.className =
            "flex items-center gap-1 text-red-500 text-xs";

        }

      }
    );


    /*
     * ======================================================
     * REALTIME SISWA
     * ======================================================
     */

    onValue(

      ref(
        database,
        "kelasVIIIB/siswa"
      ),

      snapshot => {

        window.appState.siswa =
          snapshot.val() || {};


        refreshAllViews();

      },

      error => {

        console.error(
          "READ SISWA:",
          error
        );

      }

    );


    /*
     * ======================================================
     * REALTIME KAS MASUK
     * ======================================================
     */

    onValue(

      ref(
        database,
        "kelasVIIIB/kasMasuk"
      ),

      snapshot => {

        window.appState.kasMasuk =
          snapshot.val() || {};


        refreshAllViews();

      },

      error => {

        console.error(
          "READ KAS MASUK:",
          error
        );

      }

    );


    /*
     * ======================================================
     * REALTIME KAS KELUAR
     * ======================================================
     */

    onValue(

      ref(
        database,
        "kelasVIIIB/kasKeluar"
      ),

      snapshot => {

        window.appState.kasKeluar =
          snapshot.val() || {};


        refreshAllViews();

      },

      error => {

          "READ KAS KELUAR:",
          error
        );

    );


    console.log(

    );

    console.log(

      firebaseConfig.databaseURL
    );

    console.log(
      "================================="
    );


  } catch (error) {

    console.error(
      "FIREBASE INITIALIZATION ERROR:",
      error
    );


    showToast(
      "Firebase gagal dimuat.",

    );

  }
