    <style>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    set,
    push,
    update,
    remove
}
from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyAmy4PcVbc3bUnIEti0rhkhyPvGiLwFRYc",
    authDomain: "absenguru-615da.firebaseapp.com",
    databaseURL: "https://absenguru-615da-default-rtdb.firebaseio.com",
    projectId: "absenguru-615da",
    storageBucket: "absenguru-615da.firebasestorage.app",
    messagingSenderId: "1014411980118",
    appId: "1:1014411980118:web:6f3f702d8aad89af57faf7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.firebaseDB = db;


/* =====================================================
   STATE
===================================================== */

const CURRENT_YEAR = new Date().getFullYear();

const appState = {

    currentRole: null,
    currentUser: null,
    activeTab: "beranda",

    siswa: {},
    kasMasuk: {},
    kasKeluar: {},

    /*
       PENTING:

       pembayaranStatus dipisahkan dari kasMasuk.

       kasMasuk = RIWAYAT TRANSAKSI
       pembayaranStatus = STATUS PEMBAYARAN

       Jadi jika riwayat dihapus,
       status pembayaran TIDAK ikut terhapus.
    */
    pembayaranStatus: {},

    settings: {
        weeklyFee: 10000,
        startDate: `${CURRENT_YEAR}-01-01`
    }
};


/* =====================================================
   HELPER
===================================================== */

function esc(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function rupiah(value) {

    return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
    }).format(Number(value || 0));
}


function pad(num) {
    return String(num).padStart(2, "0");
}


function todayISO() {

    const d = new Date();

    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}


function formatDate(date) {

    if (!date) return "-";

    const d = new Date(date + "T00:00:00");

    if (isNaN(d.getTime())) return date;

    return d.toLocaleDateString("id-ID", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}


function daysInMonth(year, month) {

    return new Date(year, month, 0).getDate();
}


function monthName(month) {

    return new Date(2000, month - 1, 1)
        .toLocaleDateString("id-ID", {
            month: "long"
        });
}


function getWeeksInMonth(year, month) {

    return Math.ceil(daysInMonth(year, month) / 7);
}


function getCurrentWeek() {

    return Math.ceil(new Date().getDate() / 7);
}


/* =====================================================
   PERIOD
===================================================== */

function getPeriod(year, month, week) {

    const totalDays = daysInMonth(year, month);

    const startDay = ((week - 1) * 7) + 1;
    const endDay = Math.min(week * 7, totalDays);

    const start = new Date(year, month - 1, startDay);
    const end = new Date(year, month - 1, endDay);

    const key =
        `${year}-${pad(month)}-W${week}`;

    const label =
        `${monthName(month)} ${year} - Minggu ${week} (${startDay}-${endDay} ${monthName(month)})`;

    return {
        key,
        label,
        year,
        month,
        week,
        start,
        end
    };
}


/*
   Semua periode yang seharusnya sudah dibayar
   sampai hari ini.
*/
function getExpectedPeriods() {

    const result = [];

    const today = new Date();

    let startDate =
        appState.settings.startDate
            ? new Date(appState.settings.startDate + "T00:00:00")
            : new Date(CURRENT_YEAR, 0, 1);

    /*
       Periode kas hanya tahun berjalan.
    */
    const currentYearStart =
        new Date(CURRENT_YEAR, 0, 1);

    if (startDate < currentYearStart) {
        startDate = currentYearStart;
    }

    if (startDate > today) {
        return result;
    }

    for (
        let month = 1;
        month <= today.getMonth() + 1;
        month++
    ) {

        const maxWeek =
            month === today.getMonth() + 1
                ? getCurrentWeek()
                : getWeeksInMonth(CURRENT_YEAR, month);

        for (
            let week = 1;
            week <= maxWeek;
            week++
        ) {

            const period =
                getPeriod(CURRENT_YEAR, month, week);

            if (
                period.start <= today &&
                period.end >= startDate
            ) {
                result.push(period);
            }
        }
    }

    return result;
}


/* =====================================================
   PAYMENT STATUS
===================================================== */

/*
   Membaca status pembayaran dari node
   pembayaranStatus.

   Format:

   pembayaranStatus/
       siswaId/
           periodeKey/
               paid: true
               tanggal: ...
               jumlah: ...
               ...
*/

function isPeriodPaid(studentId, periodKey) {

    const studentStatus =
        appState.pembayaranStatus[studentId] || {};

    return !!studentStatus[periodKey];
}


function getUnpaidPeriods(studentId) {

    return getExpectedPeriods()
        .filter(period => {
            return !isPeriodPaid(
                studentId,
                period.key
            );
        });
}


function getPaidPeriods(studentId) {

    return getExpectedPeriods()
        .filter(period => {
            return isPeriodPaid(
                studentId,
                period.key
            );
        });
}


function getStudentPaymentSummary(studentId) {

    const unpaid =
        getUnpaidPeriods(studentId);

    const paid =
        getPaidPeriods(studentId);

    const weeklyFee =
        Number(appState.settings.weeklyFee || 0);

    return {

        unpaidPeriods: unpaid,
        paidPeriods: paid,

        unpaidWeeks: unpaid.length,

        paidWeeks: paid.length,

        arrears:
            unpaid.length * weeklyFee,

        isLunas:
            unpaid.length === 0
    };
}


/* =====================================================
   BULAN BERJALAN
===================================================== */

function getCurrentMonthPeriods() {

    const now = new Date();

    const month = now.getMonth() + 1;

    const week = getCurrentWeek();

    const result = [];

    for (let w = 1; w <= week; w++) {

        result.push(
            getPeriod(
                CURRENT_YEAR,
                month,
                w
            )
        );
    }

    return result;
}


function getMonthlyStatus(studentId) {

    const periods =
        getCurrentMonthPeriods();

    const unpaid =
        periods.filter(
            p => !isPeriodPaid(
                studentId,
                p.key
            )
        );

    return {

        total: periods.length,
        paid: periods.length - unpaid.length,
        unpaid: unpaid.length,

        isLunas:
            unpaid.length === 0,

        amount:
            unpaid.length *
            Number(appState.settings.weeklyFee || 0)
    };
}

function populateMemberSelect() {

    const select =
        document.getElementById("memberStudent");

    if (!select) return;

    const students =
        Object.entries(appState.siswa)
            .filter(([id, s]) => s && s.aktif !== false)
            .sort((a,b) =>
                String(a[1].nama || "")
                    .localeCompare(
                        String(b[1].nama || ""),
                        "id"
                    )
            );

    select.innerHTML =
        `<option value="">Pilih nama siswa</option>`;

    students.forEach(([id, student]) => {

        select.innerHTML += `
            <option value="${esc(id)}">
                ${esc(student.nama || "Tanpa Nama")}
            </option>
        `;
    });

function loginBendahara(event) {

    event.preventDefault();

    const username =
        document
            .getElementById("bendaharaUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("bendaharaPassword")
            .value;

    if (
        username === "iissumirat123" &&
        password === "112233"
    ) {

        const session = {

            role: "bendahara",

            userId: "bendahara",

            name: "Bendahara"
        };

        sessionStorage.setItem(
            "kasKelasSession",
            JSON.stringify(session)
        );

        startApp(session);

    } else {

        showToast(
            "Username atau password salah.",
            "error"
        );
    }
}


function loginAnggota(event) {

    event.preventDefault();

    const studentId =
        document
            .getElementById("memberStudent")
            .value;

    const password =
        document
            .getElementById("memberPassword")
            .value;

    const student =
        appState.siswa[studentId];

    if (!student) {

        showToast(
            "Siswa tidak ditemukan.",
            "error"
        );

        return;
    }

    const correctPassword =
        student.password || "123456";

    if (password !== correctPassword) {

        showToast(
            "Password salah.",
            "error"
        );

        return;
    }

    const session = {

        role: "anggota",

        userId: studentId,

        name: student.nama
    };

    sessionStorage.setItem(
        "kasKelasSession",
        JSON.stringify(session)
    );

    startApp(session);
}


function startApp(session) {

    appState.currentRole =
        session.role;

    appState.currentUser =
        session.userId;

    appState.activeTab =
        "beranda";

    document
        .getElementById("loginScreen")
        .classList.add("hide");

    document
        .getElementById("appScreen")
        .classList.remove("hide");

    renderSidebar();

    renderPage();

    showWelcome(
        `Selamat datang, ${session.name || "Pengguna"}`
    );
}


function restoreSession() {

    try {

        const raw =
            sessionStorage.getItem(
                "kasKelasSession"
            );

        if (!raw) return;

        const session =
            JSON.parse(raw);

        if (
            session.role &&
            session.userId
        ) {
            startApp(session);
        }

    } catch (error) {

        sessionStorage.removeItem(
            "kasKelasSession"
        );
    }
}

        getMenus()
            .map(x => x[0]);

        tab = "beranda";
    }

    appState.activeTab = tab;

    renderSidebar();

    renderPage();
}

        .getElementById("sidebar")
        .classList.add("open");

    document
        .getElementById("sidebarOverlay")
        .classList.add("open");

    document.body.style.overflow =
        "hidden";
}


function closeSidebar() {

    document
        .getElementById("sidebar")
        .classList.remove("open");

    document
        .getElementById("sidebarOverlay")
        .classList.remove("open");

    document.body.style.overflow =
        "";
}

/* Swipe sidebar */

let touchStartX = 0;

document.addEventListener(
    "touchstart",
    e => {

        touchStartX =
            e.touches[0].clientX;
    },
    { passive: true }
);


document.addEventListener(
    "touchend",
    e => {

        const endX =
            e.changedTouches[0].clientX;

        const diff =
            endX - touchStartX;

        if (
            Math.abs(diff) < 60
        ) return;

        const sidebar =
            document.getElementById("sidebar");

        if (
            diff > 60 &&
            touchStartX < 40
        ) {
            openSidebar();
        }

        if (
            diff < -60 &&
            sidebar.classList.contains("open")
        ) {
            closeSidebar();
        }

    },
    { passive: true }
);


document.addEventListener(
    "keydown",
    e => {

        if (e.key === "Escape") {
            closeSidebar();
        }
    }
);

function bindKasMasuk() {

    if (appState.currentRole !== "bendahara") {
        return;
    }

    const monthSelect =
        document.getElementById("paymentMonth");

    const weekSelect =
        document.getElementById("paymentWeek");

    const studentSelect =
        document.getElementById("paymentStudent");

    if (!monthSelect) return;


    populatePaymentMonths();

    updatePaymentWeeks();

    monthSelect.addEventListener(
        "change",
        () => {
            updatePaymentWeeks();
            updateSelectedStudentStatus();
        }
    );


    weekSelect.addEventListener(
        "change",
        updateSelectedStudentStatus
    );


    studentSelect.addEventListener(
        "change",
        updateSelectedStudentStatus
    );


    document
        .getElementById("paymentForm")
        .addEventListener(
            "submit",
            savePayment
        );


    document
        .getElementById("settlePaymentBtn")
        .addEventListener(
            "click",
            () => {

                const studentId =
                    studentSelect.value;

                if (!studentId) {

                    showToast(
                        "Pilih siswa terlebih dahulu.",
                        "error"
                    );

                    return;
                }

                settleStudentArrears(
                    studentId
                );
            }
        );

    updateSelectedStudentStatus();
}


function populatePaymentMonths() {

    const select =
        document.getElementById("paymentMonth");

    if (!select) return;

    const now = new Date();

    const currentMonth =
        now.getMonth() + 1;

    select.innerHTML = "";

    for (
        let month = 1;
        month <= currentMonth;
        month++
    ) {

        select.innerHTML += `
            <option value="${month}">
                ${monthName(month)}
            </option>
        `;
    }

    select.value = currentMonth;
}


function updatePaymentWeeks() {

    const monthSelect =
        document.getElementById("paymentMonth");

    const weekSelect =
        document.getElementById("paymentWeek");

    if (
        !monthSelect ||
        !weekSelect
    ) return;

    const month =
        Number(monthSelect.value);

    const now =
        new Date();

    const currentMonth =
        now.getMonth() + 1;

    let maxWeek =
        getWeeksInMonth(
            CURRENT_YEAR,
            month
        );

    if (month === currentMonth) {

        maxWeek =
            Math.min(
                maxWeek,
                getCurrentWeek()
            );
    }

    weekSelect.innerHTML = "";

    for (
        let week = 1;
        week <= maxWeek;
        week++
    ) {

        const period =
            getPeriod(
                CURRENT_YEAR,
                month,
                week
            );

        weekSelect.innerHTML += `
            <option value="${week}">
                Minggu ${week} (${period.start.getDate()}-${period.end.getDate()} ${monthName(month)})
            </option>
        `;
    }
}

async function savePayment(event) {

    event.preventDefault();

    const studentId =
        document.getElementById(
            "paymentStudent"
        ).value;

    const month =
        Number(
            document.getElementById(
                "paymentMonth"
            ).value
        );

    const week =
        Number(
            document.getElementById(
                "paymentWeek"
            ).value
        );

    const description =
        document.getElementById(
            "paymentDescription"
        ).value.trim();


    if (!studentId) {

        showToast(
            "Pilih siswa.",
            "error"
        );

        return;
    }


    const student =
        appState.siswa[studentId];

    const period =
        getPeriod(
            CURRENT_YEAR,
            month,
            week
        );


    /*
       STATUS TIDAK BOLEH DUPLIKAT.
    */
    if (
        isPeriodPaid(
            studentId,
            period.key
        )
    ) {

        showToast(
            "Periode tersebut sudah dibayar.",
            "error"
        );

        return;
    }


    const weeklyFee =
        Number(
            appState.settings.weeklyFee || 0
        );

    if (weeklyFee <= 0) {

        showToast(
            "Nominal kas belum diatur.",
            "error"
        );

        return;
    }


    const today =
        todayISO();

    /*
       1. Buat RIWAYAT KAS MASUK
    */

    const transactionRef =
        push(
            ref(
                db,
                "kelasVIIIB/kasMasuk"
            )
        );

    /*
       2. Buat STATUS PEMBAYARAN TERPISAH
    */

    const statusRef =
        ref(
            db,
            `kelasVIIIB/pembayaranStatus/${studentId}/${period.key}`
        );


    const transactionData = {

        siswaId: studentId,

        nama:
            student.nama,

        jumlah:
            weeklyFee,

        tanggal:
            today,

        periodeKey:
            period.key,

        periodeLabel:
            period.label,

        keterangan:
            description ||
            `Pembayaran ${period.label}`,

        createdAt:
            Date.now()
    };


    const statusData = {

        paid: true,

        siswaId:
            studentId,

        nama:
            student.nama,

        jumlah:
            weeklyFee,

        tanggal:
            today,

        periodeKey:
            period.key,

        periodeLabel:
            period.label,

        updatedAt:
            Date.now()
    };


    try {

        await set(
            transactionRef,
            transactionData
        );

        await set(
            statusRef,
            statusData
        );


        document.getElementById(
            "paymentDescription"
        ).value = "";


        showToast(
            `${student.nama} berhasil membayar ${period.label}.`,
            "success"
        );


        renderPage();

    } catch (error) {

        console.error(error);

        showToast(
            "Gagal menyimpan pembayaran.",
            "error"
        );
    }
}


window.savePayment = savePayment;


/* =====================================================

===================================================== */

async function settleStudentArrears(studentId) {

    const student =
        appState.siswa[studentId];

    if (!student) {

        showToast(
            "Siswa tidak ditemukan.",
            "error"
        );

        return;
    }

    const summary =
        getStudentPaymentSummary(
            studentId
        );

    if (summary.unpaidWeeks === 0) {

        showToast(
            `${student.nama} sudah lunas.`,
            "success"
        );

        return;
    }


    const total =
        summary.arrears;

    showConfirmModal({

        title: "Lunaskan Kas",

        message:
            `Lunaskan ${summary.unpaidWeeks} minggu tunggakan ${student.nama} sebesar ${rupiah(total)}?`,

        confirmText: "Ya, Lunaskan",

        cancelText: "Batal",

        onConfirm: async () => {

            const weeklyFee =
                Number(
                    appState.settings.weeklyFee || 0
                );

            if (weeklyFee <= 0) {

                showToast(
                    "Nominal kas belum diatur.",
                    "error"
                );

                return;
            }


            const unpaid =
                getUnpaidPeriods(
                    studentId
                );

            if (!unpaid.length) {

                showToast(
                    "Siswa sudah lunas.",
                    "success"
                );

                return;
            }


            const updates = {};

            const today =
                todayISO();


            /*
               Satu pembayaran untuk
               satu periode.
            */

            unpaid.forEach(period => {

                const transactionKey =
                    push(
                        ref(
                            db,
                            "kelasVIIIB/kasMasuk"
                        )
                    ).key;


                updates[
                    `kelasVIIIB/kasMasuk/${transactionKey}`
                ] = {

                    siswaId:
                        studentId,

                    nama:
                        student.nama,

                    jumlah:
                        weeklyFee,

                    tanggal:
                        today,

                    periodeKey:
                        period.key,

                    periodeLabel:
                        period.label,

                    keterangan:
                        `Pelunasan ${period.label}`,

                    createdAt:
                        Date.now()
                };


                /*
                   STATUS PERIODE DISIMPAN
                   TERPISAH DARI RIWAYAT.
                */

                updates[
                    `kelasVIIIB/pembayaranStatus/${studentId}/${period.key}`
                ] = {

                    paid: true,

                    siswaId:
                        studentId,

                    nama:
                        student.nama,

                    jumlah:
                        weeklyFee,

                    tanggal:
                        today,

                    periodeKey:
                        period.key,

                    periodeLabel:
                        period.label,

                    updatedAt:
                        Date.now()
                };

            });


            try {

                await update(
                    ref(db),
                    updates
                );


                showToast(
                    `${student.nama} berhasil dilunasi sebesar ${rupiah(unpaid.length * weeklyFee)}.`,
                    "success"
                );


                renderPage();

            } catch (error) {

                console.error(error);

                showToast(
                    "Gagal melunasi tunggakan.",
                    "error"
                );
            }
        }
    });
}

async function saveKasKeluar(event) {

    event.preventDefault();

    const tanggal =
        document.getElementById(
            "expenseDate"
        ).value;

    const jumlah =
        Number(
            document.getElementById(
                "expenseAmount"
            ).value
        );

    const keterangan =
        document.getElementById(
            "expenseDescription"
        ).value.trim();


    if (!tanggal || jumlah <= 0 || !keterangan) {

        showToast(
            "Lengkapi data pengeluaran.",
            "error"
        );

        return;
    }


    const newRef =
        push(
            ref(
                db,
                "kelasVIIIB/kasKeluar"
            )
        );


    try {

        await set(
            newRef,
            {

                tanggal,

                jumlah,

                keterangan,

                createdAt:
                    Date.now()
            }
        );


        showToast(
            "Pengeluaran berhasil disimpan.",
            "success"
        );


        renderPage();

    } catch (error) {

        console.error(error);

        showToast(
            "Gagal menyimpan pengeluaran.",
            "error"
        );
    }
}

function bindSettings() {

    const form =
        document.getElementById(
            "settingsForm"
        );

    if (!form) return;

    form.addEventListener(
        "submit",
        saveSettings
    );
}


async function saveSettings(event) {

    event.preventDefault();

    let weeklyFee =
        Number(
            document.getElementById(
                "weeklyFee"
            ).value
        );

    let startDate =
        document.getElementById(
            "startDate"
        ).value;


    if (weeklyFee < 0) {
        weeklyFee = 0;
    }


    /*
       Pastikan startDate tetap
       pada tahun berjalan.
    */

    if (
        !startDate ||
        !startDate.startsWith(
            String(CURRENT_YEAR)
        )
    ) {

        startDate =
            `${CURRENT_YEAR}-01-01`;
    }


    try {

        await set(
            ref(
                db,
                "kelasVIIIB/settings"
            ),
            {

                weeklyFee,

                startDate,

                updatedAt:
                    Date.now()
            }
        );


        showToast(
            "Pengaturan berhasil disimpan.",
            "success"
        );

    } catch (error) {

        showToast(
            "Gagal menyimpan pengaturan.",
            "error"
        );
    }
}

    container.innerHTML = `

                            : "fa-circle-question"

                        <h3 class="font-bold navy">
                            ${esc(title)}

                        <p class="text-xs text-gray-500 mt-2 leading-relaxed">

                                : "bg-navy"}">
                        ${esc(confirmText)}
                    </button>

                </div>

            </div>

        </div>
    `;


    document.getElementById(
        "modalCancel"

    document.getElementById(

function showToast(message, type = "success") {

    const container =
        document.getElementById(
            "toastContainer"
        );

    const toast =
        document.createElement("div");

    toast.className =
        "toast";

    const icon =
        type === "error"
            ? "fa-circle-exclamation"
            : "fa-circle-check";

    toast.innerHTML = `

        <div class="flex items-center gap-3">

            <i class="fa-solid ${icon}"></i>

            <span>
                ${esc(message)}
            </span>

        </div>
    `;

    container.appendChild(toast);

    setTimeout(() => {

        toast.remove();

    }, 3500);
}

                "bendaharaPassword"
            ).value = "";

            document.getElementById(
                "memberPassword"
            ).value = "";

            appState.currentRole = null;
            appState.currentUser = null;
        }
    });
}

/* =====================================================
   PAGE SPECIFIC BINDING
===================================================== */

const originalRenderPage =
    renderPage;


/*
   Bungkus renderPage agar form
   siswa dan settings tetap aktif.
*/

window.setActiveTab = setActiveTab;


/* Override internal function reference */
renderPage = function() {

    const content =
        document.getElementById(
            "pageContent"
        );

    const titles = {

        beranda: [
            "Beranda",
            "Ringkasan keuangan kelas"
        ],

        kasMasuk: [
            "Kas Masuk",
            "Pembayaran dan riwayat uang kas"
        ],

        kasKeluar: [
            "Kas Keluar",
            "Catatan pengeluaran kas"
        ],

        siswa: [
            "Daftar Siswa",
            "Data anggota kelas"
        ],

        siswaNunggak: [
            "Siswa Nunggak",
            "Daftar siswa yang belum melunasi kas"
        ],

        settings: [
            "Pengaturan Kas",
            "Atur nominal dan awal periode kas"
        ]
    };


    const title =
        titles[appState.activeTab] ||
        titles.beranda;


    document.getElementById(
        "pageTitle"
    ).textContent = title[0];

    document.getElementById(
        "pageSubtitle"
    ).textContent = title[1];


    switch (appState.activeTab) {

        case "kasMasuk":

            content.innerHTML =
                renderKasMasuk();

            bindKasMasuk();

            break;


        case "kasKeluar":

            content.innerHTML =
                renderKasKeluar();

            bindKasKeluar();

            break;


        case "siswa":

            content.innerHTML =
                renderSiswa();

            bindSiswaForm();

            break;


        case "siswaNunggak":

            content.innerHTML =
                renderSiswaNunggak();

            break;


        case "settings":

            content.innerHTML =
                renderSettings();

            bindSettings();

            break;


        default:

            content.innerHTML =
                renderDashboard();
    }
};
