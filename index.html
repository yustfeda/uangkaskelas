/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

    if(value === undefined || value === null) return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function rupiah(value){

    return new Intl.NumberFormat("id-ID",{
        style:"currency",
        currency:"IDR",
        maximumFractionDigits:0
    }).format(Number(value)||0);
}


function todayISO(){

    const d = new Date();

    const y = d.getFullYear();

    const m = String(d.getMonth()+1).padStart(2,"0");

    const day = String(d.getDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;

}


function formatDate(date){

    if(!date) return "-";

    const d = new Date(date);

    if(isNaN(d)) return date;

    return d.toLocaleDateString("id-ID",{
        day:"2-digit",
        month:"long",
        year:"numeric"
    });

}


function formatShortDate(date){

    const d = new Date(date);

    return d.toLocaleDateString("id-ID",{
        day:"numeric",
        month:"short"
    });

}


function startOfDay(d){

    return new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
    );

}


/* =========================================================
   SISTEM MINGGU KALENDER
   SENIN - MINGGU

   Bulan ditentukan berdasarkan hari Kamis.
========================================================= */

function mondayOfWeek(date){

    const d = startOfDay(date);

    const day = d.getDay();

    const diff = day === 0 ? -6 : 1 - day;

    d.setDate(d.getDate()+diff);

    return d;

}


function sundayOfWeek(date){

    const d = mondayOfWeek(date);

    d.setDate(d.getDate()+6);

    return d;

}


function getWeekOwnerMonth(monday){

    const thursday = new Date(monday);

    thursday.setDate(thursday.getDate()+3);

    return {
        year:thursday.getFullYear(),
        month:thursday.getMonth()+1
    };

}


function getCalendarWeeksForMonth(year,month){

    const firstDay = new Date(year,month-1,1);

    const lastDay = new Date(year,month,0);

    let monday = mondayOfWeek(firstDay);

    const result = [];

    const limit = new Date(
        year,
        month-1,
        lastDay.getDate()+7
    );

    while(monday <= limit){

        const owner = getWeekOwnerMonth(monday);

        if(
            owner.year === year &&
            owner.month === month
        ){

            const sunday = sundayOfWeek(monday);

            result.push({
                monday:new Date(monday),
                sunday:new Date(sunday)
            });

        }

        monday.setDate(monday.getDate()+7);

    }

    return result;

}


function getPeriodKey(year,month,index){

    return `${year}-${String(month).padStart(2,"0")}-W${index+1}`;

}


function getPeriodLabel(year,month,index,period){

    return `${MONTH_NAMES[month-1]} ${year} - Minggu ${index+1} (${formatShortDate(period.monday)}–${formatShortDate(period.sunday)})`;

}


function getPeriodsForMonth(year,month){

    const weeks = getCalendarWeeksForMonth(year,month);

    return weeks.map((w,index)=>({

        key:getPeriodKey(year,month,index),

        year,

        month,

        index,

        monday:w.monday,

        sunday:w.sunday,

        label:getPeriodLabel(year,month,index,w)

    }));

}


function getExpectedPeriods(){

    const today = startOfDay(new Date());

    const periods = [];

    const startDate = new Date(
        appState.settings.startDate ||
        `${CURRENT_YEAR}-01-01`
    );

    for(let month=1; month<=today.getMonth()+1; month++){

        const monthPeriods =
            getPeriodsForMonth(CURRENT_YEAR,month);

        monthPeriods.forEach(period=>{

            /*
             * Tanggal mulai hanya menjadi batas awal pembayaran.
             * Tidak digunakan untuk menentukan minggu.
             */

            if(period.sunday < startDate) return;

            if(period.monday > today) return;

            periods.push(period);

        });

    }

    return periods;

}


function getCurrentMonthPeriods(){

    return getPeriodsForMonth(
        CURRENT_YEAR,
        new Date().getMonth()+1
    ).filter(p=>p.monday <= startOfDay(new Date()));

}


function isPeriodPaid(studentId,periodKey){

    return !!(
        appState.pembayaranStatus?.[studentId]?.[periodKey]?.paid
    );

}


function getUnpaidPeriods(studentId){

    return getExpectedPeriods()
        .filter(period=>!isPeriodPaid(studentId,period.key));

}


function getCurrentMonthUnpaid(studentId){

    return getCurrentMonthPeriods()
        .filter(period=>!isPeriodPaid(studentId,period.key));

}


function getStudentPaymentTotal(studentId){

    let total = 0;

    const data =
        appState.pembayaranStatus?.[studentId] || {};

    Object.values(data).forEach(item=>{

        if(item?.paid){

            total += Number(item.jumlah)||0;

        }

    });

    return total;

}


/* =========================================================
   TOTAL KAS
========================================================= */

/*
 * Total kas berasal dari pembayaranStatus.
 *
 * Jadi apabila riwayat kas masuk dihapus,
 * pembayaran yang sudah lunas tetap dihitung.
 */

function getTotalPersistentKas(){

    let total = 0;

    const status =
        appState.pembayaranStatus || {};

    Object.values(status).forEach(studentData=>{

        Object.values(studentData || {}).forEach(payment=>{

            if(payment?.paid){

                total += Number(payment.jumlah)||0;

            }

        });

    });


    /*
     * Kas masuk lain yang bukan pembayaran siswa.
     */

    Object.values(appState.kasMasuk || {}).forEach(tx=>{

        if(
            !tx?.siswaId &&
            !tx?.periodeKey
        ){

            total += Number(tx.jumlah)||0;

        }

    });


    return total;

}


function getTotalKasKeluar(){

    return Object.values(appState.kasKeluar || {})
        .reduce(
            (sum,item)=>sum+(Number(item?.jumlah)||0),
            0
        );

}


function getSaldo(){

    return getTotalPersistentKas() -
           getTotalKasKeluar();

}


/* =========================================================

function getStudentStatus(studentId){

    const unpaid =
        getUnpaidPeriods(studentId);

    return {

        lunas:unpaid.length === 0,

        unpaidCount:unpaid.length,

        amount:
            unpaid.length *
            (Number(appState.settings.weeklyFee)||0)

    };

}

/* =========================================================
   REKONSILIASI PEMBAYARAN LAMA
========================================================= */

async function reconcilePaymentStatus(){

    if(reconciling) return;

    reconciling = true;

    try{

        const updates = {};

        for(
            const [txId,tx]
            of Object.entries(appState.kasMasuk || {})
        ){

            if(!tx) continue;

            if(!tx.siswaId) continue;

            let periodKey = tx.periodeKey;

            /*
             * Jika transaksi lama belum memiliki periodeKey,
             * coba tentukan dari tanggal pembayaran.
             */

            if(!periodKey && tx.tanggal){

                const date = new Date(tx.tanggal);

                const monday =
                    mondayOfWeek(date);

                const owner =
                    getWeekOwnerMonth(monday);

                if(
                    owner.year === CURRENT_YEAR
                ){

                    const periods =
                        getPeriodsForMonth(
                            owner.year,
                            owner.month
                        );

                    const index =
                        periods.findIndex(
                            p =>
                            p.monday.getTime() ===
                            monday.getTime()
                        );

                    if(index >= 0){

                        periodKey =
                            getPeriodKey(
                                owner.year,
                                owner.month,
                                index
                            );

                    }

                }

            }


            if(!periodKey) continue;


            const existing =
                appState.pembayaranStatus?.[
                    tx.siswaId
                ]?.[periodKey];


            if(!existing?.paid){

                updates[
                    `kelasVIIIB/pembayaranStatus/${tx.siswaId}/${periodKey}`
                ] = {

                    paid:true,

                    jumlah:
                        Number(tx.jumlah) ||
                        Number(appState.settings.weeklyFee) ||
                        0,

                    tanggal:
                        tx.tanggal ||
                        todayISO(),

                    kasMasukId:txId,

                    createdAt:
                        tx.createdAt ||
                        Date.now()

                };

            }

        }


        if(Object.keys(updates).length){

            await update(
                ref(db),
                updates
            );

        }

    }catch(error){

        console.error(
            "Gagal rekonsiliasi:",
            error
        );

    }finally{

        reconciling = false;

    }

}

    appState.currentUser = {

        id,

        nama:siswa.nama,

        ...siswa

    };

    appState.currentRole =
        "anggota";


    sessionStorage.setItem(
        "kasVIIIB_session",
        JSON.stringify({
            role:"anggota",
            id
        })
    );


    enterApp();

};


function enterApp(){

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("appPage")
        .classList.remove("hidden");


    setupSidebar();

    showPage("beranda");

    showWelcome();

}


/* =========================================================
   SESSION
========================================================= */

function checkSession(){

    startListeners();

    const session =
        sessionStorage.getItem(
            "kasVIIIB_session"
        );

    if(!session) return;

    try{

        const data =
            JSON.parse(session);

        if(data.role === "bendahara"){

            appState.currentUser = {
                id:"bendahara",
                nama:"Bendahara"
            };

            appState.currentRole =
                "bendahara";

            enterApp();

        }

        if(data.role === "anggota"){

            const siswa =
                appState.siswa[data.id];

            if(siswa){

                appState.currentUser = {
                    id:data.id,
                    nama:siswa.nama,
                    ...siswa
                };

                appState.currentRole =
                    "anggota";

                enterApp();

            }

        }

    }catch(e){

        sessionStorage.removeItem(
            "kasVIIIB_session"
        );

    }

}

function refreshLoginStudents(){

    const select =
        document.getElementById(
            "anggotaSelect"
        );

    if(!select) return;

    const current =
        select.value;

    select.innerHTML =
        `<option value="">Pilih nama siswa</option>`;

    Object.entries(appState.siswa || {})
        .filter(([id,s])=>s?.aktif !== false)
        .sort((a,b)=>
            String(a[1]?.nama || "")
            .localeCompare(
                String(b[1]?.nama || ""),
                "id"
            )
        )
        .forEach(([id,siswa])=>{

            select.innerHTML += `
                <option value="${escapeHtml(id)}">
                    ${escapeHtml(siswa.nama)}
                </option>
            `;

        });

    select.value = current;

/* =========================================================

========================================================= */

window.showPage = function(page){

    appState.activeTab = page;

    closeSidebar();

    document.querySelectorAll(".nav-item")
        .forEach(item=>{

            if(item.dataset.nav === page){

                item.classList.add(
                    "bg-white",
                    "text-slate-900"
                );

                item.classList.remove(
                    "text-slate-300"
                );

            }else{

                item.classList.remove(
                    "bg-white",
                    "text-slate-900"
                );

                item.classList.add(
                    "text-slate-300"
                );

            }

        });


    const titles = {

        beranda:[
            "Beranda",
            "Dashboard kas kelas"
        ],

        kasMasuk:[
            "Kas Masuk",
            "Pemasukan kas kelas"
        ],

        kasKeluar:[
            "Kas Keluar",
            "Pengeluaran kas kelas"
        ],

        siswa:[
            "Daftar Siswa",
            "Data siswa kelas VII B"
        ],

        siswaNunggak:[
            "Siswa Nunggak",
            "Daftar siswa yang memiliki tunggakan"
        ],

        pengaturan:[
            "Pengaturan",
            "Pengaturan kas kelas"
        ]

    };


    document.getElementById(
        "pageTitle"
    ).textContent =
        titles[page]?.[0] ||
        "Beranda";


    document.getElementById(
        "pageSubtitle"
    ).textContent =
        titles[page]?.[1] ||
        "";


    renderPage();

};


function renderPage(){

    const content =
        document.getElementById(
            "pageContent"
        );

    switch(appState.activeTab){

        case "kasMasuk":
            content.innerHTML =
                renderKasMasuk();
            break;

        case "kasKeluar":
            content.innerHTML =
                renderKasKeluar();
            break;

        case "siswa":
            content.innerHTML =
                renderSiswa();
            break;

        case "siswaNunggak":
            content.innerHTML =
                renderSiswaNunggak();
            break;

        case "pengaturan":
            content.innerHTML =
                renderPengaturan();
            break;

        default:
            content.innerHTML =
                renderBeranda();

    }

}

window.updatePaymentWeeks = function(){

    const monthEl =
        document.getElementById(
            "paymentMonth"
        );

    const periodEl =
        document.getElementById(
            "paymentPeriod"
        );

    if(!monthEl || !periodEl) return;

    const month =
        Number(monthEl.value);

    const periods =
        getPeriodsForMonth(
            CURRENT_YEAR,
            month
        )
        .filter(p=>p.monday <= startOfDay(new Date()));


    periodEl.innerHTML =
        periods.map(p=>`

            <option value="${p.key}">
                ${escapeHtml(
                    `Minggu ${p.index+1} (${formatShortDate(p.monday)}–${formatShortDate(p.sunday)})`
                )}
            </option>

        `).join("");


    updatePaymentForm();

};


window.updatePaymentForm = function(){

    const studentEl =
        document.getElementById(
            "paymentStudent"
        );

    const periodEl =
        document.getElementById(
            "paymentPeriod"
        );

    const info =
        document.getElementById(
            "paymentStatusInfo"
        );

    const btn =
        document.getElementById(
            "savePaymentBtn"
        );

    if(!studentEl || !periodEl || !info || !btn)
        return;


    const studentId =
        studentEl.value;

    const periodKey =
        periodEl.value;


    if(!studentId){

        info.innerHTML = "";

        btn.disabled = false;

        btn.classList.remove(
            "opacity-50",
            "cursor-not-allowed"
        );

        return;

    }


    const student =
        appState.siswa[studentId];

    const currentUnpaid =
        getCurrentMonthUnpaid(
            studentId
        );

    const selectedPaid =
        isPeriodPaid(
            studentId,
            periodKey
        );


    let html = "";


    /*
     * STATUS BULAN INI
     */

    if(currentUnpaid.length === 0){

        html += `

            <div class="p-3 rounded-xl
                        bg-green-50
                        border border-green-200
                        text-green-700 text-sm">

                <i class="fa-solid fa-circle-check mr-1"></i>

                <b>
                    ${escapeHtml(student?.nama || "")}
                </b>
                sudah melunasi kas bulan ini.

            </div>

        `;

    }else{

        html += `

            <div class="p-3 rounded-xl
                        bg-slate-50
                        border border-slate-200
                        text-slate-600 text-sm">

                <b>
                    ${escapeHtml(student?.nama || "")}
                </b>

                masih memiliki
                <b>${currentUnpaid.length}</b>
                periode belum dibayar bulan ini.

            </div>

        `;

    }


    /*
     * STATUS PERIODE TERPILIH
     */

    if(selectedPaid){

        html += `

            <div class="p-3 rounded-xl
                        bg-green-50
                        border border-green-200
                        text-green-700 text-sm mt-2">

                <i class="fa-solid fa-circle-check mr-1"></i>

                Periode ini sudah dibayar.

            </div>

        `;

        btn.disabled = true;

        btn.classList.add(
            "opacity-50",
            "cursor-not-allowed"
        );

    }else{

        btn.disabled = false;

        btn.classList.remove(
            "opacity-50",
            "cursor-not-allowed"
        );

    }


    info.innerHTML = html;

};

window.savePayment = async function(){

    const studentId =
        document.getElementById(
            "paymentStudent"
        )?.value;

    const periodKey =
        document.getElementById(
            "paymentPeriod"
        )?.value;


    if(!studentId){

        showToast(
            "Pilih siswa.",
            "error"
        );

        return;

    }


    if(!periodKey){

        showToast(
            "Pilih periode pembayaran.",
            "error"
        );

        return;

    }


    if(
        isPeriodPaid(
            studentId,
            periodKey
        )
    ){

        showToast(
            "Periode ini sudah dibayar.",
            "error"
        );

        return;

    }


    const student =
        appState.siswa[studentId];

    if(!student) return;


    const month =
        Number(
            document.getElementById(
                "paymentMonth"
            ).value
        );

    const periods =
        getPeriodsForMonth(
            CURRENT_YEAR,
            month
        );

    const period =
        periods.find(
            p=>p.key === periodKey
        );

    if(!period){

        showToast(
            "Periode tidak ditemukan.",
            "error"
        );

        return;

    }


    const amount =
        Number(
            appState.settings.weeklyFee
        ) || 0;


    const txRef =
        push(
            ref(db,"kelasVIIIB/kasMasuk")
        );

    const txId =
        txRef.key;


    const txData = {

        siswaId:studentId,

        nama:student.nama,

        jumlah:amount,

        tanggal:todayISO(),

        periodeKey:periodKey,

        periodeLabel:period.label,

        keterangan:
            `Pembayaran ${period.label}`,

        createdAt:Date.now()

    };


    const updates = {};


    updates[
        `kelasVIIIB/kasMasuk/${txId}`
    ] = txData;


    updates[
        `kelasVIIIB/pembayaranStatus/${studentId}/${periodKey}`
    ] = {

        paid:true,

        jumlah:amount,

        tanggal:todayISO(),

        kasMasukId:txId,

        createdAt:Date.now()

    };


    try{

        await update(
            ref(db),
            updates
        );

        showToast(
            "Pembayaran berhasil disimpan.",
            "success"
        );

    }catch(error){

        console.error(error);

        showToast(
            "Gagal menyimpan pembayaran.",
            "error"
        );

    }

};

window.lunaskanSiswa = function(){

    const studentId =
        document.getElementById(
            "paymentStudent"
        )?.value;

    if(!studentId){

        showToast(
            "Pilih siswa terlebih dahulu.",
            "error"
        );

        return;

    }


    const student =
        appState.siswa[studentId];

    if(!student) return;


    const unpaid =
        getUnpaidPeriods(studentId);

    const amount =
        unpaid.length *
        (Number(appState.settings.weeklyFee)||0);


    if(unpaid.length === 0){

        showToast(
            `${student.nama} sudah lunas.`,
            "success"
        );

        updatePaymentForm();

        return;

    }


    openConfirmModal(

        "Lunaskan Siswa",

        `
        <p class="text-sm text-slate-600">
            Apakah Anda yakin ingin melunaskan
            <b>${escapeHtml(student.nama)}</b>?
        </p>

        <div class="mt-3 p-3 rounded-xl bg-slate-50">

            <div class="flex justify-between">
                <span>Jumlah periode</span>
                <b>${unpaid.length}</b>
            </div>

            <div class="flex justify-between mt-1">
                <span>Total pembayaran</span>
                <b>${rupiah(amount)}</b>
            </div>

        </div>
        `,

        async()=>{

            const updates = {};

            unpaid.forEach(period=>{

                const txRef =
                    push(
                        ref(
                            db,
                            "kelasVIIIB/kasMasuk"
                        )
                    );

                const txId =
                    txRef.key;


                updates[
                    `kelasVIIIB/kasMasuk/${txId}`
                ] = {

                    siswaId:studentId,

                    nama:student.nama,

                    jumlah:
                        Number(
                            appState.settings.weeklyFee
                        ) || 0,

                    tanggal:todayISO(),

                    periodeKey:period.key,

                    periodeLabel:period.label,

                    keterangan:
                        `Pelunasan ${period.label}`,

                    createdAt:Date.now()

                };


                updates[
                    `kelasVIIIB/pembayaranStatus/${studentId}/${period.key}`
                ] = {

                    paid:true,

                    jumlah:
                        Number(
                            appState.settings.weeklyFee
                        ) || 0,

                    tanggal:todayISO(),

                    kasMasukId:txId,

                    createdAt:Date.now()

                };

            });


            try{

                await update(
                    ref(db),
                    updates
                );

                showToast(
                    `${student.nama} berhasil dilunaskan.`,
                    "success"
                );

            }catch(error){

                console.error(error);

                showToast(
                    "Gagal melakukan pelunasan.",
                    "error"
                );

            }

        }

    );

};

    if(!siswa) return;


    const paymentData =
        appState.pembayaranStatus?.[id] ||
        {};

    let paymentTotal = 0;

    Object.values(paymentData)
        .forEach(item=>{

            if(item?.paid){

                paymentTotal +=
                    Number(item.jumlah)||0;

            }

        });


    openConfirmModal(

        "Hapus Siswa",

        `
        <p class="text-sm text-slate-600">

            Apakah Anda yakin ingin menghapus
            <b>${escapeHtml(siswa.nama)}</b>?

        </p>

        ${
            paymentTotal > 0
            ?
            `
            <div class="mt-3 p-3 rounded-xl
                        bg-red-50 border border-red-200
                        text-red-700 text-sm">

                Siswa ini memiliki catatan pembayaran:

                <b>${rupiah(paymentTotal)}</b>

                <br><br>

                Jika siswa dihapus, seluruh pembayaran
                siswa tersebut juga dikeluarkan dari
                perhitungan total kas dan saldo.

            </div>
            `
            :
            ""
        }
        `,

        async()=>{

            try{

                const updates = {};


                /*
                 * Hapus siswa.
                 */

                updates[
                    `kelasVIIIB/siswa/${id}`
                ] = null;


                /*
                 * Hapus status pembayaran siswa.
                 * Dengan demikian total kas otomatis
                 * berkurang sesuai pembayaran siswa.
                 */

                updates[
                    `kelasVIIIB/pembayaranStatus/${id}`
                ] = null;


                /*
                 * Hapus seluruh riwayat kas masuk
                 * milik siswa tersebut.
                 */

                Object.entries(
                    appState.kasMasuk || {}
                )
                .forEach(([txId,tx])=>{

                    if(tx?.siswaId === id){

                        updates[
                            `kelasVIIIB/kasMasuk/${txId}`
                        ] = null;

                    }

                });


                await update(
                    ref(db),
                    updates
                );


                showToast(
                    `Data ${siswa.nama} berhasil dihapus. Total kas dan saldo telah disesuaikan.`,
                    "success"
                );


            }catch(error){

                console.error(error);

                showToast(
                    "Gagal menghapus siswa.",
                    "error"
                );

            }

        }

    );

};

window.executeResetKas = async function(){

        document.getElementById(

        showToast(
            "Kode reset salah.",
            "error"
        );

        return;

    }


    openConfirmModal(

        "Konfirmasi Reset",

        `
        <p class="text-sm text-slate-600">

            Kode reset benar.

            <br><br>

            Apakah Anda benar-benar ingin
            mereset seluruh data keuangan?

        async()=>{

            try{

                /*

                 */

                const updates = {

                    "kelasVIIIB/kasMasuk":null,

window.closeModal = function(){

};


function openConfirmModal(
    title,
    message,
    callback
){

    openModal(`

        <div class="card w-full max-w-md p-6">

            <div class="flex items-center gap-3 mb-4">

                <div class="w-11 h-11 rounded-xl

                <button onclick="closeModal()"

                class="flex-1 bg-slate-900
                       text-white py-3 rounded-xl
                       font-semibold">

                    Ya, Lanjutkan

                </button>

        </div>

        .getElementById(

        )
        .onclick = async()=>{

            await callback();

        };

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type="success"
){

    const container =
        document.getElementById(
            "toastContainer"
        );


    const id =
        "toast_"+Date.now();


    const icon =
        type === "error"
        ?
        "fa-circle-exclamation"
        :
        "fa-circle-check";


    const bg =
        type === "error"
        ?
        "bg-red-600"
        :
        "bg-slate-900";


    container.insertAdjacentHTML(
        "beforeend",

        `

        <div id="${id}"
        class="${bg} text-white px-4 py-3
               rounded-xl shadow-lg flex items-center
               gap-3 max-w-sm">

            <i class="fa-solid ${icon}"></i>

            <span class="text-sm">
                ${escapeHtml(message)}
            </span>

        </div>

        `
    );


    setTimeout(()=>{

        document
            .getElementById(id)
            ?.remove();

    },3500);

}

/* =========================================================
   MOBILE TOUCH SWIPE
========================================================= */

let touchStartX = 0;

document.addEventListener(
    "touchstart",
    e=>{

        touchStartX =
            e.touches[0].clientX;

    }
);


document.addEventListener(
    "touchend",
    e=>{

        const endX =
            e.changedTouches[0].clientX;

        const diff =
            endX-touchStartX;


        if(diff < -70){

            closeSidebar();

        }

    }
);

</script>
