<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAS KELAS VII B</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#0b1f3a;
    --navy2:#12345b;
    --green:#16a34a;
    --green2:#15803d;
    --white:#ffffff;
    --bg:#f4f7fb;
    --text:#172033;
    --muted:#6b7280;
    --border:#e5e7eb;
    --yellow:#f59e0b;
    --red:#dc2626;
    --shadow:0 8px 25px rgba(15,23,42,.08);
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
    border:none;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--navy),var(--navy2));
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.login-logo{
    width:75px;
    height:75px;
    border-radius:18px;
    background:var(--navy);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    font-size:30px;
    font-weight:bold;
}

.login-title{
    text-align:center;
    font-size:24px;
    font-weight:800;
    color:var(--navy);
}

.login-subtitle{
    text-align:center;
    color:var(--muted);
    margin:7px 0 25px;
    font-size:14px;
}

.login-tabs{
    display:flex;
    gap:8px;
    background:#f1f5f9;
    padding:5px;
    border-radius:12px;
    margin-bottom:20px;
}

.login-tabs button{
    flex:1;
    padding:11px;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    font-weight:700;
}

.login-tabs button.active{
    background:white;
    color:var(--navy);
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    background:white;
}

.form-group input:focus,
.form-group select:focus{
    border-color:var(--green);
}

.btn{
    padding:11px 16px;
    border-radius:10px;
    font-weight:700;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:var(--green);
    color:white;
}

.btn-primary:hover{
    background:var(--green2);
}

.btn-navy{
    background:var(--navy);
    color:white;
}

.btn-danger{
    background:var(--red);
    color:white;
}

.btn-warning{
    background:var(--yellow);
    color:white;
}

.btn-light{
    background:#eef2f7;
    color:#334155;
}

.btn-full{
    width:100%;
}

/* ================= APP ================= */

#appScreen{
    display:none;
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:255px;
    background:var(--navy);
    color:white;
    z-index:1000;
    transition:.3s ease;
    overflow-y:auto;
}

.sidebar-header{
    padding:24px 20px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.sidebar-title{
    font-size:18px;
    font-weight:800;
}

.sidebar-role{
    font-size:12px;
    color:#b8c7da;
    margin-top:5px;
}

.nav{
    padding:15px 10px;
}

.nav-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    margin-bottom:5px;
    border-radius:10px;
    color:#dce6f3;
    background:transparent;
    text-align:left;
    font-weight:600;
}

.nav-item:hover,
.nav-item.active{
    background:rgba(255,255,255,.11);
    color:white;
}

.nav-item.logout{
    color:#fecaca;
}

.main{
    margin-left:255px;
    min-height:100vh;
}

.topbar{
    height:65px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:500;
}

.topbar-title{
    font-size:18px;
    font-weight:800;
}

.hamburger{
    display:none;
    width:42px;
    height:42px;
    border-radius:10px;
    background:var(--navy);
    color:white;
    align-items:center;
    justify-content:center;
    font-size:22px;
    margin-right:12px;
}

.page{
    padding:25px;
    max-width:1500px;
    margin:auto;
}

/* ================= DASHBOARD ================= */

.welcome-card{
    background:linear-gradient(135deg,var(--navy),var(--navy2));
    color:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:var(--shadow);
}

.welcome-card h2{
    font-size:23px;
    margin-bottom:6px;
}

.welcome-card p{
    color:#c9d7e8;
    font-size:14px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:20px;
}

.stat-card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
    border:1px solid #edf0f5;
}

.stat-title{
    color:var(--muted);
    font-size:13px;
    font-weight:700;
    margin-bottom:10px;
}

.stat-value{
    font-size:23px;
    font-weight:800;
}

.stat-green .stat-value{
    color:var(--green);
}

.stat-red .stat-value{
    color:var(--red);
}

.stat-navy .stat-value{
    color:var(--navy);
}

.section{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
}

.section-title{
    font-size:17px;
    font-weight:800;
}

/* ================= PEMBAYARAN TERBARU ================= */

.payment-latest{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.payment-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:13px 15px;
    border:1px solid #edf0f5;
    border-radius:13px;
    background:linear-gradient(135deg,#fff,#f8fafc);
    transition:.2s;
}

.payment-card:hover{
    transform:translateY(-1px);
    box-shadow:0 5px 15px rgba(15,23,42,.06);
}

.payment-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.payment-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#dcfce7;
    color:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    flex-shrink:0;
}

.payment-info{
    min-width:0;
}

.payment-name{
    font-weight:800;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.payment-period{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
}

.payment-right{
    text-align:right;
    flex-shrink:0;
}

.payment-amount{
    color:var(--green);
    font-weight:800;
    font-size:14px;
}

.payment-date{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.view-all{
    width:100%;
    margin-top:4px;
    padding:11px;
    border-radius:10px;
    background:#eef7f1;
    color:var(--green2);
    font-weight:800;
}

.view-all:hover{
    background:#dcfce7;
}

.empty{
    padding:25px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
}

/* ================= TABLE ================= */

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th,td{
    padding:12px 10px;
    border-bottom:1px solid var(--border);
    text-align:left;
    font-size:13px;
}

th{
    background:#f8fafc;
    font-weight:800;
    color:#475569;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}

.badge-green{
    color:#166534;
    background:#dcfce7;
}

.badge-red{
    color:#991b1b;
    background:#fee2e2;
}

.action-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

/* ================= SETTINGS ================= */

.settings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.setting-card{
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
}

.setting-card h3{
    font-size:16px;
    margin-bottom:5px;
}

.setting-card p{
    color:var(--muted);
    font-size:12px;
    margin-bottom:15px;
}

/* ================= MODAL ================= */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(2,6,23,.58);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:3000;
    padding:20px;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:17px;
    padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    animation:modalIn .18s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(10px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.modal h3{
    font-size:18px;
    margin-bottom:8px;
}

.modal p{
    color:#64748b;
    font-size:14px;
    line-height:1.5;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
}

.modal-actions .btn{
    min-width:85px;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:var(--navy);
    color:white;
    padding:13px 18px;
    border-radius:11px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    z-index:5000;
    transform:translateY(100px);
    opacity:0;
    transition:.25s;
    font-size:13px;
    font-weight:700;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

.toast.success{
    background:var(--green);
}

.toast.error{
    background:var(--red);
}

/* ================= MOBILE ================= */

.overlay{
    display:none;
}

@media(max-width:850px){

    .sidebar{
        transform:translateX(-100%);
        width:270px;
        box-shadow:10px 0 30px rgba(0,0,0,.2);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
    }

    .hamburger{
        display:flex;
    }

    /*
      Saat sidebar terbuka, tombol hamburger disembunyikan
      agar tidak menutupi tulisan/menu sidebar.
    */
    body.sidebar-open .hamburger{
        display:none;
    }

    .overlay{
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.45);
        z-index:900;
    }

    .overlay.show{
        display:block;
    }

    .topbar{
        padding:0 14px;
    }

    .topbar-title{
        font-size:16px;
    }

    .page{
        padding:15px;
    }

    .stats{
        grid-template-columns:1fr;
        gap:12px;
    }

    .settings-grid{
        grid-template-columns:1fr;
    }

    .welcome-card{
        padding:20px;
    }

    .welcome-card h2{
        font-size:20px;
    }

    .section{
        padding:15px;
    }

    /*
      Pembayaran terbaru tetap berada di dalam card
      dan tidak membuat halaman melebar.
    */
    .payment-latest-wrap{
        width:100%;
        overflow-x:auto;
    }

    .payment-latest{
        min-width:0;
        width:100%;
    }

    .payment-card{
        min-width:0;
    }

    .payment-name{
        max-width:150px;
    }

    .btn{
        padding:10px 13px;
        font-size:13px;
    }
}

@media(max-width:480px){

    .login-box{
        padding:22px;
    }

    .page{
        padding:12px;
    }

    .payment-card{
        padding:11px;
    }

    .payment-icon{
        width:38px;
        height:38px;
    }

    .payment-name{
        max-width:120px;
    }

    .payment-amount{
        font-size:12px;
    }

    .payment-date{
        font-size:10px;
    }
}
</style>
</head>

<body>

<!-- ================= APP ================= -->

<div id="appScreen">

    <div class="overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">

</div>


<!-- ================= MODAL ================= -->

<div class="modal-overlay" id="modalOverlay">

    <div class="modal">

        <h3 id="modalTitle">Konfirmasi</h3>

        <div id="modalBody"></div>

        <div class="modal-actions" id="modalActions"></div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    set,
    push,
    update,
    remove,
    get
}
from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {
    apiKey: "AIzaSyAmy4PcVbc3bUnIEti0rhkhyPvGiLwFRYc",
    authDomain: "absenguru-615da.firebaseapp.com",
    databaseURL: "https://absenguru-615da-default-rtdb.firebaseio.com",
    projectId: "absenguru-615da",
    storageBucket: "absenguru-615da.firebasestorage.app",
    messagingSenderId: "1014411980118",
    appId: "1:1014411980118:web:6f3f702d8aad89af57faf7"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

const BASE = "kelasVIIIB";


/* ================= STATE ================= */

const appState = {
    siswa:{},
    kasMasuk:{},
    kasKeluar:{},
    pembayaranStatus:{},
    settings:{
        weeklyFee:10000,
        startDate:"",
        resetState:{
            cashInOffset:0,
            cashOutOffset:0
        },
        deletedStudents:{}
    }
};

let currentUser = null;
let currentPage = "dashboard";
let loginMode = "bendahara";
let reconcileRunning = false;


/* ================= HELPER ================= */

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function rupiah(value){
    return new Intl.NumberFormat("id-ID",{
        style:"currency",
        currency:"IDR",
        maximumFractionDigits:0
    }).format(Number(value)||0);
}

function formatDate(value){

    if(!value) return "-";

    const d = new Date(value);

    if(isNaN(d)) return "-";

    return d.toLocaleDateString("id-ID",{
        day:"2-digit",
        month:"short",
        year:"numeric"
    });
}

function formatDateTime(value){

    if(!value) return "-";

    const d = new Date(value);

    if(isNaN(d)) return "-";

    return d.toLocaleDateString("id-ID",{
        day:"2-digit",
        month:"short",
        year:"numeric"
    })+" "+d.toLocaleTimeString("id-ID",{
        hour:"2-digit",
        minute:"2-digit"
    });
}

function todayString(){

    const d = new Date();

    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;
}

function parseLocalDate(value){

    if(!value) return null;

    const parts = String(value).split("-");

    if(parts.length !== 3) return null;

    const d = new Date(
        Number(parts[0]),
        Number(parts[1])-1,
        Number(parts[2])
    );

    d.setHours(0,0,0,0);

    return d;
}

function dateKey(date){

    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}

function showToast(message,type="success"){

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.className = "toast show "+type;

    setTimeout(()=>{
        toast.className = "toast";
    },2500);
}


/* ================= MODAL ================= */

function openModal(title,body,actions){

    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = body;
    document.getElementById("modalActions").innerHTML = actions;

    document.getElementById("modalOverlay").classList.add("show");
}

function closeModal(){

    document.getElementById("modalOverlay").classList.remove("show");
}

window.closeModal = closeModal;


document.getElementById("modalOverlay").addEventListener("click",function(e){

    if(e.target === this){
        closeModal();
    }

});

document.addEventListener("keydown",function(e){

    if(e.key === "Escape"){
        closeModal();
        closeSidebar();
    }

});


function confirmAction(title,message,callback){

    openModal(
        title,
        `<p>${escapeHtml(message)}</p>`,
        `
        <button class="btn btn-light" onclick="closeModal()">
            Tidak
        </button>
        <button class="btn btn-danger" onclick="executeConfirm()">
            Ya
        </button>
        `
    );

    window.__confirmCallback = callback;
}

window.executeConfirm = function(){

    const callback = window.__confirmCallback;

    closeModal();

    if(typeof callback === "function"){
        window.__confirmCallback = null;
        callback();
    }

};


/* ================= SIDEBAR ================= */

function toggleSidebar(){

    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");

    sidebar.classList.toggle("open");
    overlay.classList.toggle("show");

    if(sidebar.classList.contains("open")){
        document.body.classList.add("sidebar-open");
        document.body.style.overflow = "hidden";
    }else{
        document.body.classList.remove("sidebar-open");
        document.body.style.overflow = "";
    }
}

window.toggleSidebar = toggleSidebar;


function closeSidebar(){

    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("show");

    document.body.classList.remove("sidebar-open");
    document.body.style.overflow = "";
}

window.closeSidebar = closeSidebar;


/* ================= LOGIN ================= */

function switchLogin(mode){

    loginMode = mode;

    const bendahara = document.getElementById("loginBendahara");
    const anggota = document.getElementById("loginAnggota");

    const tabB = document.getElementById("tabBendahara");
    const tabA = document.getElementById("tabAnggota");

    if(mode === "bendahara"){

        bendahara.classList.remove("hidden");
        anggota.classList.add("hidden");

        tabB.classList.add("active");
        tabA.classList.remove("active");

    }else{

/* ================= PAYMENT PERIOD ================= */

function getPaymentPeriods(){

    const start = parseLocalDate(appState.settings.startDate);

    if(!start) return [];

    const now = new Date();
    now.setHours(0,0,0,0);

    if(start > now) return [];

    const periods = [];

    let cursor = new Date(start);
    let number = 1;

    while(cursor <= now){

        const periodStart = new Date(cursor);

        const periodEnd = new Date(cursor);
        periodEnd.setDate(periodEnd.getDate()+6);

        periods.push({
            index:number,
            key:"P-"+dateKey(periodStart),
            start:periodStart,
            end:periodEnd,
            label:
                `Periode ${number} (${formatDate(periodStart)} - ${formatDate(periodEnd)})`
        });

        cursor.setDate(cursor.getDate()+7);
        number++;

        if(number > 1000) break;
    }

    return periods;
}


function isPaymentPaid(studentId,periodKey){

    return Boolean(
        appState.pembayaranStatus?.[studentId]?.[periodKey]?.paid
    );
}


/* ================= RECONCILE ================= */

async function reconcilePaymentStatus(){

    if(reconcileRunning) return;

    reconcileRunning = true;

    try{

        const updates = {};

        Object.entries(appState.kasMasuk).forEach(([id,item])=>{

            if(
                item &&
                item.jenis === "pembayaran" &&
                item.siswaId &&
                item.periodeKey
            ){

                const current =
                    appState.pembayaranStatus?.[item.siswaId]?.[item.periodeKey];

                if(!current || !current.paid){

                    updates[
                        `${BASE}/pembayaranStatus/${item.siswaId}/${item.periodeKey}`
                    ] = {
                        paid:true,
                        amount:Number(item.jumlah)||0,
                        tanggal:item.tanggal||new Date().toISOString(),
                        kasMasukId:id
                    };
                }
            }

        });

        if(Object.keys(updates).length){
            await update(ref(db),updates);
        }

    }catch(error){

        console.error(error);

    }finally{

        reconcileRunning = false;
    }
}


/* ================= CASH TOTAL ================= */

function getDeletedStudentIds(){

    return new Set(
        Object.keys(appState.settings.deletedStudents || {})
    );
}


function getPersistentPaymentTotal(){

    let total = 0;

    const deleted = getDeletedStudentIds();

    Object.entries(appState.pembayaranStatus || {})
    .forEach(([studentId,periods])=>{

        if(deleted.has(studentId)) return;

        Object.values(periods || {}).forEach(payment=>{

            if(payment?.paid){
                total += Number(payment.amount) || appState.settings.weeklyFee;
            }

        });

    });

    return total;
}


function getLegacyUnmatchedCashIn(){

    let total = 0;

    const deleted = getDeletedStudentIds();

    Object.entries(appState.kasMasuk || {})
    .forEach(([id,item])=>{

        if(!item) return;

        if(item.siswaId && deleted.has(item.siswaId)) return;

        if(
            item.jenis === "pembayaran" &&
            item.siswaId &&
            item.periodeKey
        ){

            const paid =
                appState.pembayaranStatus?.[
                    item.siswaId
                ]?.[
                    item.periodeKey
                ];

            if(paid?.paid) return;
        }

        total += Number(item.jumlah)||0;
    });

    return total;
}


function getRawCashIn(){

    return getPersistentPaymentTotal() +
           getLegacyUnmatchedCashIn();
}


function getRawCashOut(){

    return Object.values(appState.kasKeluar || {})
        .reduce((sum,item)=>
            sum+(Number(item?.jumlah)||0),0);
}


function getDisplayedCashIn(){

    const offset =
        Number(appState.settings.resetState?.cashInOffset)||0;

    return Math.max(0,getRawCashIn()-offset);
}


function getDisplayedCashOut(){

    const offset =
        Number(appState.settings.resetState?.cashOutOffset)||0;

    return Math.max(0,getRawCashOut()-offset);
}


function getBalance(){

    return getDisplayedCashIn()-getDisplayedCashOut();
}

function updatePaymentPeriodList(){

    const studentId =
        document.getElementById("paymentStudent")?.value;

    const select =
        document.getElementById("paymentPeriod");

    if(!select) return;

    const periods = getPaymentPeriods();

    if(!studentId){

        select.innerHTML =
            `<option value="">Pilih siswa terlebih dahulu</option>`;

        return;
    }

    const unpaid =
        periods.filter(p=>
            !isPaymentPaid(studentId,p.key)
        );

    select.innerHTML =
        `<option value="">Pilih periode</option>`+
        unpaid.map(p=>
            `
            <option value="${escapeHtml(p.key)}">
                ${escapeHtml(p.label)}
            </option>
            `
        ).join("");

    updatePaymentPreview();
}

function updatePaymentPreview(){

    const studentId =
        document.getElementById("paymentStudent")?.value;

    const periodKey =
        document.getElementById("paymentPeriod")?.value;

    const preview =
        document.getElementById("paymentPreview");

    if(!preview) return;

    const period =
        getPaymentPeriods()
        .find(p=>p.key===periodKey);

    if(!studentId || !period){

        preview.textContent =
            "Pilih siswa dan periode.";

        return;
    }

    preview.innerHTML = `
        <b>${escapeHtml(
            appState.siswa[studentId]?.nama || ""
        )}</b>
        <br>
        ${escapeHtml(period.label)}
        <br>
        <strong>
            Jumlah: ${rupiah(appState.settings.weeklyFee)}
        </strong>
    `;
}

async function savePayment(){

    const studentId =
        document.getElementById("paymentStudent").value;

    const periodKey =
        document.getElementById("paymentPeriod").value;

    if(!studentId || !periodKey){

        showToast("Lengkapi data pembayaran","error");
        return;
    }

    if(isPaymentPaid(studentId,periodKey)){

        showToast("Periode tersebut sudah dibayar","error");
        return;
    }

    const period =
        getPaymentPeriods()
        .find(p=>p.key===periodKey);

    if(!period) return;

    const amount =
        Number(appState.settings.weeklyFee)||0;

    const newRef =
        push(ref(db,`${BASE}/kasMasuk`));

    const data = {

        jenis:"pembayaran",

        siswaId:studentId,

        namaSiswa:
            appState.siswa[studentId]?.nama || "",

        periodeKey,

        periodeLabel:period.label,

        jumlah:amount,

        tanggal:new Date().toISOString(),

        createdAt:new Date().toISOString()

    };

    const updates = {};

    updates[
        `${BASE}/kasMasuk/${newRef.key}`
    ] = data;

    updates[
        `${BASE}/pembayaranStatus/${studentId}/${periodKey}`
    ] = {

        paid:true,

        amount,

        tanggal:data.tanggal,

        kasMasukId:newRef.key

    };

    try{

        await update(ref(db),updates);

        closeModal();

        showToast("Pembayaran berhasil disimpan");

    }catch(error){

        console.error(error);

        showToast("Gagal menyimpan pembayaran","error");
    }
}

function deleteStudent(id){

    const siswa = appState.siswa[id];

    confirmAction(
        "Hapus Siswa",
        `Data ${siswa?.nama||"siswa"} akan dihapus dari daftar siswa. Riwayat lama tetap disimpan. Lanjutkan?`,
        async()=>{

            try{

                const totalPaid =
                    Object.values(
                        appState.pembayaranStatus?.[id] || {}
                    )
                    .reduce((sum,p)=>
                        sum+
                        (p?.paid
                            ? Number(p.amount)||appState.settings.weeklyFee
                            :0),
                        0
                    );

                const updates = {};

                updates[
                    `${BASE}/settings/deletedStudents/${id}`
                ] = {

                    nama:siswa?.nama || "",

                    totalPaid,

                    deletedAt:new Date().toISOString()

                };

                updates[
                    `${BASE}/siswa/${id}`
                ] = null;

                await update(ref(db),updates);

                showToast("Siswa berhasil dihapus");

async function saveSettings(){

    const weeklyFee =
        Number(
            document.getElementById("settingWeeklyFee").value
        );

    const startDate =
        document.getElementById("settingStartDate").value;

    if(!weeklyFee || weeklyFee < 0){

        showToast(
            "Jumlah kas perminggu tidak valid",
            "error"
        );

        return;
    }

    if(!startDate){

        showToast(
            "Tanggal mulai wajib diisi",
            "error"
        );

        return;
    }

    try{

        await update(
            ref(db,`${BASE}/settings`),
            {
                weeklyFee,
                startDate
            }
        );

        /*
          Perubahan langsung tersimpan ke Firebase.
          Popup berhasil muncul setelah proses update berhasil.
        */

        showToast("Berhasil disimpan");

    }catch(error){

        console.error(error);

        showToast(
            "Gagal menyimpan pengaturan",
            "error"
        );
    }
}

            Batal

        <button class="btn btn-warning"

            Reset
        </button>

        `
    );
}

async function processReset(){

    const code =
        document.getElementById("resetCode").value;

    if(code !== "060999"){

        showToast("Kode reset salah","error");
        return;
    }

    try{

        const state =
            appState.settings.resetState || {};

        const newCashInOffset =
            getRawCashIn();

        const newCashOutOffset =
            getRawCashOut();

        await update(
            ref(db,`${BASE}/settings/resetState`),
            {
                cashInOffset:newCashInOffset,
                cashOutOffset:newCashOutOffset
            }
        );

        closeModal();

        showToast("Saldo berhasil direset");

    }catch(error){

        console.error(error);

        showToast("Gagal melakukan reset","error");
    }
}

window.processReset = processReset;


/* ================= SESSION ================= */

function restoreSession(){

    const raw =
        sessionStorage.getItem("kasKelasSession");

    if(!raw) return;

    try{

        const session = JSON.parse(raw);

        if(
            session &&
            (
                session.role === "bendahara" ||
                session.role === "anggota"
            )
        ){

            currentUser = session;

            showApp();
        }

    }catch(error){

        sessionStorage.removeItem("kasKelasSession");
    }
}


/* ================= START ================= */

initListeners();
restoreSession();
