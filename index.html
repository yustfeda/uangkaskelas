<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0b1f3a">
<title>KAS KELAS VII B</title>

<style>
:root{
    --navy:#0b1f3a;
    --navy2:#102d50;
    --navy3:#163c68;
    --green:#16a36a;
    --green2:#0d8755;
    --green-soft:#e9f8f1;
    --white:#fff;
    --bg:#f4f7fb;
    --text:#172033;
    --muted:#6b778c;
    --border:#e2e8f0;
    --yellow:#f4b400;
    --yellow-bg:#fff8df;
    --red:#dc3545;
    --red-bg:#fff0f2;
    --blue:#2878d7;
    --shadow:0 8px 25px rgba(11,31,58,.08);
    --radius:16px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
}

button,input,select,textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   LOGIN
========================= */
.login-screen{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
        radial-gradient(circle at top right,rgba(22,163,106,.18),transparent 35%),
        linear-gradient(135deg,#07182d,#0b1f3a 55%,#12365c);
}

.login-wrapper{
    width:100%;
    max-width:430px;
}

.login-brand{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

.brand-logo{
    width:64px;
    height:64px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 12px;
    background:linear-gradient(135deg,var(--green),#29c985);
    box-shadow:0 12px 30px rgba(0,0,0,.22);
    font-size:27px;
}

.login-brand h1{
    font-size:23px;
    font-weight:800;
    letter-spacing:-.4px;
}

.login-brand p{
    margin-top:5px;
    font-size:13px;
    opacity:.75;
}

.login-card{
    background:white;
    border-radius:22px;
    padding:25px;
    box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.login-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    background:#f1f4f8;
    padding:4px;
    border-radius:11px;
    margin-bottom:21px;
}

.login-tab{
    padding:10px;
    border-radius:8px;
    background:transparent;
    color:var(--muted);
    font-weight:700;
    transition:.2s;
}

.login-tab.active{
    background:white;
    color:var(--navy);
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.form-group{
    margin-bottom:15px;
}

.form-label{
    display:block;
    margin-bottom:7px;
    font-weight:700;
    font-size:13px;
}

.form-control{
    width:100%;
    min-height:44px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    outline:none;
    background:white;
    color:var(--text);
    transition:.2s;
}

.form-control:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(22,163,106,.1);
}

.login-btn{
    width:100%;
    min-height:45px;
    border-radius:10px;
    background:var(--navy);
    color:white;
    font-weight:800;
    margin-top:4px;
    transition:.2s;
}

.login-btn:hover{
    background:var(--navy3);
    transform:translateY(-1px);
}

.login-error{
    color:var(--red);
    background:var(--red-bg);
    border-radius:9px;
    padding:10px;
    margin-bottom:13px;
    font-size:12px;
}

/* =========================
   APP LAYOUT
========================= */
.app{
    min-height:100vh;
}

.sidebar{
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    bottom:0;
    width:260px;
    background:linear-gradient(180deg,var(--navy),#081a31);
    color:white;
    display:flex;
    flex-direction:column;
    box-shadow:8px 0 30px rgba(0,0,0,.08);
}

.sidebar-brand{
    padding:23px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.sidebar-brand-top{
    display:flex;
    align-items:center;
    gap:11px;
}

.sidebar-logo{
    width:40px;
    height:40px;
    border-radius:11px;
    background:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    flex:none;
}

.sidebar-title{
    font-weight:800;
    font-size:14px;
}

.sidebar-subtitle{
    color:rgba(255,255,255,.55);
    font-size:10px;
    margin-top:3px;
}

.nav-menu{
    padding:14px 10px;
    flex:1;
    overflow-y:auto;
}

.nav-section-title{
    color:rgba(255,255,255,.38);
    text-transform:uppercase;
    font-size:9px;
    font-weight:800;
    padding:9px 11px 6px;
    letter-spacing:.7px;
}

.nav-item{
    width:100%;
    min-height:41px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 11px;
    border-radius:9px;
    background:transparent;
    color:rgba(255,255,255,.72);
    text-align:left;
    margin-bottom:3px;
    font-size:12.5px;
    transition:.18s;
}

.nav-item:hover{
    background:rgba(255,255,255,.07);
    color:white;
}

.nav-item.active{
    background:rgba(22,163,106,.18);
    color:white;
    box-shadow:inset 3px 0 var(--green);
}

.nav-icon{
    width:20px;
    text-align:center;
    font-size:15px;
    flex:none;
}

.sidebar-footer{
    padding:12px;
    border-top:1px solid rgba(255,255,255,.08);
}

.user-mini{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px;
    background:rgba(255,255,255,.05);
    border-radius:10px;
}

.user-avatar{
    width:31px;
    height:31px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--green);
    color:white;
    font-size:11px;
    font-weight:800;
}

.user-mini strong{
    display:block;
    font-size:11px;
}

.user-mini span{
    display:block;
    font-size:9px;
    color:rgba(255,255,255,.5);
    margin-top:2px;
}

.main{
    margin-left:260px;
    min-height:100vh;
}

.topbar{
    height:65px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 27px;
    position:sticky;
    top:0;
    z-index:500;
}

.page-title{
    font-size:18px;
    font-weight:800;
    color:var(--navy);
}

.page-subtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:9px;
}

.top-date{
    font-size:11px;
    color:var(--muted);
}

.content{
    padding:25px;
    max-width:1500px;
    margin:auto;
}

/* =========================
   HAMBURGER
========================= */
.hamburger{
    display:none;
    width:40px;
    height:40px;
    position:fixed;
    left:12px;
    top:12px;
    z-index:1200;
    border-radius:10px;
    background:var(--navy);
    color:white;
    align-items:center;
    justify-content:center;
    font-size:19px;
    box-shadow:0 5px 18px rgba(0,0,0,.18);
    transition:.2s;
}

.sidebar-open .hamburger{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.mobile-overlay{
    display:none;
}

/* =========================
   COMMON
========================= */
.page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.page-header h2{
    font-size:21px;
    color:var(--navy);
}

.page-header p{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
}

.action-group{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.btn{
    min-height:38px;
    padding:8px 13px;
    border-radius:9px;
    font-size:12px;
    font-weight:750;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:.18s;
    white-space:nowrap;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:var(--green);
    color:white;
}

.btn-primary:hover{
    background:var(--green2);
}

.btn-dark{
    background:var(--navy);
    color:white;
}

.btn-secondary{
    background:#eef2f7;
    color:var(--navy);
}

.btn-danger{
    background:var(--red);
    color:white;
}

.btn-warning{
    background:var(--yellow);
    color:#332500;
}

.btn-outline{
    background:white;
    border:1px solid var(--border);
    color:var(--navy);
}

.btn-sm{
    min-height:33px;
    padding:7px 10px;
    font-size:11px;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
}

.card-header{
    padding:16px 18px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.card-title{
    font-size:14px;
    font-weight:800;
    color:var(--navy);
}

.card-body{
    padding:18px;
}

.empty{
    padding:35px 15px;
    text-align:center;
    color:var(--muted);
}

.empty-icon{
    font-size:30px;
    opacity:.55;
    margin-bottom:8px;
}

.empty p{
    font-size:12px;
}

/* =========================
   ALERTS
========================= */
.alert{
    border-radius:12px;
    padding:13px 15px;
    display:flex;
    gap:11px;
    align-items:flex-start;
    margin-bottom:17px;
    border:1px solid transparent;
}

.alert-warning{
    background:var(--yellow-bg);
    border-color:#f3d36b;
    color:#6a5100;
}

.alert-danger{
    background:var(--red-bg);
    border-color:#f1aeb5;
    color:#8d1d2a;
}

.alert-success{
    background:var(--green-soft);
    border-color:#a8e4ca;
    color:#0b7047;
}

.alert-icon{
    font-size:18px;
    flex:none;
}

.alert strong{
    display:block;
    font-size:12px;
    margin-bottom:3px;
}

.alert p{
    font-size:11px;
    line-height:1.5;
}

/* =========================
   DASHBOARD
========================= */
.welcome{
    background:
        radial-gradient(circle at 85% 20%,rgba(22,163,106,.35),transparent 30%),
        linear-gradient(135deg,var(--navy),var(--navy2));
    border-radius:18px;
    color:white;
    padding:22px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
}

.welcome h2{
    font-size:20px;
    margin-bottom:4px;
}

.welcome p{
    font-size:12px;
    color:rgba(255,255,255,.7);
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:18px;
}

.stat-card{
    background:white;
    border:1px solid var(--border);
    border-radius:14px;
    padding:17px;
    box-shadow:var(--shadow);
    min-width:0;
}

.stat-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.stat-label{
    color:var(--muted);
    font-size:11px;
    font-weight:700;
}

.stat-icon{
    width:34px;
    height:34px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--green-soft);
    color:var(--green);
}

.stat-value{
    color:var(--navy);
    font-size:22px;
    font-weight:850;
    letter-spacing:-.5px;
}

.stat-card.out .stat-icon{
    background:var(--red-bg);
    color:var(--red);
}

.stat-card.balance .stat-icon{
    background:#eaf2ff;
    color:var(--blue);
}

.dashboard-grid{
    display:grid;
    grid-template-columns:minmax(0,1.45fr) minmax(280px,.8fr);
    gap:18px;
}

.recent-payment-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.recent-payment-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:11px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#fff;
}

.payment-avatar{
    width:37px;
    height:37px;
    border-radius:10px;
    background:var(--navy);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:800;
    flex:none;
}

.payment-main{
    min-width:0;
    flex:1;
}

.payment-main strong{
    display:block;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.payment-main span{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

.payment-amount{
    text-align:right;
    flex:none;
}

.payment-amount strong{
    display:block;
    font-size:12px;
    color:var(--green2);
}

.payment-amount span{
    display:block;
    font-size:9px;
    color:var(--muted);
    margin-top:2px;
}

.view-all{
    width:100%;
    margin-top:9px;
}

.debt-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.debt-item{
    display:flex;
    align-items:center;
    gap:9px;
    padding:10px;
    background:var(--yellow-bg);
    border:1px solid #f0d57d;
    border-radius:10px;
}

.debt-item .payment-avatar{
    background:#8b6900;
}

.debt-main{
    flex:1;
    min-width:0;
}

.debt-main strong{
    display:block;
    font-size:11px;
}

.debt-main span{
    display:block;
    color:#806719;
    font-size:9px;
    margin-top:3px;
}

/* =========================
   TABLE
========================= */
.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th{
    background:#f7f9fc;
    color:#657287;
    text-transform:uppercase;
    font-size:9px;
    letter-spacing:.4px;
    text-align:left;
    padding:11px 13px;
    border-bottom:1px solid var(--border);
}

td{
    padding:12px 13px;
    border-bottom:1px solid var(--border);
    font-size:11px;
    vertical-align:middle;
}

tr:last-child td{
    border-bottom:0;
}

.status{
    display:inline-flex;
    align-items:center;
    padding:4px 7px;
    border-radius:20px;
    font-size:9px;
    font-weight:800;
}

.status-success{
    color:#087047;
    background:var(--green-soft);
}

.status-warning{
    color:#765900;
    background:var(--yellow-bg);
}

.status-danger{
    color:#a21f2d;
    background:var(--red-bg);
}

.action-buttons{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

/* =========================
   MOBILE CARDS
========================= */
.mobile-record-list{
    display:none;
}

.record-card{
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    background:white;
    margin-bottom:9px;
}

.record-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
}

.record-row:last-child{
    margin-bottom:0;
}

.record-label{
    color:var(--muted);
    font-size:9px;
}

.record-value{
    font-size:11px;
    font-weight:700;
    text-align:right;
}

/* =========================
   STUDENTS
========================= */
.student-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.student-card{
    background:white;
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
}

.student-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.student-avatar{
    width:42px;
    height:42px;
    border-radius:11px;
    background:var(--navy);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:12px;
}

.student-info{
    min-width:0;
    flex:1;
}

.student-info strong{
    display:block;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.student-info span{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

.student-meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-bottom:11px;
}

.meta-box{
    background:#f7f9fc;
    border-radius:8px;
    padding:7px;
}

.meta-box small{
    display:block;
    color:var(--muted);
    font-size:8px;
}

.meta-box strong{
    display:block;
    font-size:10px;
    margin-top:2px;
}

.student-actions{
    display:flex;
    gap:6px;
}

/* =========================
   FILTER
========================= */
.filter-bar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
}

.search-input{
    max-width:320px;
}

/* =========================
   SETTINGS
========================= */
.settings-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:17px;
}

.setting-card{
    padding:19px;
}

.setting-card h3{
    font-size:14px;
    color:var(--navy);
    margin-bottom:4px;
}

.setting-card>p{
    font-size:10px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:17px;
}

.setting-note{
    background:#f7f9fc;
    border-radius:9px;
    padding:10px;
    font-size:10px;
    color:var(--muted);
    line-height:1.5;
    margin-top:10px;
}

/* =========================
   MODAL
========================= */
.modal-overlay{
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(3,14,28,.62);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:17px;
    backdrop-filter:blur(4px);
}

.modal-card{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:18px;
    box-shadow:0 25px 80px rgba(0,0,0,.25);
    animation:modalIn .18s ease;
}

@keyframes modalIn{
    from{opacity:0;transform:translateY(10px) scale(.98)}
    to{opacity:1;transform:none}
}

.modal-head{
    padding:17px 19px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.modal-head h3{
    font-size:15px;
    color:var(--navy);
}

.modal-close{
    width:30px;
    height:30px;
    border-radius:8px;
    background:#f1f4f8;
    color:var(--muted);
    font-size:17px;
}

.modal-body{
    padding:19px;
}

.modal-footer{
    padding:13px 19px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:7px;
}

.confirm-icon{
    width:50px;
    height:50px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--yellow-bg);
    color:#a87800;
    font-size:22px;
    margin:0 auto 12px;
}

.confirm-text{
    text-align:center;
}

.confirm-text h3{
    color:var(--navy);
    font-size:16px;
}

.confirm-text p{
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
    margin-top:6px;
}

/* payment periods */
.period-list{
    display:flex;
    flex-direction:column;
    gap:7px;
    max-height:310px;
    overflow-y:auto;
}

.period-item{
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    display:flex;
    align-items:center;
    gap:9px;
}

.period-check{
    width:17px;
    height:17px;
    accent-color:var(--green);
}

.period-info{
    flex:1;
    min-width:0;
}

<script type="module">

} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

/* =========================================================
   FIREBASE

const firebaseConfig = {
    apiKey: "AIzaSyAmy4PcVbc3bUnIEti0rkhhyPvGiLwFRYc",

    databaseURL: "https://absenguru-615da-default-rtdb.firebaseio.com",
    projectId: "absenguru-615da",

    messagingSenderId: "1014411980118",
    appId: "1:1014411980118:web:6f3f702d8aad89af57faf7"
};

const ROOT = "kelasVIIIB";

const BENDAHARA_USERNAME = "iissumirat123";
const BENDAHARA_PASSWORD = "112233";
const DEFAULT_STUDENT_PASSWORD = "123456";
const RESET_CODE = "060999";

/* =========================================================
   STATE
========================================================= */

const appState = {
    siswa:{},
    kasMasuk:{},
    kasKeluar:{},
    pembayaranStatus:{},
    settings:{
        weeklyFee:10000,
        startDate:"2026-01-05",
        resetState:{
            cashInOffset:0,
            cashOutOffset:0
        },
        deletedStudents:{}
    }
};

let currentUser = null;
let currentPage = "dashboard";
let listenersStarted = false;
let reconcileRunning = false;

/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function escapeHtml(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function formatRupiah(value){
    const number = Number(value || 0);
    return new Intl.NumberFormat("id-ID",{
        style:"currency",
        currency:"IDR",
        maximumFractionDigits:0
    }).format(number);
}

function formatDate(dateValue){
    if(!dateValue) return "-";

    const d = dateValue instanceof Date
        ? dateValue
        : new Date(dateValue);

    if(Number.isNaN(d.getTime())) return "-";

    return new Intl.DateTimeFormat("id-ID",{
        day:"2-digit",
        month:"short",
        year:"numeric"
    }).format(d);
}

function formatDateTime(timestamp){
    if(!timestamp) return "-";

    const d = new Date(timestamp);

    if(Number.isNaN(d.getTime())) return "-";

    return new Intl.DateTimeFormat("id-ID",{
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    }).format(d);
}

function pad(n){
    return String(n).padStart(2,"0");
}

function parseLocalDate(value){
    const parts = String(value || "").split("-").map(Number);

    if(parts.length !== 3 || parts.some(Number.isNaN)){
        return null;
    }

    return new Date(parts[0],parts[1]-1,parts[2]);
}

function dateKey(date){
    return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
}

function getInitials(name){
    const words = String(name || "U")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

    if(!words.length) return "U";

    if(words.length === 1){
        return words[0].slice(0,2).toUpperCase();
    }

    return (words[0][0] + words[1][0]).toUpperCase();
}

function getActiveStudents(){
    const deleted = appState.settings.deletedStudents || {};

    return Object.entries(appState.siswa || {})
        .map(([id,siswa]) => ({id,...siswa}))
        .filter(s => s.aktif !== false && !deleted[s.id])
        .sort((a,b) => String(a.nama || "").localeCompare(String(b.nama || ""),"id"));
}

function getAllStudents(){
    return Object.entries(appState.siswa || {})
        .map(([id,siswa]) => ({id,...siswa}))
        .sort((a,b) => String(a.nama || "").localeCompare(String(b.nama || ""),"id"));
}

function isStudentDeleted(id){
    return Boolean((appState.settings.deletedStudents || {})[id]);
}

/* =========================================================
   PAYMENT PERIOD
========================================================= */

function getPaymentPeriods(){
    const start = parseLocalDate(appState.settings.startDate);

    if(!start) return [];

    start.setHours(0,0,0,0);

    const now = new Date();
    now.setHours(0,0,0,0);

    if(start > now) return [];

    const periods = [];

    let cursor = new Date(start);
    let index = 1;

    while(cursor <= now && index <= 1000){

        const end = new Date(cursor);
        end.setDate(end.getDate()+6);

        periods.push({
            index,
            key:`P-${dateKey(cursor)}`,
            start:new Date(cursor),
            end,
            label:`Periode ${index} • ${formatDate(cursor)} – ${formatDate(end)}`
        });

        cursor.setDate(cursor.getDate()+7);
        index++;
    }

    return periods;
}

function getStudentPaidMap(studentId){
    return appState.pembayaranStatus?.[studentId] || {};
}

function getStudentUnpaidPeriods(studentId){
    const paid = getStudentPaidMap(studentId);

    return getPaymentPeriods().filter(period => !paid[period.key]?.paid);
}

function getStudentPaidTotal(studentId){
    const paid = getStudentPaidMap(studentId);

    return Object.values(paid)
        .filter(item => item && item.paid)
        .reduce((sum,item) => sum + Number(item.amount || appState.settings.weeklyFee || 0),0);
}

/* =========================================================
   CASH CALCULATION
========================================================= */

function calculateRawCashIn(){

    let total = 0;

    const statusReferencedIds = new Set();

    Object.values(appState.pembayaranStatus || {}).forEach(studentPayments => {
        Object.values(studentPayments || {}).forEach(status => {
            if(status?.kasMasukId){
                statusReferencedIds.add(status.kasMasukId);
            }
        });
    });

    /* Persistent payment ledger */
    Object.entries(appState.pembayaranStatus || {}).forEach(([studentId,payments]) => {

        if(isStudentDeleted(studentId)) return;

        Object.values(payments || {}).forEach(status => {
            if(status?.paid){
                total += Number(
                    status.amount ??
                    appState.settings.weeklyFee ??
                    0
                );
            }
        });
    });

    /* Other cash-in + old/unmatched payment records */
    Object.entries(appState.kasMasuk || {}).forEach(([id,item]) => {

        const isPayment =
            item?.jenis === "pembayaran" &&
            item?.siswaId &&
            item?.periodeKey;

        if(isPayment){

            if(isStudentDeleted(item.siswaId)){
                return;
            }

            const status =
                appState.pembayaranStatus?.[item.siswaId]?.[item.periodeKey];

            /*
             * If status exists, it has already been counted above.
             */
            if(status?.paid){
                return;
            }

            /*
             * Legacy payment without status.
             */
            total += Number(item.jumlah || 0);
            return;
        }

        total += Number(item?.jumlah || 0);
    });

    return total;
}

function calculateRawCashOut(){
    return Object.values(appState.kasKeluar || {})
        .reduce((sum,item) => sum + Number(item?.jumlah || 0),0);
}

function getCashIn(){

    const raw = calculateRawCashIn();
    const offset = Number(
        appState.settings.resetState?.cashInOffset || 0
    );

    return Math.max(0,raw-offset);
}

function getCashOut(){

    const raw = calculateRawCashOut();
    const offset = Number(
        appState.settings.resetState?.cashOutOffset || 0
    );

    return Math.max(0,raw-offset);
}

function getBalance(){
    return getCashIn() - getCashOut();
}

/* =========================================================
   FIREBASE LISTENERS
========================================================= */

function startFirebaseListeners(){

    if(listenersStarted) return;

    listenersStarted = true;

    onValue(ref(db,`${ROOT}/siswa`),(snapshot)=>{
        appState.siswa = snapshot.val() || {};
        populateStudentLogin();
        refreshPage();
    });

    onValue(ref(db,`${ROOT}/kasMasuk`),(snapshot)=>{
        appState.kasMasuk = snapshot.val() || {};
        reconcilePaymentStatus();
        refreshPage();
    });

    onValue(ref(db,`${ROOT}/kasKeluar`),(snapshot)=>{
        appState.kasKeluar = snapshot.val() || {};
        refreshPage();
    });

    onValue(ref(db,`${ROOT}/pembayaranStatus`),(snapshot)=>{
        appState.pembayaranStatus = snapshot.val() || {};
        refreshPage();
    });

    onValue(ref(db,`${ROOT}/settings`),(snapshot)=>{

        const value = snapshot.val() || {};

        appState.settings = {
            weeklyFee:Number(value.weeklyFee ?? 10000),
            startDate:value.startDate || "2026-01-05",
            resetState:{
                cashInOffset:Number(value.resetState?.cashInOffset || 0),
                cashOutOffset:Number(value.resetState?.cashOutOffset || 0)
            },
            deletedStudents:value.deletedStudents || {}
        };

        refreshPage();
    });
}

/* =========================================================
   RECONCILE OLD PAYMENTS
========================================================= */

async function reconcilePaymentStatus(){

    if(reconcileRunning) return;

    reconcileRunning = true;

    try{

        const updates = {};

        Object.entries(appState.kasMasuk || {}).forEach(([id,item])=>{

            if(
                item?.jenis !== "pembayaran" ||
                !item?.siswaId ||
                !item?.periodeKey
            ){
                return;
            }

            const existing =
                appState.pembayaranStatus?.[item.siswaId]?.[item.periodeKey];

            if(existing?.paid) return;

            updates[
                `${ROOT}/pembayaranStatus/${item.siswaId}/${item.periodeKey}`
            ] = {
                paid:true,
                amount:Number(item.jumlah || appState.settings.weeklyFee || 0),
                paidAt:Number(item.createdAt || Date.now()),
                kasMasukId:id,
                studentName:item.siswaNama || "",
                periodKey:item.periodeKey,
                periodLabel:item.periodeLabel || ""
            };
        });

        if(Object.keys(updates).length){
            await update(ref(db),updates);
        }

    }catch(error){
        console.error("Reconcile error:",error);
    }finally{
        reconcileRunning = false;
    }
}

/* =========================================================
   LOGIN
========================================================= */

function populateStudentLogin(){

    const select = $("anggotaStudent");

    if(!select) return;

    const current = select.value;

    select.innerHTML =
        `<option value="">Pilih nama siswa</option>` +
        getActiveStudents()
            .map(student =>
                `<option value="${escapeHtml(student.id)}">${escapeHtml(student.nama)}</option>`
            )
            .join("");

    if(current && appState.siswa[current] && !isStudentDeleted(current)){
        select.value = current;
    }
}

function showLoginError(message){

    const el = $("loginError");

    el.textContent = message;
    el.classList.remove("hidden");
}

function hideLoginError(){
    $("loginError").classList.add("hidden");
}

function loginAs(user){

    currentUser = user;

    sessionStorage.setItem(
        "kasKelasSession",
        JSON.stringify(user)
    );

    $("loginScreen").classList.add("hidden");
    $("appScreen").classList.remove("hidden");

    renderShell();

    startFirebaseListeners();

    if(user.role === "anggota"){

        const unpaid = getStudentUnpaidPeriods(user.studentId);

        if(unpaid.length){

            setTimeout(()=>{
                showDebtNotification(user.studentId);
            },400);
        }
    }

    showToast(
        `Selamat datang, ${user.name || "Pengguna"}.`,
        "success"
    );
}

    showConfirm(
        "Keluar dari akun?",
        "Apakah Anda yakin ingin keluar dan kembali ke halaman login?",
        ()=>{
            sessionStorage.removeItem("kasKelasSession");

            currentPage = "dashboard";

            closeModal();
            closeSidebar();

            $("appScreen").classList.add("hidden");
            $("loginScreen").classList.remove("hidden");

            $("bendaharaUsername").value = "";
            $("bendaharaPassword").value = "";
            $("anggotaPassword").value = "";

            hideLoginError();
        }
    );
}

/* =========================================================
   SHELL
========================================================= */

const pageTitles = {
    dashboard:"Beranda",
    masuk:"Kas Masuk",
    keluar:"Kas Keluar",
    siswa:"Daftar Siswa",
    nunggak:"Siswa Nunggak",
    riwayat:"Riwayat",
    pengaturan:"Pengaturan"

function renderShell(){

    if(!currentUser) return;

    $("pageTitle").textContent =
        pageTitles[currentPage] || "Beranda";

    $("topDate").textContent =
        new Intl.DateTimeFormat("id-ID",{
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric"
        }).format(new Date());

    $("sideUserName").textContent =
        currentUser.name || "Pengguna";

    $("sideUserRole").textContent =
        currentUser.role === "bendahara"
            ? "Bendahara"
            : "Anggota";

    $("sideAvatar").textContent =
        getInitials(currentUser.name);

    renderNavigation();
    refreshPage();
}

function renderNavigation(){

    const menu = $("navMenu");

    const common = [
        ["dashboard","⌂","Beranda"],
        ["masuk","＋","Kas Masuk"],
        ["keluar","−","Kas Keluar"]
    ];

    const bendahara = [
        ["siswa","♙","Daftar Siswa"],
        ["nunggak","!","Siswa Nunggak"],
        ["riwayat","↺","Riwayat"],
        ["pengaturan","⚙","Pengaturan"]
    ];

    const anggota = [
        ["riwayat","↺","Riwayat"]
    ];

    let html = `
        <div class="nav-section-title">Menu Utama</div>
    `;

    const items = currentUser.role === "bendahara"
        ? [...common,...bendahara]
        : [...common,...anggota];

    items.forEach(([page,icon,label])=>{

        html += `
            <button class="nav-item ${currentPage === page ? "active":""}" data-page="${page}">
                <span class="nav-icon">${icon}</span>
                <span>${label}</span>
            </button>
        `;
    });

    html += `
        <div class="nav-section-title">Akun</div>
        <button class="nav-item" id="logoutNav">
            <span class="nav-icon">↪</span>
            <span>Logout</span>
        </button>
    `;

    menu.innerHTML = html;

    menu.querySelectorAll("[data-page]").forEach(button=>{
        button.addEventListener("click",()=>{
            navigateTo(button.dataset.page);
        });
    });

    $("logoutNav").addEventListener("click",logout);
}

function navigateTo(page){

    currentPage = page;

    renderShell();
    closeSidebar();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

/* =========================================================
   PAGE RENDER
========================================================= */

function refreshPage(){

    if(!currentUser) return;

    if($("appScreen").classList.contains("hidden")) return;

    $("pageTitle").textContent =
        pageTitles[currentPage] || "Beranda";

    if(currentPage === "dashboard"){
        renderDashboard();
    }else if(currentPage === "masuk"){
        renderKasMasuk();
    }else if(currentPage === "keluar"){
        renderKasKeluar();
    }else if(currentPage === "siswa"){
        renderStudents();
    }else if(currentPage === "nunggak"){
        renderDebtors();
    }else if(currentPage === "riwayat"){
        renderHistory();
    }else if(currentPage === "pengaturan"){
        renderSettings();
    }
}

/* =========================================================
   DEBT
========================================================= */

function getDebtorData(){

    return getActiveStudents()
        .map(student=>{

            const unpaid = getStudentUnpaidPeriods(student.id);

            return {
                ...student,
                unpaid,
                total:Number(unpaid.length) * Number(appState.settings.weeklyFee || 0)
            };
        })
        .filter(student=>student.unpaid.length > 0);
}

function showDebtNotification(studentId){

    const student = appState.siswa?.[studentId];

    if(!student) return;

    const unpaid = getStudentUnpaidPeriods(studentId);

    if(!unpaid.length) return;

    openModal(
        "Peringatan Tunggakan",
        `
        <div class="alert alert-warning" style="margin-bottom:0">
            <div class="alert-icon">⚠</div>
            <div>
                <strong>Anda memiliki tunggakan kas</strong>
                <p>
                    ${escapeHtml(student.nama)}, terdapat
                    <b>${unpaid.length} periode</b> yang belum dibayar
                    dengan total <b>${formatRupiah(unpaid.length * Number(appState.settings.weeklyFee || 0))}</b>.
                </p>
            </div>
        </div>
        `,
        `
        <button class="btn btn-secondary" data-modal-cancel>Tutup</button>
        <button class="btn btn-primary" id="notificationPayBtn">Lihat Pembayaran</button>
        `
    );

    $("notificationPayBtn").addEventListener("click",()=>{
        closeModal();
        openPaymentModal(studentId);
    });
}

/* =========================================================
   CASH IN MODAL
========================================================= */

function openCashInModal(editId=null){

    const editData =
        editId
        ? appState.kasMasuk?.[editId]
        : null;

    const students = getActiveStudents();

    openModal(
        editId ? "Edit Kas Masuk" : "Tambah Kas Masuk",
        `
        <form id="cashInForm">

            <div class="form-group">
                <label class="form-label">Jenis</label>
                <select id="cashInType" class="form-control">
                    <option value="pembayaran"
                        ${editData?.jenis === "pembayaran" ? "selected":""}>
                        Pembayaran Kas Siswa
                    </option>
                    <option value="lainnya"
                        ${editData?.jenis === "lainnya" ? "selected":""}>
                        Pemasukan Lainnya
                    </option>
                </select>
            </div>

            <div id="paymentFields">

                <div class="form-group">
                    <label class="form-label">Nama Siswa</label>
                    <select id="cashInStudent" class="form-control">
                        <option value="">Pilih siswa</option>
                        ${students.map(s=>`
                            <option value="${escapeHtml(s.id)}"
                                ${editData?.siswaId === s.id ? "selected":""}>
                                ${escapeHtml(s.nama)}
                            </option>
                        `).join("")}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Periode Pembayaran</label>
                    <select id="cashInPeriod" class="form-control">
                        <option value="">Pilih periode</option>
                    </select>
                </div>

            </div>

            <div id="otherFields" class="${editData?.jenis === "lainnya" ? "":"hidden"}">

                <div class="form-group">
                    <label class="form-label">Kategori</label>
                    <input id="cashInCategory"
                        class="form-control"
                        value="${escapeHtml(editData?.kategori || "")}"
                        placeholder="Contoh: Donasi, tambahan, dll.">
                </div>

                <div class="form-group">
                    <label class="form-label">Keterangan</label>
                    <textarea id="cashInDescription"
                        class="form-control"
                        rows="3"
                        placeholder="Keterangan pemasukan">${escapeHtml(editData?.keterangan || "")}</textarea>
                </div>

            </div>

            <div class="form-group">
                <label class="form-label">Jumlah</label>
                <input id="cashInAmount"
                    type="number"
                    min="0"
                    class="form-control"
                    value="${editData?.jumlah || appState.settings.weeklyFee || 0}"
                    placeholder="Masukkan jumlah">
            </div>

        </form>
        `,
        `
        <button class="btn btn-secondary" data-modal-cancel>Batal</button>
        <button class="btn btn-primary" id="saveCashIn">
            ${editId ? "Simpan Perubahan":"Simpan"}
        </button>
        `
    );

    const typeSelect = $("cashInType");
    const studentSelect = $("cashInStudent");
    const periodSelect = $("cashInPeriod");
    const paymentFields = $("paymentFields");
    const otherFields = $("otherFields");
    const amountInput = $("cashInAmount");

    function refreshPaymentFields(){

        const type = typeSelect.value;

        if(type === "pembayaran"){

            paymentFields.classList.remove("hidden");
            otherFields.classList.add("hidden");

            populatePaymentPeriods(
                studentSelect.value,
                periodSelect,
                editData?.periodeKey || ""
            );

            if(!editId){
                amountInput.value = appState.settings.weeklyFee || 0;
            }

        }else{

            paymentFields.classList.add("hidden");
            otherFields.classList.remove("hidden");
        }
    }

    typeSelect.addEventListener("change",refreshPaymentFields);

    studentSelect.addEventListener("change",()=>{
        populatePaymentPeriods(
            studentSelect.value,
            periodSelect
        );

        if(studentSelect.value){
            amountInput.value = appState.settings.weeklyFee || 0;
        }
    });

    refreshPaymentFields();

    $("saveCashIn").addEventListener("click",async()=>{

        const type = typeSelect.value;
        const amount = Number(amountInput.value || 0);

        if(amount <= 0){
            showToast("Jumlah harus lebih dari 0.","warning");
            return;
        }

        try{

            if(editId){

                await update(
                    ref(db,`${ROOT}/kasMasuk/${editId}`),
                    {
                        jenis:type,
                        jumlah:amount,
                        kategori:
                            type === "lainnya"
                            ? $("cashInCategory").value.trim()
                            : "Kas Siswa",
                        keterangan:
                            type === "lainnya"
                            ? $("cashInDescription").value.trim()
                            : (
                                periodSelect.options[
                                    periodSelect.selectedIndex
                                ]?.text || "Pembayaran kas"
                            )
                    }
                );

                /*
                 * Jika pembayaran diedit, status pembayaran ikut
                 * diperbarui agar saldo tetap konsisten.
                 */
                if(
                    type === "pembayaran" &&
                    editData?.siswaId &&
                    editData?.periodeKey
                ){

                    await update(
                        ref(db),
                        {
                            [`${ROOT}/pembayaranStatus/${editData.siswaId}/${editData.periodeKey}/amount`]:amount
                        }
                    );
                }

                closeModal();
                showToast("Perubahan kas masuk berhasil disimpan.");

            }else{

                if(type === "pembayaran"){

                    const studentId = studentSelect.value;
                    const periodKey = periodSelect.value;

                    if(!studentId || !periodKey){
                        showToast("Pilih siswa dan periode pembayaran.","warning");
                        return;
                    }

                    const student = appState.siswa[studentId];

                    const transactionRef =
                        push(ref(db,`${ROOT}/kasMasuk`));

                        id:transactionId,
                        tanggal:dateKey(new Date()),
                        waktu:new Date().toLocaleTimeString("id-ID"),

                    const updates = {};

                    updates[

                    updates[

                        kasMasukId:transactionId,
                        studentName:student?.nama || "",

                        periodLabel:period?.label || ""
                    };

                }else{

                        push(ref(db,`${ROOT}/kasMasuk`));

                    await set(transactionRef,{
                        id:transactionRef.key,
                        tanggal:dateKey(new Date()),
                        waktu:new Date().toLocaleTimeString("id-ID"),

function populatePaymentPeriods(
    studentId,
    select,
    selectedKey=""
){

    if(!select) return;

    const periods = getPaymentPeriods();
    const paid = getStudentPaidMap(studentId);

    select.innerHTML =
        `<option value="">Pilih periode</option>` +
        periods.map(period=>{

            const isPaid =
                paid[period.key]?.paid &&
                period.key !== selectedKey;

            return `
                <option value="${escapeHtml(period.key)}"
                    ${period.key === selectedKey ? "selected":""}
                    ${isPaid ? "disabled":""}>
                    ${escapeHtml(period.label)}
                    ${isPaid ? " • SUDAH LUNAS":""}
                </option>
            `;
        }).join("");
}

function openPaymentModal(studentId){

    const student = appState.siswa?.[studentId];

    if(!student){
        showToast("Siswa tidak ditemukan.","error");
        return;
    }

    const periods = getPaymentPeriods();
    const paid = getStudentPaidMap(studentId);

    const unpaid = periods.filter(
        period=>!paid[period.key]?.paid
    );

    if(!unpaid.length){

        showToast(
            "Siswa ini sudah melunasi semua periode.",
            "success"
        );

        return;
    }

    openModal(
        "Pembayaran Kas Siswa",
        `
        <div class="alert alert-warning">
            <div class="alert-icon">!</div>
            <div>
                <strong>${escapeHtml(student.nama)}</strong>
                <p>
                    Pilih periode yang ingin dibayarkan.
                    Periode yang sudah lunas tidak dapat dipilih lagi.
                </p>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Nama Siswa</label>
            <input class="form-control"
                value="${escapeHtml(student.nama)}"
                disabled>
        </div>

        <div class="period-list" id="paymentPeriodList">

            ${unpaid.map(period=>`
                <label class="period-item">
                    <input
                        type="checkbox"
                        class="period-check"
                        value="${escapeHtml(period.key)}"
                        data-period-check>
                    <div class="period-info">
                        <strong>${escapeHtml(period.label)}</strong>
                        <span>
                            ${formatRupiah(appState.settings.weeklyFee)}
                        </span>
                    </div>
                </label>
            `).join("")}

        </div>

        <div class="payment-summary">
            <span>Total Pembayaran</span>
            <strong id="paymentTotal">
                ${formatRupiah(0)}
            </strong>
        </div>
        `,
        `
        <button class="btn btn-secondary" data-modal-cancel>Batal</button>
        <button class="btn btn-primary" id="saveStudentPayment">
            Simpan Pembayaran
        </button>
        `
    );

    function updateTotal(){

        const checked =
            [...document.querySelectorAll("[data-period-check]:checked")];

        const total =
            checked.length *
            Number(appState.settings.weeklyFee || 0);

        $("paymentTotal").textContent =
            formatRupiah(total);
    }

    document.querySelectorAll("[data-period-check]")
        .forEach(input=>{
            input.addEventListener("change",updateTotal);
        });

    $("saveStudentPayment").addEventListener("click",async()=>{

        const selected =
            [...document.querySelectorAll("[data-period-check]:checked")]
                .map(input=>input.value);

        if(!selected.length){
            showToast("Pilih minimal satu periode.","warning");
            return;
        }

        try{

            const weeklyFee =
                Number(appState.settings.weeklyFee || 0);

            const updates = {};

            selected.forEach(periodKey=>{

                const period =
                    periods.find(p=>p.key === periodKey);

                const transactionRef =
                    push(ref(db,`${ROOT}/kasMasuk`));

                const transactionId =
                    transactionRef.key;

                const transaction = {
                    id:transactionId,
                    tanggal:dateKey(new Date()),
                    waktu:new Date().toLocaleTimeString("id-ID"),
                    jenis:"pembayaran",
                    kategori:"Kas Siswa",
                    keterangan:period?.label || "Pembayaran kas",
                    siswaId:studentId,
                    siswaNama:student.nama || "",
                    periodeKey,
                    periodeLabel:period?.label || "",
                    jumlah:weeklyFee,
                    createdAt:Date.now()
                };

                updates[
                    `${ROOT}/kasMasuk/${transactionId}`
                ] = transaction;

                updates[
                    `${ROOT}/pembayaranStatus/${studentId}/${periodKey}`
                ] = {
                    paid:true,
                    amount:weeklyFee,
                    paidAt:Date.now(),
                    kasMasukId:transactionId,
                    studentName:student.nama || "",
                    periodKey,
                    periodLabel:period?.label || ""
                };
            });

            await update(ref(db),updates);

            closeModal();

            showToast(
                `${selected.length} periode berhasil dibayar. Saldo otomatis diperbarui.`
            );

        }catch(error){

            console.error(error);

            showToast(
                "Pembayaran gagal disimpan.",
                "error"
            );
        }
    });
}

function openCashOutModal(editId=null){

    openModal(
        editId ? "Edit Kas Keluar":"Tambah Kas Keluar",
        `
        <form id="cashOutForm">

            <div class="form-group">
                <label class="form-label">Kategori</label>
                <input id="cashOutCategory"
                    class="form-control"
                    value="${escapeHtml(data?.kategori || "")}"
                    placeholder="Contoh: Perlengkapan">
            </div>

            <div class="form-group">
                <label class="form-label">Keterangan</label>
                <textarea id="cashOutDescription"
                    class="form-control"
                    rows="3"
                    placeholder="Keterangan penggunaan kas">${escapeHtml(data?.keterangan || "")}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Jumlah</label>
                <input id="cashOutAmount"
                    type="number"
                    min="0"
                    class="form-control"
                    value="${data?.jumlah || ""}"
                    placeholder="Masukkan jumlah">
            </div>

        </form>
        `,
        `
        <button class="btn btn-secondary" data-modal-cancel>Batal</button>
        <button class="btn btn-primary" id="saveCashOut">
            ${editId ? "Simpan Perubahan":"Simpan"}
        </button>
        `
    );

    $("saveCashOut").addEventListener("click",async()=>{

        const kategori =
            $("cashOutCategory").value.trim();

        const keterangan =
            $("cashOutDescription").value.trim();

        const jumlah =
            Number($("cashOutAmount").value || 0);

        if(!kategori){
            showToast("Kategori harus diisi.","warning");
            return;
        }

        if(jumlah <= 0){
            showToast("Jumlah harus lebih dari 0.","warning");
            return;
        }

        try{

            if(editId){

                await update(
                    ref(db,`${ROOT}/kasKeluar/${editId}`),
                    {
                        kategori,
                        keterangan,
                        jumlah
                    }
                );

            }else{

                const newRef =
                    push(ref(db,`${ROOT}/kasKeluar`));

                await set(newRef,{
                    id:newRef.key,
                    tanggal:dateKey(new Date()),
                    waktu:new Date().toLocaleTimeString("id-ID"),
                    kategori,
                    keterangan,
                    jumlah,
                    createdAt:Date.now()
                });
            }

            closeModal();
            showToast(
                editId
                ? "Perubahan kas keluar berhasil disimpan."
                : "Kas keluar berhasil disimpan."
            );

        }catch(error){

            console.error(error);
            showToast("Gagal menyimpan kas keluar.","error");
        }
    });
}

/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

    const cashIn =
        Object.entries(appState.kasMasuk || {})
            .map(([id,item])=>({
                id,
                type:"masuk",
                ...item
            }));

    const cashOut =
        Object.entries(appState.kasKeluar || {})
            .map(([id,item])=>({
                id,
                type:"keluar",
                ...item
            }));

    let records = [...cashIn,...cashOut]
        .filter(item=>{

            if(currentUser.role === "bendahara"){
                return true;
            }

            if(item.type === "keluar"){
                return true;
            }

            return item.siswaId === currentUser.studentId;
        })
        .sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));

    $("content").innerHTML = `
        <div class="page-header">
            <div>
                <h2>Riwayat</h2>
                <p>Seluruh catatan transaksi kas kelas.</p>
            </div>

            ${
                currentUser.role === "bendahara"
                ? `
                    <button class="btn btn-danger" id="deleteHistory">
                        Hapus Riwayat
                    </button>
                `
                : ""
            }
        </div>

        <div class="card">

            <div class="card-header">
                <div class="card-title">Riwayat Transaksi</div>

                <span class="status status-success">
                    ${records.length} transaksi
                </span>
            </div>

            <div class="table-wrap">

                ${
                    records.length
                    ? `
                        <table>
                            <thead>
                                <tr>
                                    <th>Tanggal</th>
                                    <th>Tipe</th>
                                    <th>Siswa/Kategori</th>
                                    <th>Keterangan</th>
                                    <th>Jumlah</th>
                                </tr>
                            </thead>

                            <tbody>
                                ${records.map(item=>`

                                    <tr>
                                        <td>${formatDateTime(item.createdAt)}</td>

                                        <td>
                                            <span class="status ${

                                                ? "status-success"
                                                : "status-danger"
                                            }">

                                        </td>

                                                item.type === "masuk"

                                                    "-"

                                                : escapeHtml(item.kategori || "-")

                                        <td>
                                            ${escapeHtml(
                                                item.periodeLabel ||
                                                item.keterangan ||
                                                "-"
                                            )}

                            <p>Belum ada riwayat transaksi.</p>
                        </div>
                    `
                }

            </div>

            <div class="mobile-record-list">

                ${
                    records.length
                    ? records.map(item=>`

                        <div class="record-card">

                            <div class="record-row">
                                <span class="record-label">Tanggal</span>
                                <span class="record-value">
                                    ${formatDateTime(item.createdAt)}

                            <div class="record-row">
                                <span class="record-label">Tipe</span>
                                <span class="record-value">

                                        : "status-danger"

                                <span class="record-label">Keterangan</span>

/* =========================================================
   SETTINGS
========================================================= */

function renderSettings(){

    $("content").innerHTML = `

        <div class="page-header">
            <div>
                <h2>Pengaturan</h2>
                <p>Atur periode dan nominal pembayaran kas.</p>
            </div>
        </div>

        <div class="settings-grid">

            <div class="card setting-card">

                <h3>Pembayaran Kas</h3>

                <p>
                    Tentukan mulai kapan periode kas dihitung dan
                    jumlah pembayaran setiap minggu.
                </p>

                <div class="form-group">
                    <label class="form-label">
                        Jumlah Kas per Minggu
                    </label>

                    <input
                        id="weeklyFee"
                        type="number"
                        min="0"
                        class="form-control"
                        value="${Number(appState.settings.weeklyFee || 0)}">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        Mulai Periode Pembayaran
                    </label>

                    <input
                        id="startDate"
                        type="date"
                        class="form-control"
                        value="${escapeHtml(appState.settings.startDate || "")}">
                </div>

                <button class="btn btn-primary"
                    style="width:100%"
                    id="saveSettings">
                    Simpan Pengaturan
                </button>

                <div class="setting-note">
                    Perubahan tanggal mulai akan memengaruhi pembentukan
                    periode pembayaran berikutnya. Status pembayaran yang
                    sudah tersimpan tidak dihapus.
                </div>

            </div>

            <div class="card setting-card">

                <h3>Reset Saldo Tampilan</h3>

                <p>
                    Reset digunakan untuk mengatur ulang tampilan saldo
                    tanpa menghapus catatan transaksi dan data pembayaran.
                </p>

                <div class="alert alert-warning">
                    <div class="alert-icon">!</div>
                    <div>
                        <strong>Perhatian</strong>
                        <p>
                            Reset tidak menghapus histori. Hanya saldo
                            yang ditampilkan yang dimulai kembali dari nol.
                        </p>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        Password/Kode Reset
                    </label>

                    <input
                        id="resetPassword"
                        type="password"
                        class="form-control"
                        placeholder="Masukkan kode reset">
                </div>

                <button class="btn btn-danger"
                    style="width:100%"
                    id="resetButton">
                    Reset Saldo
                </button>

            </div>

        </div>

    `;

    $("saveSettings").addEventListener("click",async()=>{

        const weeklyFee =
            Number($("weeklyFee").value || 0);

        const startDate =
            $("startDate").value;

        if(weeklyFee < 0){
            showToast(
                "Nominal kas tidak valid.",
                "warning"
            );
            return;
        }

        if(!startDate){
            showToast(
                "Tanggal mulai periode wajib diisi.",
                "warning"
            );
            return;
        }

        try{

            await update(
                ref(db,`${ROOT}/settings`),
                {
                    weeklyFee,
                    startDate
                }
            );

            showToast(
                "Berhasil disimpan. Pengaturan pembayaran telah diperbarui.",
                "success"
            );

        }catch(error){

            console.error(error);

            showToast(
                "Gagal menyimpan pengaturan.",
                "error"
            );
        }
    });

    $("resetButton").addEventListener("click",()=>{

        const password =
            $("resetPassword").value.trim();

        if(password !== RESET_CODE){

            showToast(
                "Password/kode reset salah.",
                "error"
            );

            return;
        }

        showConfirm(
            "Konfirmasi Reset",
            "Password benar. Reset akan mengatur tampilan saldo kembali dari nol tanpa menghapus riwayat transaksi.",
            async ()=>{

                try{

                    const cashIn =
                        calculateRawCashIn();

                    const cashOut =
                        calculateRawCashOut();

                    await update(
                        ref(db,`${ROOT}/settings/resetState`),
                        {
                            cashInOffset:cashIn,
                            cashOutOffset:cashOut,
                            resetAt:Date.now()
                        }
                    );

                    $("resetPassword").value = "";

                    closeModal();

                    showToast(
                        "Reset berhasil dieksekusi. Saldo tampilan telah direset."
                    );

                }catch(error){

                    console.error(error);

                    showToast(
                        "Reset gagal dijalankan.",
                        "error"
                    );
                }
            }
        );
    });
}

/* =========================================================
   MODAL
========================================================= */

function openModal(title,body,footer=""){

    const overlay = $("modalOverlay");
    const card = $("modalCard");

    card.innerHTML = `
        <div class="modal-head">
            <h3>${escapeHtml(title)}</h3>
            <button class="modal-close" id="modalCloseButton">×</button>
        </div>

        <div class="modal-body">
            ${body}
        </div>

        ${
            footer
            ? `<div class="modal-footer">${footer}</div>`
            : ""
        }
    `;

    overlay.classList.remove("hidden");

    $("modalCloseButton").addEventListener(
        "click",
        closeModal
    );

    document.querySelectorAll("[data-modal-cancel]")
        .forEach(button=>{
            button.addEventListener("click",closeModal);
        });
}

function closeModal(){

    $("modalOverlay").classList.add("hidden");
    $("modalCard").innerHTML = "";
}

function showConfirm(title,message,onYes,type="warning"){

    openModal(
        title,
        `
        <div class="confirm-icon ${
            type === "danger" ? "danger":""
        }">
            ${type === "danger" ? "!" : "?"}
        </div>

        <div class="confirm-text">
            <h3>${escapeHtml(title)}</h3>
            <p>${escapeHtml(message)}</p>
        </div>
        `,
        `
        <button class="btn btn-secondary" data-modal-cancel>
            Tidak
        </button>

        <button class="btn ${
            type === "danger"
            ? "btn-danger"
            : "btn-primary"
        }" id="confirmYes">
            Ya
        </button>
        `
    );

    $("confirmYes").addEventListener("click",async()=>{

        $("confirmYes").disabled = true;

        try{
            await onYes();
        }catch(error){
            console.error(error);
        }
    });
}

/* =========================================================
   TOAST
========================================================= */

function showToast(message,type="success"){

    const container = $("toastContainer");

    const toast = document.createElement("div");

    toast.className =
        `toast ${type === "error" ? "error":type === "warning" ? "warning":""}`;

    toast.innerHTML = `
        <div class="toast-icon">
            ${type === "error" ? "✕" : type === "warning" ? "⚠" : "✓"}
        </div>

        <div>
            <strong>
                ${
                    type === "error"
                    ? "Gagal"
                    : type === "warning"
                    ? "Perhatian"
                    : "Berhasil"
                }
            </strong>
            <span>${escapeHtml(message)}</span>
        </div>
    `;

    container.appendChild(toast);

    setTimeout(()=>{
        toast.remove();
    },3500);
}

/* =========================================================
   SIDEBAR MOBILE
========================================================= */

function openSidebar(){

    $("sidebar").classList.add("open");
    $("mobileOverlay").classList.add("visible");

    document.body.classList.add("sidebar-open");
    document.body.style.overflow = "hidden";
}

function closeSidebar(){

    $("sidebar").classList.remove("open");
    $("mobileOverlay").classList.remove("visible");

    document.body.classList.remove("sidebar-open");
    document.body.style.overflow = "";
}

$("hamburger").addEventListener("click",openSidebar);

$("mobileOverlay").addEventListener(
    "click",
    closeSidebar
);

/* =========================================================
   LOGIN EVENTS
========================================================= */

document.querySelectorAll(".login-tab").forEach(tab=>{

    tab.addEventListener("click",()=>{

        document.querySelectorAll(".login-tab")
            .forEach(item=>item.classList.remove("active"));

        tab.classList.add("active");

        const isBendahara =
            tab.dataset.role === "bendahara";

        $("bendaharaLogin")
            .classList.toggle("hidden",!isBendahara);

        $("anggotaLogin")
            .classList.toggle("hidden",isBendahara);

        hideLoginError();
    });
});

$("bendaharaLogin").addEventListener("submit",(event)=>{

    event.preventDefault();

    hideLoginError();

    const username =
        $("bendaharaUsername").value.trim();

    const password =
        $("bendaharaPassword").value;

    if(
        username !== BENDAHARA_USERNAME ||
        password !== BENDAHARA_PASSWORD
    ){

        showLoginError(
            "Username atau password bendahara salah."
        );

        return;
    }

    loginAs({
        role:"bendahara",
        name:"Bendahara",
        username
    });
});

$("anggotaLogin").addEventListener("submit",(event)=>{

    event.preventDefault();

    hideLoginError();

    const studentId =
        $("anggotaStudent").value;

    const password =
        $("anggotaPassword").value;

    if(!studentId){

        showLoginError(
            "Silakan pilih nama siswa."
        );

        return;
    }

    const student =
        appState.siswa?.[studentId];

    if(!student){

        showLoginError(
            "Data siswa tidak ditemukan."
        );

        return;
    }

    if(isStudentDeleted(studentId)){

        showLoginError(
            "Siswa tersebut sudah tidak aktif."
        );

        return;
    }

    const correctPassword =
        student.password ||
        DEFAULT_STUDENT_PASSWORD;

    if(password !== correctPassword){

        showLoginError(
            "Password siswa salah."
        );

        return;
    }

    loginAs({
        role:"anggota",
        studentId,
        name:student.nama
    });
});

/* =========================================================
   MODAL OUTSIDE CLICK + ESCAPE
========================================================= */

$("modalOverlay").addEventListener("click",(event)=>{

    if(event.target === $("modalOverlay")){
        closeModal();
    }
});

document.addEventListener("keydown",(event)=>{

    if(event.key === "Escape"){

        if(!$("modalOverlay").classList.contains("hidden")){
            closeModal();
        }else{
            closeSidebar();
        }
    }
});

/* =========================================================
   SESSION RESTORE
========================================================= */

function restoreSession(){

    const saved =
        sessionStorage.getItem("kasKelasSession");

    if(!saved){

        populateStudentLogin();
        return;
    }

    try{

        const user = JSON.parse(saved);

        if(!user?.role){
            sessionStorage.removeItem("kasKelasSession");
            populateStudentLogin();
            return;
        }

        currentUser = user;

        $("loginScreen").classList.add("hidden");
        $("appScreen").classList.remove("hidden");

        renderShell();

        startFirebaseListeners();

    }catch(error){

        console.error(error);

        sessionStorage.removeItem("kasKelasSession");

        populateStudentLogin();
    }
}

/* =========================================================
   INITIAL
========================================================= */

populateStudentLogin();
restoreSession();

</script>
