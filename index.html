<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a">
<title>KAS KELAS VII B</title>
<style>
:root{
  --navy:#0b1f3a;--navy2:#12345b;--green:#12a36d;--green2:#0b8b5b;
  --white:#fff;--bg:#f4f7fb;--text:#172033;--muted:#6b7688;
  --line:#e3e8ef;--yellow:#f4b400;--red:#d93025;--shadow:0 10px 30px rgba(10,31,58,.08);
  --radius:16px
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.app{min-height:100vh}
.sidebar{position:fixed;z-index:1000;inset:0 auto 0 0;width:265px;background:linear-gradient(180deg,var(--navy),#09233f);color:#fff;padding:20px 14px;display:flex;flex-direction:column;box-shadow:8px 0 30px rgba(0,0,0,.08)}
.brand{padding:5px 10px 20px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{display:block;font-size:18px;letter-spacing:.3px}.brand small{color:#b9c7d8}
.userbox{margin:14px 0;padding:12px;border-radius:14px;background:rgba(255,255,255,.08)}
.userbox strong{display:block;font-size:13px}.userbox span{font-size:11px;color:#b9c7d8}
.nav{display:grid;gap:5px;overflow:auto;padding-right:2px}
.nav button{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:#cbd6e4;background:transparent;text-align:left;font-size:13px;transition:.18s}
.nav button:hover,.nav button.active{background:rgba(18,163,109,.17);color:#fff}
.nav .danger{color:#ffb6b0}.sidebar-footer{margin-top:auto;color:#8fa1b7;font-size:10px;padding:12px 10px}
.main{margin-left:265px;min-height:100vh}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:800}
.topbar-title{font-size:18px;font-weight:750}.topbar-sub{font-size:11px;color:var(--muted);margin-top:2px}
.page{padding:24px 28px;max-width:1500px;margin:auto}
.hamburger{display:none;position:fixed;z-index:1200;left:12px;top:14px;width:40px;height:40px;border-radius:11px;background:var(--navy);color:#fff;font-size:20px;box-shadow:var(--shadow)}
.mobile-overlay{display:none}
body.sidebar-open .hamburger{opacity:0;visibility:hidden;pointer-events:none}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-35px;top:-35px;background:rgba(18,163,109,.08)}
.label{font-size:11px;color:var(--muted);font-weight:650}.value{font-size:24px;font-weight:800;margin-top:6px}.green{color:var(--green2)}.red{color:var(--red)}.yellow{color:#a36b00}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.section-head h2{font-size:15px;margin:0}.section-head p{margin:3px 0 0;color:var(--muted);font-size:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:9px 13px;border-radius:10px;font-size:12px;font-weight:700;transition:.18s;border:1px solid transparent}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green2)}
.btn-navy{background:var(--navy);color:#fff}.btn-light{background:#f1f4f8;color:var(--text);border-color:var(--line)}
.btn-danger{background:var(--red);color:#fff}.btn-warning{background:#fff3cd;color:#8a5a00;border-color:#f4d477}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{min-width:94px}
.hero{background:linear-gradient(120deg,var(--navy),#16446f);color:#fff;border-radius:20px;padding:22px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:18px;align-items:center}
.hero h1{font-size:22px;margin:0 0 6px}.hero p{font-size:12px;color:#c9d7e6;margin:0}.hero-badge{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);padding:10px 13px;border-radius:12px;font-size:11px}
.notice{border-radius:14px;padding:14px;border:1px solid #f0d47a;background:#fff8df;color:#735000;display:flex;justify-content:space-between;align-items:center;gap:12px}.notice.danger{border-color:#f2b5b1;background:#fff0ef;color:#8f2018}
.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff}.item-main{min-width:0}.item-title{font-size:12px;font-weight:750}.item-sub{font-size:10px;color:var(--muted);margin-top:3px}.amount{font-size:12px;font-weight:800;white-space:nowrap}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:750}.badge-green{background:#e5f7ef;color:#08754b}.badge-red{background:#ffebea;color:#a52019}.badge-yellow{background:#fff3ce;color:#805500}.badge-blue{background:#e7effa;color:#24517d}
.recent-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.recent-item{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:12px;background:#e8f5ef;color:var(--green2);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:11px;text-align:left}.table th{color:var(--muted);font-weight:700;background:#f8fafc}.table tr:last-child td{border-bottom:0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#455066}.field input,.field select,.field textarea{width:100%;border:1px solid #d7dee8;background:#fff;border-radius:10px;padding:10px 11px;font-size:12px;outline:0;color:var(--text)}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(18,163,109,.1)}.field textarea{min-height:85px;resize:vertical}
.filter-row{display:flex;gap:9px;flex-wrap:wrap}.filter-row input,.filter-row select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:11px}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}
.modal-overlay{position:fixed;z-index:3000;inset:0;background:rgba(5,18,34,.58);backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px}
.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.25);padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.modal-head h3{margin:0;font-size:16px}.close{width:32px;height:32px;border-radius:9px;background:#f1f4f8;color:#475166;font-size:18px}.modal-body{font-size:12px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.period-list{display:grid;gap:7px;max-height:300px;overflow:auto}.period{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);padding:9px 10px;border-radius:10px}.period small{display:block;color:var(--muted);font-size:9px}.period input{accent-color:var(--green)}
.toast{position:fixed;z-index:5000;right:18px;bottom:18px;max-width:360px;background:#10263f;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);font-size:11px;display:flex;gap:9px;align-items:center;animation:toastIn .2s ease}.toast.success{border-left:4px solid var(--green)}.toast.error{border-left:4px solid var(--red)}.toast.warning{border-left:4px solid var(--yellow)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#174e7d 0,#0b1f3a 42%,#061529 100%)}
.login-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:26px;box-shadow:0 25px 90px rgba(0,0,0,.3)}
.login-logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--green),#08784f);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900;margin-bottom:15px}.login-card h1{margin:0;font-size:21px}.login-card>p{font-size:11px;color:var(--muted);margin:5px 0 20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f0f3f7;border-radius:11px;padding:4px;margin-bottom:15px}.tabs button{padding:9px;border-radius:8px;background:transparent;color:var(--muted);font-size:11px;font-weight:750}.tabs button.active{background:#fff;color:var(--navy);box-shadow:0 2px 7px rgba(0,0,0,.07)}
.login-form{display:grid;gap:11px}.login-note{font-size:9px;color:#8a94a5;text-align:center;margin-top:15px}
@media(max-width:900px){
 .sidebar{transform:translateX(-102%);transition:transform .22s ease;width:270px}.sidebar.open{transform:translateX(0)}
 .main{margin-left:0}.hamburger{display:block}.topbar{height:62px;padding:0 15px 0 62px}.topbar-title{font-size:15px}.page{padding:16px 14px}.mobile-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900}.mobile-overlay.visible{display:block}
 .stats{grid-template-columns:1fr}.recent-list{grid-template-columns:1fr}.hero{padding:17px;border-radius:16px}.hero h1{font-size:18px}.hero-badge{display:none}.card{padding:14px;border-radius:14px}.value{font-size:19px}.section-head{margin:18px 0 10px}.section-head h2{font-size:14px}
}
@media(max-width:600px){
 body{font-size:13px}.page{padding:13px 10px}.topbar-sub{font-size:9px}.topbar-title{font-size:14px}
 .form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions{width:100%}.actions .btn{flex:1;min-width:0}.btn{min-height:37px;padding:8px 10px;font-size:11px}
 .item{align-items:flex-start}.item .actions{width:auto;flex-wrap:nowrap}.item .actions .btn{flex:0 0 auto;min-width:auto}
 .modal-overlay{padding:10px}.modal{padding:16px;border-radius:15px}.modal-foot .btn{flex:1}
 .table-wrap{border-radius:11px}.table{min-width:610px}.notice{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">K</div>
    <h1>KAS KELAS VII B</h1>
    <p>Pengelolaan kas kelas yang sederhana, rapi, dan transparan.</p>
    <div class="tabs">
      <button id="tabBendahara" class="active" type="button">Bendahara</button>
      <button id="tabAnggota" type="button">Anggota</button>
    </div>

    <form id="loginBendahara" class="login-form">
      <div class="field"><label>Username</label><input id="loginUser" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" type="submit">Masuk sebagai Bendahara</button>
    </form>

    <form id="loginAnggota" class="login-form hidden">
      <div class="field"><label>Nama Siswa</label><select id="loginStudent" required><option value="">Pilih siswa</option></select></div>
      <div class="field"><label>Password</label><input id="loginStudentPass" type="password" required></div>
      <button class="btn btn-navy" type="submit">Masuk sebagai Anggota</button>
    </form>
    <div class="login-note">© <span class="year"></span> KAS KELAS VII B</div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><b>KAS KELAS VII B</b><small>Class Cash Management</small></div>
    <div class="userbox"><strong id="sideUser">-</strong><span id="sideRole">-</span></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-footer">Sistem kas kelas • <span class="year"></span></div>
  </aside>
  <div id="mobileOverlay" class="mobile-overlay"></div>
  <button id="hamburger" class="hamburger" type="button">☰</button>

  <main class="main">
    <header class="topbar">
      <div><div id="topTitle" class="topbar-title">Beranda</div><div id="topSub" class="topbar-sub">KAS KELAS VII B</div></div>
      <div id="topDate" class="topbar-sub"></div>
    </header>
    <section id="page" class="page"></section>
  </main>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div id="modal" class="modal"></div>
</div>
<div id="toastRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getDatabase, ref, onValue, set, push, update, remove, get } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAmy4PcVbc3bUnIEti0rkhhyPvGiLwFRYc",
  authDomain: "absenguru-615da.firebaseapp.com",
  databaseURL: "https://absenguru-615da-default-rtdb.firebaseio.com",
  projectId: "absenguru-615da",
  storageBucket: "absenguru-615da.firebasestorage.app",
  messagingSenderId: "1014411980118",
  appId: "1:1014411980118:web:6f3f702d8aad89af57faf7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const ROOT = "kelasVIIIB";
const SESSION_KEY = "kasKelasSession";

const state = {
  siswa:{}, kasMasuk:{}, kasKeluar:{}, pembayaranStatus:{},
  settings:{weeklyFee:10000,startDate:"2026-01-05",resetState:{cashInOffset:0,cashOutOffset:0},deletedStudents:{}}
};
let currentUser = null;
let currentPage = "dashboard";
let listenersStarted = false;
let reconcileRunning = false;
let toastTimer = null;

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const rupiah = n => new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
const pad = n => String(n).padStart(2,"0");
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate = s => { if(!s) return null; const a=String(s).split("-").map(Number); if(a.length!==3||!a[0])return null; return new Date(a[0],a[1]-1,a[2]); };
const fmtDate = s => { const d=s instanceof Date?s:parseDate(s); return d?d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"-"; };
const nowDate = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowTime = () => new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
const activeStudents = () => Object.entries(state.siswa).filter(([id,s]) => !isDeleted(id) && s && s.aktif !== false);
const isDeleted = id => !!(state.settings.deletedStudents && state.settings.deletedStudents[id]);
const studentName = id => state.siswa[id]?.nama || "Siswa dihapus";
const initials = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase() || "?";

function showToast(message,type="success"){
  clearTimeout(toastTimer);
  $("toastRoot").innerHTML=`<div class="toast ${type}"><span>${type==="success"?"✓":type==="error"?"✕":"!"}</span><span>${esc(message)}</span></div>`;
  toastTimer=setTimeout(()=>{$("toastRoot").innerHTML=""},3000);
}
function openModal(title,body,actions=""){
  $("modal").innerHTML=`<div class="modal-head"><h3>${esc(title)}</h3><button class="close" type="button" data-close>×</button></div><div class="modal-body">${body}</div>${actions?`<div class="modal-foot">${actions}</div>`:""}`;
  $("modalOverlay").classList.remove("hidden");
  $("modal").querySelector("[data-close]")?.addEventListener("click",closeModal);
}
function closeModal(){ $("modalOverlay").classList.add("hidden"); $("modal").innerHTML=""; }
function confirmAction(title,message,onYes,danger=true){
  openModal(title,`<p style="margin:0;line-height:1.6">${esc(message)}</p>`,
    `<button class="btn btn-light" type="button" data-close>Batal</button><button class="btn ${danger?"btn-danger":"btn-primary"}" type="button" id="confirmYes">Ya, lanjutkan</button>`);
  $("modal").querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
  $("confirmYes").addEventListener("click",async()=>{closeModal();try{await onYes();}catch(e){console.error(e);showToast("Operasi gagal. Periksa koneksi Firebase.","error")}}, {once:true});
}
function setSession(obj){sessionStorage.setItem(SESSION_KEY,JSON.stringify(obj))}
function clearSession(){sessionStorage.removeItem(SESSION_KEY)}
function restoreSession(){try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null")}catch{return null}}

function startListeners(){
  if(listenersStarted)return;
  listenersStarted=true;
  onValue(ref(db,`${ROOT}/siswa`),s=>{state.siswa=s.val()||{}; renderLoginStudents(); render();});
  onValue(ref(db,`${ROOT}/kasMasuk`),s=>{state.kasMasuk=s.val()||{}; reconcilePaymentStatus(); render();});
  onValue(ref(db,`${ROOT}/kasKeluar`),s=>{state.kasKeluar=s.val()||{}; render();});
  onValue(ref(db,`${ROOT}/pembayaranStatus`),s=>{state.pembayaranStatus=s.val()||{}; render();});
  onValue(ref(db,`${ROOT}/settings`),s=>{
    const v=s.val()||{};
    state.settings={weeklyFee:Number(v.weeklyFee)||10000,startDate:v.startDate||"2026-01-05",resetState:v.resetState||{cashInOffset:0,cashOutOffset:0},deletedStudents:v.deletedStudents||{}};
    render();
  });
}
async function reconcilePaymentStatus(){
  if(reconcileRunning)return;
  reconcileRunning=true;
  try{
    const updates={};
    for(const [id,t] of Object.entries(state.kasMasuk)){
      if(t?.jenis==="pembayaran" && t.siswaId && t.periodeKey){
        const existing=state.pembayaranStatus?.[t.siswaId]?.[t.periodeKey];
        if(!existing){
          updates[`${ROOT}/pembayaranStatus/${t.siswaId}/${t.periodeKey}`]={
            paid:true,amount:Number(t.jumlah)||0,paidAt:Number(t.createdAt)||Date.now(),
            kasMasukId:id,studentName:t.siswaNama||studentName(t.siswaId),
            periodKey:t.periodeKey,periodLabel:t.periodeLabel||""
          };
        }else if(!existing.kasMasukId){
          updates[`${ROOT}/pembayaranStatus/${t.siswaId}/${t.periodeKey}/kasMasukId`]=id;
        }
      }
    }
    if(Object.keys(updates).length)await update(ref(db),updates);
  }finally{reconcileRunning=false}
}

function periods(){
  const start=parseDate(state.settings.startDate); if(!start)return [];
  start.setHours(0,0,0,0); const today=new Date();today.setHours(0,0,0,0);
  if(start>today)return [];
  const out=[];let d=new Date(start),i=1;
  while(d<=today&&i<1000){
    const end=new Date(d);end.setDate(end.getDate()+6);
    out.push({index:i,key:`P-${dateKey(d)}`,start:new Date(d),end,label:`Periode ${i} • ${fmtDate(d)} – ${fmtDate(end)}`});
    d.setDate(d.getDate()+7);i++;
  } return out;
}
function statusFor(sid,key){return state.pembayaranStatus?.[sid]?.[key]?.paid===true}
function unpaidPeriods(sid){return periods().filter(p=>!statusFor(sid,p.key))}
// ============================================================
// PERHITUNGAN KEUANGAN TERPUSAT
// ============================================================
// Kas masuk = seluruh transaksi kasMasuk yang tersimpan.
// Kas keluar = seluruh transaksi kasKeluar yang tersimpan.
// Saldo = kas masuk - kas keluar.
// pembayaranStatus hanya sebagai status pembayaran, bukan sumber
// kedua, sehingga saldo tidak terhitung dua kali.
// ============================================================
function totalKasMasuk(){
  let total=0;
  const linkedPaymentIds=new Set();
  for(const [id,t] of Object.entries(state.kasMasuk||{})){
    if(!t)continue;
    total+=Number(t.jumlah)||0;
    linkedPaymentIds.add(String(id));
    if(t.id)linkedPaymentIds.add(String(t.id));
  }
  // Kompatibilitas data lama yang hanya memiliki pembayaranStatus.
  for(const ps of Object.values(state.pembayaranStatus||{})){
    for(const p of Object.values(ps||{})){
      if(!p?.paid)continue;
      const linkedId=String(p.kasMasukId||"");
      if(linkedId&&linkedPaymentIds.has(linkedId))continue;
      if(linkedId)continue;
      total+=Number(p.amount)||Number(state.settings.weeklyFee)||0;
    }
  }
  const off=Number(state.settings.resetState?.cashInOffset)||0;
  return Math.max(0,total-off);
}
function totalKasKeluar(){
  const raw=Object.values(state.kasKeluar||{}).reduce((a,t)=>a+(Number(t?.jumlah)||0),0);
  const off=Number(state.settings.resetState?.cashOutOffset)||0;
  return Math.max(0,raw-off);
}
function saldoKas(){return totalKasMasuk()-totalKasKeluar()}
function persistentCashIn(){return totalKasMasuk()}
function cashOut(){return totalKasKeluar()}
function allRecentPayments(){
  const arr=[];
  for(const [sid,ps] of Object.entries(state.pembayaranStatus||{})){
    if(isDeleted(sid))continue;
    for(const [key,p] of Object.entries(ps||{}))if(p?.paid)arr.push({id:p.kasMasukId||`${sid}-${key}`,siswaId:sid,siswaNama:p.studentName||studentName(sid),periodeKey:key,periodeLabel:p.periodLabel||key,jumlah:Number(p.amount)||Number(state.settings.weeklyFee)||0,createdAt:Number(p.paidAt)||0,tanggal:p.tanggal||""});
  }
  Object.entries(state.kasMasuk).forEach(([id,t])=>{
    if(t?.jenis==="pembayaran"&&t.siswaId&&t.periodeKey&&statusFor(t.siswaId,t.periodeKey))return;
    if(t?.jenis==="pembayaran")arr.push({...t,id,jumlah:Number(t.jumlah)||0,createdAt:Number(t.createdAt)||0});
  });
  return arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}
function totalArrears(sid){return unpaidPeriods(sid).length*(Number(state.settings.weeklyFee)||0)}
function anyArrears(){return activeStudents().some(([id])=>unpaidPeriods(id).length>0)}

const pages={dashboard:"Beranda",kasMasuk:"Kas Masuk",kasKeluar:"Kas Keluar",siswa:"Daftar Siswa",nunggak:"Siswa Nunggak",riwayat:"Riwayat",pengaturan:"Pengaturan"};

function navItems(){

  ];
  if(currentUser?.role==="bendahara")common.push(["siswa","♙","Daftar Siswa"],["nunggak","!","Siswa Nunggak"],["riwayat","☷","Riwayat"],["pengaturan","⚙","Pengaturan"]);

function renderNav(){

    `<button class="danger" data-logout type="button"><span>↪</span><span>Logout</span></button>`;

function navigate(page){currentPage=page;closeSidebar();render()}
function closeSidebar(){document.body.classList.remove("sidebar-open");$("sidebar").classList.remove("open");$("mobileOverlay").classList.remove("visible")}
function toggleSidebar(){document.body.classList.toggle("sidebar-open");$("sidebar").classList.toggle("open");$("mobileOverlay").classList.toggle("visible")}
function render(){

  renderNav();
  $("sideUser").textContent=currentUser.name;

function pageTitle(title,sub="",actions=""){return `<div class="section-head"><div><h2>${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:""}</div><div class="actions">${actions}</div></div>`}
function statCard(label,value,cls=""){return `<div class="card stat"><div class="label">${esc(label)}</div><div class="value ${cls}">${value}</div></div>`}

function renderDashboard(){
  const cin=totalKasMasuk(),cout=totalKasKeluar(),saldo=saldoKas(), arrears=activeStudents().filter(([id])=>unpaidPeriods(id).length).length;
  const latest=allRecentPayments(), visible=latest.slice(0,5);
  $("page").innerHTML=`
    <div class="hero"><div><h1>Selamat datang, ${esc(currentUser.name)}</h1><p>Kelola pembayaran dan keuangan kelas dengan lebih mudah.</p></div><div class="hero-badge">${currentUser.role==="bendahara"?"Mode Bendahara":"Mode Anggota"}</div></div>
    <div class="grid stats" style="margin-top:16px">${statCard("Total Kas Masuk",rupiah(cin),"green")}${statCard("Total Kas Keluar",rupiah(cout),"red")}${statCard("Saldo Kelas",rupiah(saldo),saldo>=0?"green":"red")}</div>
    ${currentUser.role==="bendahara"&&arrears?`<div class="notice danger" style="margin-top:16px"><div><b>Perlu perhatian</b><br><span style="font-size:11px">${arrears} siswa masih memiliki tunggakan.</span></div><button class="btn btn-danger" data-go-nunggak>Lihat Semua</button></div>`:""}
    ${currentUser.role==="anggota"&&unpaidPeriods(currentUser.studentId).length?`<div class="notice danger" style="margin-top:16px"><div><b>Anda memiliki tunggakan kas</b><br><span style="font-size:11px">${unpaidPeriods(currentUser.studentId).length} periode • ${rupiah(totalArrears(currentUser.studentId))}</span></div><span class="badge badge-red">Belum Lunas</span></div>`:`${currentUser.role==="anggota"?`<div class="notice" style="margin-top:16px;background:#edf9f4;border-color:#bde8d3;color:#08754b"><div><b>Pembayaran Anda sudah lunas</b><br><span style="font-size:11px">Tidak ada tunggakan sampai hari ini.</span></div><span class="badge badge-green">Lunas</span></div>`:""}`}
    ${pageTitle("Pembayaran Terbaru","5 pembayaran terakhir",latest.length>5?`<button class="btn btn-light" data-go-history>Lihat Semua</button>`:"")}
    <div class="card"><div class="recent-list">${visible.length?visible.map(paymentCard).join(""):`<div class="empty" style="grid-column:1/-1">Belum ada pembayaran.</div>`}</div></div>
    ${pageTitle("Aktivitas Terbaru","Ringkasan transaksi kelas",`<button class="btn btn-light" data-go-history>Lihat Semua</button>`)}

  bindPageActions();

function paymentCard(p){
  return `<div class="recent-item"><div class="avatar">${esc(initials(p.siswaNama))}</div><div class="item-main"><div class="item-title">${esc(p.siswaNama||"-")}</div><div class="item-sub">${esc(p.periodeLabel||"Pembayaran kas")} • ${p.createdAt?fmtDate(new Date(p.createdAt)):"-"}</div></div><div><div class="amount green">+${rupiah(p.jumlah)}</div><span class="badge badge-green">Lunas</span></div></div>`;

function historyItems(){
  const arr=[];
  Object.entries(state.kasMasuk).forEach(([id,t])=>arr.push({...t,id,type:"in"}));
  Object.entries(state.kasKeluar).forEach(([id,t])=>arr.push({...t,id,type:"out"}));
  return arr.filter(t=>currentUser.role==="bendahara"||t.type==="out"||t.siswaId===currentUser.studentId).sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));
}
function historyItem(t){

function bindPageActions(){

function openCashInModal(editId=null,presetStudent=null){
  const t=editId?state.kasMasuk[editId]:null;
  const students=activeStudents().sort((a,b)=>String(a[1].nama).localeCompare(String(b[1].nama)));
  openModal(t?"Edit Kas Masuk":"Tambah Kas Masuk",`
    <form id="cashInForm" class="form-grid">
      <div class="field"><label>Jenis</label><select id="ciType"><option value="pembayaran" ${(!t||t.jenis==="pembayaran")?"selected":""}>Pembayaran Siswa</option><option value="lainnya" ${t?.jenis==="lainnya"?"selected":""}>Pemasukan Lainnya</option></select></div>
      <div class="field"><label>Tanggal</label><input id="ciDate" type="date" value="${esc(t?.tanggal||nowDate())}" required></div>
      <div class="field ${t?.jenis==="lainnya"?"":"full"}" id="ciStudentWrap"><label>Siswa</label><select id="ciStudent"><option value="">Pilih siswa</option>${students.map(([id,s])=>`<option value="${esc(id)}" ${t?.siswaId===id||presetStudent===id?"selected":""}>${esc(s.nama)}</option>`).join("")}</select></div>
      <div class="field full" id="ciPeriodWrap"><label>Periode pembayaran</label><select id="ciPeriod"><option value="">Pilih periode</option></select></div>
      <div class="field"><label>Jumlah</label><input id="ciAmount" type="number" min="0" value="${Number(t?.jumlah)||Number(state.settings.weeklyFee)||0}" required></div>
      <div class="field"><label>Kategori</label><input id="ciCategory" value="${esc(t?.kategori||"Kas Mingguan")}"></div>
      <div class="field full"><label>Keterangan</label><textarea id="ciNote">${esc(t?.keterangan||"")}</textarea></div>
    </form>`,
    `<button class="btn btn-light" type="button" data-close>Batal</button><button class="btn btn-primary" id="saveCashIn" type="button">Simpan</button>`);
  const type=$("ciType"),student=$("ciStudent"),period=$("ciPeriod"),amount=$("ciAmount");
  function sync(){
    const payment=type.value==="pembayaran";$("ciStudentWrap").classList.toggle("hidden",!payment);$("ciPeriodWrap").classList.toggle("hidden",!payment);
    if(payment){
      const sid=student.value;
      const list=periods().filter(p=>!statusFor(sid,p.key)||p.key===t?.periodeKey);
      period.innerHTML=`<option value="">Pilih periode</option>`+list.map(p=>`<option value="${esc(p.key)}" ${t?.periodeKey===p.key?"selected":""}>${esc(p.label)}${statusFor(sid,p.key)&&p.key===t?.periodeKey?" • sudah tersimpan":""}</option>`).join("");
      if(!editId && sid && !presetStudent && list.length)period.value=list[0].key;
      amount.value=Number(t?.jumlah)||Number(state.settings.weeklyFee)||0;
    }
  }
  type.addEventListener("change",sync);student.addEventListener("change",sync);sync();
  $("modal").querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
  $("saveCashIn").addEventListener("click",async()=>{
    const payment=type.value==="pembayaran",sid=student.value,pk=period.value;
    if(payment&&(!sid||!pk))return showToast("Pilih siswa dan periode pembayaran.","warning");
    const n=Number(amount.value);if(!n||n<0)return showToast("Jumlah harus diisi.","warning");
    try{
      if(editId){
        const old=state.kasMasuk[editId];
        const tx={...old,tanggal:$("ciDate").value,waktu:old.waktu||nowTime(),jenis:type.value,kategori:$("ciCategory").value.trim(),keterangan:$("ciNote").value.trim(),jumlah:n,updatedAt:Date.now()};
        const updates={[`${ROOT}/kasMasuk/${editId}`]:tx};
        if(payment&&sid&&pk){
          updates[`${ROOT}/pembayaranStatus/${sid}/${pk}`]={paid:true,amount:n,paidAt:old.createdAt||Date.now(),kasMasukId:editId,studentName:studentName(sid),periodKey:pk,periodLabel:period.options[period.selectedIndex]?.text||pk};
        }
        await update(ref(db),updates);
      }else{
        const r=push(ref(db,`${ROOT}/kasMasuk`)),id=r.key;
        const tx={id,tanggal:$("ciDate").value,waktu:nowTime(),jenis:type.value,kategori:$("ciCategory").value.trim(),keterangan:$("ciNote").value.trim(),jumlah:n,createdAt:Date.now()};
        if(payment){tx.siswaId=sid;tx.siswaNama=studentName(sid);tx.periodeKey=pk;tx.periodeLabel=period.options[period.selectedIndex]?.text||pk}
        const updates={[`${ROOT}/kasMasuk/${id}`]:tx};
        if(payment)updates[`${ROOT}/pembayaranStatus/${sid}/${pk}`]={paid:true,amount:n,paidAt:Date.now(),kasMasukId:id,studentName:studentName(sid),periodKey:pk,periodLabel:tx.periodeLabel};
        await update(ref(db),updates);
      }
      closeModal();showToast("Kas masuk berhasil disimpan.");
    }catch(e){console.error(e);showToast("Gagal menyimpan kas masuk.","error")}
  });
}

  });
}
async function deleteStudent(id){
  const s=state.siswa[id];if(!s)return;
  confirmAction("Hapus siswa",`Hapus ${s.nama}? Data pembayaran lama tidak dihapus, tetapi siswa tidak lagi dihitung dalam saldo aktif.`,async()=>{
    const updates={};
    updates[`${ROOT}/settings/deletedStudents/${id}`]={nama:s.nama,deletedAt:Date.now()};
    updates[`${ROOT}/siswa/${id}/aktif`]=false;
    await update(ref(db),updates);showToast("Siswa berhasil dihapus.");
  });
}

function renderNunggak(){
  const rows=activeStudents().map(([id,s])=>({id,s,unpaid:unpaidPeriods(id)})).filter(x=>x.unpaid.length);
  $("page").innerHTML=pageTitle("Siswa Nunggak","Daftar siswa yang belum melunasi periode kas",`<button class="btn btn-light" data-refresh>Refresh</button>`)+
  `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${rows.length?rows.map(x=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><b style="font-size:13px">${esc(x.s.nama)}</b><div class="item-sub">${esc(x.s.kelas||"VII B")} • ${esc(x.s.jenisKelamin||"-")}</div></div><span class="badge badge-red">${x.unpaid.length} periode</span></div><div style="margin:15px 0;font-size:18px;font-weight:800;color:var(--red)">${rupiah(totalArrears(x.id))}</div><div class="actions"><button class="btn btn-primary" style="width:100%" data-pay-student="${x.id}">Bayar</button></div></div>`).join(""):`<div class="card" style="grid-column:1/-1"><div class="empty">Tidak ada siswa yang menunggak. Semua pembayaran sudah lunas.</div></div>`}</div>`;
  document.querySelector("[data-refresh]").addEventListener("click",()=>{render();showToast("Data tunggakan diperbarui.")});
  document.querySelectorAll("[data-pay-student]").forEach(b=>b.addEventListener("click",()=>openPaymentModal(b.dataset.payStudent)));
}
function openPaymentModal(sid){
  const s=state.siswa[sid];if(!s)return;
  const unpaid=unpaidPeriods(sid),fee=Number(state.settings.weeklyFee)||0;
  openModal(`Bayar Kas • ${s.nama}`,`
    <div class="notice" style="margin-bottom:12px"><div><b>${unpaid.length} periode belum dibayar</b><br><span style="font-size:10px">Tarif ${rupiah(fee)} / periode</span></div><strong>${rupiah(unpaid.length*fee)}</strong></div>
    <div class="period-list">${unpaid.map(p=>`<label class="period"><span><b style="font-size:10px">${esc(p.label)}</b><small>${rupiah(fee)}</small></span><input type="checkbox" class="pay-check" value="${esc(p.key)}" checked></label>`).join("")}</div>`,
    `<button class="btn btn-light" type="button" data-close>Batal</button><button class="btn btn-primary" id="payNow" type="button">Bayar & Simpan</button>`);
  $("modal").querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
  $("payNow").addEventListener("click",async()=>{
    const selected=[...document.querySelectorAll(".pay-check:checked")].map(x=>x.value);if(!selected.length)return showToast("Pilih minimal satu periode.","warning");
    const updates={};
    try{
      for(const pk of selected){
        const p=unpaid.find(x=>x.key===pk);if(!p)continue;
        const r=push(ref(db,`${ROOT}/kasMasuk`)),id=r.key;
        const tx={id,tanggal:nowDate(),waktu:nowTime(),jenis:"pembayaran",kategori:"Kas Mingguan",keterangan:`Pembayaran ${p.label}`,siswaId:sid,siswaNama:s.nama,periodeKey:pk,periodeLabel:p.label,jumlah:fee,createdAt:Date.now()};
        updates[`${ROOT}/kasMasuk/${id}`]=tx;
        updates[`${ROOT}/pembayaranStatus/${sid}/${pk}`]={paid:true,amount:fee,paidAt:Date.now(),kasMasukId:id,studentName:s.nama,periodKey:pk,periodLabel:p.label};
      }
      await update(ref(db),updates);closeModal();showToast("Pembayaran berhasil disimpan. Saldo kas otomatis bertambah.");
    }catch(e){console.error(e);showToast("Pembayaran gagal disimpan.","error")}
  });
}

function renderRiwayat(){
  const arr=historyItems();
  $("page").innerHTML=pageTitle("Riwayat","Seluruh aktivitas transaksi",currentUser.role==="bendahara"?`<button class="btn btn-danger" data-delete-history>Hapus Riwayat</button>`:"")+
  `<div class="card"><div class="list">${arr.length?arr.map(t=>`<div class="item"><div class="item-main"><div class="item-title"><span class="badge ${t.type==="in"?"badge-green":"badge-red"}">${t.type==="in"?"KAS MASUK":"KAS KELUAR"}</span> ${esc(t.type==="in"?(t.siswaNama||t.kategori||"-"):(t.kategori||"-"))}</div><div class="item-sub">${esc(t.keterangan||t.periodeLabel||"-")} • ${esc(t.tanggal||"-")} ${esc(t.waktu||"")}</div></div><div class="amount ${t.type==="in"?"green":"red"}">${t.type==="in"?"+":"-"}${rupiah(t.jumlah)}</div></div>`).join(""):`<div class="empty">Belum ada riwayat.</div>`}</div></div>`;
  if(currentUser.role==="bendahara")$("page").querySelector("[data-delete-history]").addEventListener("click",()=>confirmAction("Hapus seluruh riwayat","Semua riwayat kas masuk dan kas keluar akan dihapus. Status pembayaran siswa tetap tersimpan.",async()=>{await update(ref(db),{[`${ROOT}/kasMasuk`]:null,[`${ROOT}/kasKeluar`]:null});showToast("Seluruh riwayat berhasil dihapus.")}));
}

function renderSettings(){
  $("page").innerHTML=pageTitle("Pengaturan","Atur periode dan nominal kas mingguan")+
  `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr))">
    <div class="card"><h3 style="margin:0 0 5px;font-size:14px">Pembayaran Kas</h3><p style="font-size:10px;color:var(--muted);margin:0 0 16px">Periode dihitung setiap 7 hari dari tanggal mulai yang dipilih.</p>
      <div class="form-grid"><div class="field"><label>Jumlah per minggu</label><input id="setFee" type="number" min="0" value="${Number(state.settings.weeklyFee)||0}"></div><div class="field"><label>Mulai periode</label><input id="setStart" type="date" value="${esc(state.settings.startDate||"")}"></div></div>
      <div style="margin-top:14px"><button class="btn btn-primary" id="saveSettings">Simpan Pengaturan</button></div>
    </div>
    <div class="card"><h3 style="margin:0 0 5px;font-size:14px">Reset Tampilan Saldo</h3><p style="font-size:10px;color:var(--muted);margin:0 0 16px">Reset tidak menghapus riwayat. Masukkan password reset untuk menjalankan proses.</p>
      <div class="field"><label>Password Reset</label><input id="resetPassword" type="password" placeholder="Masukkan password reset"></div>
      <div style="margin-top:14px"><button class="btn btn-danger" id="doReset">Reset</button></div>
    </div>
  </div>
  <div class="card" style="margin-top:16px"><b style="font-size:12px">Catatan</b><p style="font-size:10px;color:var(--muted);line-height:1.6;margin-bottom:0">Mengubah tanggal mulai akan mengubah pembentukan periode yang ditampilkan. Data pembayaran lama tetap tersimpan di database.</p></div>`;
  $("saveSettings").addEventListener("click",async()=>{
    const fee=Number($("setFee").value),start=$("setStart").value;
    if(!start||fee<0)return showToast("Jumlah dan tanggal mulai harus diisi dengan benar.","warning");
    try{await update(ref(db,`${ROOT}/settings`),{weeklyFee:fee,startDate:start});closeModal();showToast("Berhasil disimpan. Pengaturan pembayaran telah diperbarui.");}catch(e){showToast("Gagal menyimpan pengaturan.","error")}
  });
  $("doReset").addEventListener("click",async()=>{
    if($("resetPassword").value!=="060999")return showToast("Password reset salah.","error");
    confirmAction("Konfirmasi Reset","Saldo tampilan akan direset tanpa menghapus riwayat transaksi. Lanjutkan?",async()=>{
      const cinRaw=Object.values(state.kasMasuk||{}).reduce((a,t)=>a+(Number(t?.jumlah)||0),0)+Object.values(state.pembayaranStatus||{}).reduce((sum,ps)=>sum+Object.values(ps||{}).filter(p=>p?.paid&&!p?.kasMasukId).reduce((x,p)=>x+(Number(p.amount)||Number(state.settings.weeklyFee)||0),0),0);
       const outRaw=Object.values(state.kasKeluar||{}).reduce((a,t)=>a+(Number(t?.jumlah)||0),0);
      await update(ref(db,`${ROOT}/settings/resetState`),{cashInOffset:cinRaw,cashOutOffset:outRaw,resetAt:Date.now()});
      $("resetPassword").value="";showToast("Reset berhasil dieksekusi.");
    },true);
  });
}

  if($("loginUser").value.trim()==="iissumirat123"&&$("loginPass").value==="112233"){
    currentUser={role:"bendahara",name:"Bendahara"};setSession(currentUser);showApp();showToast("Login berhasil.");

});
$("loginAnggota").addEventListener("submit",e=>{
  e.preventDefault();const sid=$("loginStudent").value,s=state.siswa[sid];
  if(!sid||!s)return showToast("Pilih siswa terlebih dahulu.","warning");
  if(($("loginStudentPass").value||"123456")!==(s.password||"123456"))return showToast("Password siswa salah.","error");
  currentUser={role:"anggota",name:s.nama,studentId:sid};setSession(currentUser);showApp();
  if(unpaidPeriods(sid).length)showToast(`Peringatan: Anda memiliki ${unpaidPeriods(sid).length} periode tunggakan.`,"warning");else showToast("Login berhasil.");
});

document.querySelectorAll(".year").forEach(x=>x.textContent=new Date().getFullYear());
