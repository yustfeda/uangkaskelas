<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0b1f3a">
<title>KAS KELAS VII B</title>

<style>
/* =========================================================
   KAS KELAS VII B
   Professional Responsive UI
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --navy:#0b1f3a;
    --navy-2:#102b4d;
    --navy-3:#173d69;

    --green:#16a34a;
    --green-dark:#15803d;
    --green-light:#dcfce7;

    --white:#ffffff;
    --bg:#f4f7fb;
    --card:#ffffff;

    --text:#172033;
    --text-soft:#64748b;
    --border:#e5eaf0;

    --yellow:#f59e0b;
    --yellow-light:#fef3c7;

    --red:#dc2626;
    --red-light:#fee2e2;

    --blue-light:#eaf2fb;

    --shadow:0 8px 25px rgba(15,23,42,.07);
    --shadow-lg:0 18px 50px rgba(15,23,42,.13);

    --sidebar-width:255px;
    --topbar-height:64px;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    font-size:14px;
}

body.sidebar-open{
    overflow:hidden;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

input,
select,
textarea{
    outline:none;
}

.hidden{
    display:none !important;
}

/* =========================================================
   LOGIN
   ========================================================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(22,163,74,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(59,130,246,.14),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #07172c,
            #0b1f3a 50%,
            #12345b
        );
}

.login-decoration{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    pointer-events:none;
}

.login-decoration.one{
    width:260px;
    height:260px;
    background:rgba(22,163,74,.08);
    top:-90px;
    right:-70px;
}

.login-decoration.two{
    width:200px;
    height:200px;
    background:rgba(255,255,255,.04);
    bottom:-80px;
    left:-60px;
}

.login-box{
    width:100%;
    max-width:430px;
    position:relative;
    z-index:2;
}

.login-card{
    background:rgba(255,255,255,.98);
    border-radius:24px;
    padding:30px;
    box-shadow:0 25px 80px rgba(0,0,0,.28);
    border:1px solid rgba(255,255,255,.5);
}

.login-brand{
    text-align:center;
    margin-bottom:24px;
}

.login-logo{
    width:72px;
    height:72px;
    margin:0 auto 14px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            var(--navy),
            var(--navy-3)
        );

    color:white;
    font-weight:900;
    font-size:22px;

    box-shadow:
        0 12px 25px rgba(11,31,58,.25),
        inset 0 1px rgba(255,255,255,.12);
}

.login-title{
    color:var(--navy);
    font-size:22px;
    font-weight:850;
    letter-spacing:-.4px;
}

.login-subtitle{
    color:var(--text-soft);
    font-size:12px;
    margin-top:5px;
}

.login-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
    padding:4px;
    background:#eef2f7;
    border-radius:12px;
    margin-bottom:20px;
}

.login-tabs button{
    background:transparent;
    color:var(--text-soft);
    padding:10px;
    border-radius:9px;
    font-size:13px;
    font-weight:750;
    transition:.2s;
}

.login-tabs button.active{
    color:var(--navy);
    background:white;
    box-shadow:0 3px 10px rgba(15,23,42,.08);
}

.login-footer{
    text-align:center;
    color:#94a3b8;
    font-size:10px;
    margin-top:18px;
}

/* =========================================================
   FORM
   ========================================================= */

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:12px;
    font-weight:750;
    color:#334155;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid var(--border);
    background:white;
    color:var(--text);
    border-radius:10px;
    padding:11px 12px;
    font-size:13px;
    transition:.2s;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(22,163,74,.08);
}

/* =========================================================
   BUTTON
   ========================================================= */

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:9px 13px;
    min-height:38px;
    border-radius:9px;
    font-size:12px;
    font-weight:750;
    transition:.2s;
    white-space:nowrap;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn:active{
    transform:translateY(0);
}

.btn-primary{
    color:white;
    background:linear-gradient(
        135deg,
        var(--green),
        var(--green-dark)
    );
}

.btn-primary:hover{
    box-shadow:0 7px 18px rgba(22,163,74,.2);
}

.btn-navy{
    color:white;
    background:linear-gradient(
        135deg,
        var(--navy),
        var(--navy-3)
    );
}

.btn-danger{
    color:white;
    background:var(--red);
}

.btn-warning{
    color:white;
    background:var(--yellow);
}

.btn-light{
    color:#334155;
    background:#eef2f7;
}

.btn-outline{
    color:var(--navy);
    border:1px solid var(--border);
    background:white;
}

.btn-full{
    width:100%;
}

/* =========================================================
   APP
   ========================================================= */

#appScreen{
    display:none;
    min-height:100vh;
}

.sidebar{
    position:fixed;
    z-index:1200;
    top:0;
    left:0;
    bottom:0;
    width:var(--sidebar-width);

    background:
        linear-gradient(
            180deg,
            #091c34 0%,
            #0b1f3a 55%,
            #09203b 100%
        );

    color:white;
    transition:.28s ease;
    overflow-y:auto;
    overflow-x:hidden;

    box-shadow:
        5px 0 25px rgba(2,6,23,.08);
}

.sidebar::-webkit-scrollbar{
    width:4px;
}

.sidebar::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.15);
    border-radius:20px;
}

.sidebar-header{
    padding:21px 18px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.sidebar-brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.sidebar-logo{
    width:38px;
    height:38px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:rgba(255,255,255,.1);
    color:white;
    font-weight:900;
    font-size:13px;
}

.sidebar-title{
    font-size:14px;
    font-weight:850;
}

.sidebar-role{
    margin-top:3px;
    color:#9fb2c9;
    font-size:10px;
}

.nav{
    padding:14px 9px;
}

.nav-label{
    color:#6f87a4;
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:10px 12px 7px;
}

.nav-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;

    color:#c8d5e5;
    background:transparent;

    padding:10px 12px;
    border-radius:9px;
    margin-bottom:3px;

    font-size:12px;
    font-weight:650;

    text-align:left;
    transition:.18s;
}

.nav-icon{
    width:25px;
    height:25px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:7px;

    background:rgba(255,255,255,.045);
    font-size:12px;
}

.nav-item:hover{
    background:rgba(255,255,255,.07);
    color:white;
}

.nav-item.active{
    color:white;
    background:
        linear-gradient(
            90deg,
            rgba(22,163,74,.24),
            rgba(22,163,74,.08)
        );
    box-shadow:inset 3px 0 var(--green);
}

.nav-item.active .nav-icon{
    background:rgba(22,163,74,.2);
}

.nav-item.logout{
    margin-top:12px;
    color:#fca5a5;
}

.main{
    min-height:100vh;
    margin-left:var(--sidebar-width);
}

.topbar{
    height:var(--topbar-height);
    position:sticky;
    z-index:800;
    top:0;

    display:flex;
    align-items:center;

    padding:0 22px;

    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);

    border-bottom:1px solid var(--border);
}

.topbar-left{
    display:flex;
    align-items:center;
    min-width:0;
}

.topbar-title{
    font-size:16px;
    font-weight:800;
    color:var(--navy);
}

.topbar-subtitle{
    color:#94a3b8;
    font-size:10px;
    margin-left:10px;
    padding-left:10px;
    border-left:1px solid var(--border);
}

.hamburger{
    display:none;

    width:38px;
    height:38px;
    flex-shrink:0;

    margin-right:10px;

    border-radius:9px;

    background:var(--navy);
    color:white;

    align-items:center;
    justify-content:center;

    font-size:18px;
}

/* =========================================================
   PAGE
   ========================================================= */

.page{
    width:100%;
    max-width:1450px;
    margin:auto;
    padding:22px;
}

.page-heading{
    margin-bottom:18px;
}

.page-heading h1{
    color:var(--navy);
    font-size:20px;
    font-weight:850;
}

.page-heading p{
    color:var(--text-soft);
    font-size:11px;
    margin-top:4px;
}

/* =========================================================
   DASHBOARD
   ========================================================= */

.welcome-card{
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(22,163,74,.2),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            var(--navy),
            var(--navy-2)
        );

    color:white;

    border-radius:18px;
    padding:22px;
    margin-bottom:17px;

    box-shadow:var(--shadow);
}

.welcome-card::after{
    content:"";
    position:absolute;
    width:140px;
    height:140px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    right:-45px;
    bottom:-65px;
}

.welcome-card h2{
    position:relative;
    z-index:1;
    font-size:20px;
    font-weight:850;
    margin-bottom:5px;
}

.welcome-card p{
    position:relative;
    z-index:1;
    color:#bdcce0;
    font-size:11px;
    line-height:1.5;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:17px;
}

.stat-card{
    position:relative;
    overflow:hidden;

    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;

    padding:17px;

    box-shadow:var(--shadow);
}

.stat-card::after{
    content:"";
    position:absolute;
    width:55px;
    height:55px;
    border-radius:50%;
    right:-25px;
    bottom:-25px;
    background:rgba(22,163,74,.05);
}

.stat-title{
    color:var(--text-soft);
    font-size:10px;
    font-weight:800;
    letter-spacing:.3px;
    margin-bottom:8px;
}

.stat-value{
    font-size:20px;
    font-weight:850;
    letter-spacing:-.4px;
}

.stat-green .stat-value{
    color:var(--green);
}

.stat-red .stat-value{
    color:var(--red);
}

.stat-navy .stat-value{
    color:var(--navy);
}

/* =========================================================
   SECTION / CARD
   ========================================================= */

.section{
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    padding:17px;
    margin-bottom:17px;
    box-shadow:var(--shadow);
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
}

.section-title{
    color:var(--navy);
    font-size:14px;
    font-weight:850;
}

.section-subtitle{
    color:var(--text-soft);
    font-size:10px;
    margin-top:3px;
}

.action-row{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
}

/* =========================================================
   PAYMENT LATEST
   ========================================================= */

.payment-latest{
    display:grid;
    gap:8px;
}

.payment-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    padding:11px 12px;

    border:1px solid #edf1f5;
    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f8fafc
        );

    transition:.18s;
}

.payment-card:hover{
    transform:translateY(-1px);
    border-color:#d9e5dd;
    box-shadow:0 5px 16px rgba(15,23,42,.05);
}

.payment-left{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.payment-icon{
    width:38px;
    height:38px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    color:var(--green);
    background:var(--green-light);

    font-size:14px;
    font-weight:900;
}

.payment-info{
    min-width:0;
}

.payment-name{
    max-width:270px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    color:var(--text);
    font-size:12px;
    font-weight:800;
}

.payment-period{
    margin-top:3px;
    color:var(--text-soft);
    font-size:10px;

    max-width:300px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.payment-right{
    flex-shrink:0;
    text-align:right;
}

.payment-amount{
    color:var(--green);
    font-size:11px;
    font-weight:850;
}

.payment-date{
    color:#94a3b8;
    font-size:9px;
    margin-top:3px;
}

.view-all{
    width:100%;
    margin-top:3px;

    padding:10px;

    border-radius:9px;

    color:var(--green-dark);
    background:#effaf2;

    font-size:11px;
    font-weight:800;

    transition:.2s;
}

.view-all:hover{
    background:var(--green-light);
}

.empty{
    padding:25px 15px;
    color:#94a3b8;
    text-align:center;
    font-size:11px;
}

/* =========================================================
   TABLE
   ========================================================= */

.table-wrap{
    width:100%;
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:10px;
}

.table-wrap::-webkit-scrollbar{
    height:5px;
}

.table-wrap::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border-radius:20px;
}

table{
    width:100%;
    min-width:650px;
    border-collapse:collapse;
}

th,
td{
    padding:10px 11px;
    border-bottom:1px solid var(--border);
    text-align:left;
    font-size:11px;
    white-space:nowrap;
}

tr:last-child td{
    border-bottom:0;
}

th{
    color:#64748b;
    background:#f8fafc;
    font-size:10px;
    font-weight:800;
}

td{
    color:#334155;
}

.badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:4px 8px;
    border-radius:20px;

    font-size:9px;
    font-weight:800;
}

.badge-green{
    color:#166534;
    background:var(--green-light);
}

.badge-red{
    color:#991b1b;
    background:var(--red-light);
}

.badge-yellow{
    color:#92400e;
    background:var(--yellow-light);
}

/* =========================================================
   SETTINGS
   ========================================================= */

.settings-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.setting-card{
    border:1px solid var(--border);
    border-radius:13px;
    padding:15px;
    background:#fcfdff;
}

.setting-card h3{
    color:var(--navy);
    font-size:13px;
    font-weight:800;
    margin-bottom:4px;
}

.setting-card p{
    color:var(--text-soft);
    font-size:10px;
    line-height:1.5;
    margin-bottom:13px;
}

/* =========================================================
   NOTICE
   ========================================================= */

.notice{
    display:flex;
    align-items:flex-start;
    gap:10px;

    padding:12px;

    border-radius:10px;
    margin-bottom:15px;

    font-size:11px;
    line-height:1.5;
}

.notice.warning{
    color:#92400e;
    background:var(--yellow-light);
    border:1px solid #fde68a;
}

.notice.danger{
    color:#991b1b;
    background:var(--red-light);
    border:1px solid #fecaca;
}

.notice.success{
    color:#166534;
    background:var(--green-light);
    border:1px solid #bbf7d0;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:4000;

    display:none;
    align-items:center;
    justify-content:center;

    padding:18px;

    background:rgba(2,6,23,.6);
    backdrop-filter:blur(3px);
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:430px;

    background:white;

    border-radius:17px;

    padding:20px;

    box-shadow:0 25px 70px rgba(0,0,0,.25);

    animation:modalIn .18s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(8px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.modal h3{
    color:var(--navy);
    font-size:16px;
    font-weight:850;
    margin-bottom:7px;
}

.modal p{
    color:var(--text-soft);
    font-size:12px;
    line-height:1.6;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:7px;
    margin-top:18px;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
    position:fixed;
    z-index:6000;

    right:18px;
    bottom:18px;

    max-width:calc(100vw - 36px);

    padding:11px 15px;

    color:white;
    background:var(--navy);

    border-radius:10px;

    box-shadow:var(--shadow-lg);

    font-size:11px;
    font-weight:750;

    opacity:0;
    transform:translateY(20px);
    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

.toast.success{
    background:var(--green);
}

.toast.error{
    background:var(--red);
}

.toast.warning{
    color:#713f12;
    background:var(--yellow-light);
}

/* =========================================================
   MOBILE SIDEBAR
   ========================================================= */

.overlay{
    display:none;
}

@media(max-width:900px){

    :root{
        --sidebar-width:265px;
    }

    .sidebar{
        transform:translateX(-100%);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
    }

    .hamburger{
        display:flex;
    }

    /*
      Ketika sidebar sudah terbuka,
      tombol hamburger disembunyikan agar
      tidak menutupi tulisan menu.
    */
    body.sidebar-open .hamburger{
        display:none;
    }

    .overlay{
        position:fixed;
        inset:0;
        z-index:1100;
        background:rgba(2,6,23,.5);
    }

    .overlay.show{
        display:block;
    }

    .topbar{
        padding:0 14px;
    }

    .topbar-title{
        font-size:14px;
    }

    .topbar-subtitle{
        display:none;
    }

    .page{
        padding:15px;
    }

    .stats{
        grid-template-columns:1fr;
        gap:9px;
    }

    .stat-card{
        padding:14px;
    }

    .stat-value{
        font-size:18px;
    }

    .settings-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    body{
        font-size:13px;
    }

    .page{
        padding:11px;
    }

    .welcome-card{
        padding:17px;
        border-radius:14px;
    }

    .welcome-card h2{
        font-size:17px;
    }

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function rupiah(value){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(
        Number(value) || 0
    );
}


function formatDate(value){

    if(!value) return "-";

    const d = new Date(value);

    if(isNaN(d)) return "-";

    return d.toLocaleDateString(
        "id-ID",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );
}


function formatDateTime(value){

    if(!value) return "-";

    const d = new Date(value);

    if(isNaN(d)) return "-";

    return (
        d.toLocaleDateString(
            "id-ID",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        )
        +" "+
        d.toLocaleTimeString(
            "id-ID",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )
    );
}


function todayString(){

    const d = new Date();

    return [
        d.getFullYear(),
        String(d.getMonth()+1).padStart(2,"0"),
        String(d.getDate()).padStart(2,"0")
    ].join("-");
}


function parseLocalDate(value){

    if(!value) return null;

    const p =
        String(value).split("-");

    if(p.length !== 3) return null;

    const d =
        new Date(
            Number(p[0]),
            Number(p[1])-1,
            Number(p[2])
        );

    d.setHours(0,0,0,0);

    return d;
}


function dateKey(date){

    return [
        date.getFullYear(),
        String(date.getMonth()+1).padStart(2,"0"),
        String(date.getDate()).padStart(2,"0")
    ].join("-");
}

/* =========================================================
   PAYMENT PERIOD
   ========================================================= */

function getPaymentPeriods(){

    const start =
        parseLocalDate(
            appState.settings.startDate
        );


    if(!start) return [];


    const now =
        new Date();

    now.setHours(
        0,0,0,0
    );


    if(start > now){
        return [];
    }


    const periods = [];

    let cursor =
        new Date(start);

    let number = 1;


    while(cursor <= now){

        const periodStart =
            new Date(cursor);

        const periodEnd =
            new Date(cursor);

        periodEnd.setDate(
            periodEnd.getDate()+6
        );


        periods.push({

            index:number,

            key:
                "P-"+dateKey(
                    periodStart
                ),

            start:
                periodStart,

            end:
                periodEnd,

            label:
                `Periode ${number} (${formatDate(periodStart)} - ${formatDate(periodEnd)})`

        });


        cursor.setDate(
            cursor.getDate()+7
        );

        number++;


        if(number > 1000){
            break;
        }

    }


    return periods;

}

){

}

                    item &&
                    item.jenis === "pembayaran" &&
                    item.siswaId &&
                    item.periodeKey
                ){

                    const current =
                        appState
                        .pembayaranStatus
                        ?.[
                            item.siswaId
                        ]
                        ?.[
                            item.periodeKey
                        ];


                    if(
                        !current ||
                        !current.paid
                    ){

                        updates[
                            `${BASE}/pembayaranStatus/${item.siswaId}/${item.periodeKey}`
                        ] = {

                            paid:true,

                            amount:
                                Number(item.jumlah)||0,

                            tanggal:
                                item.tanggal ||
                                new Date().toISOString(),

                            kasMasukId:id

                        };

                    }

                }

            }
        );


        if(
            Object.keys(updates).length
        ){

            await update(
                ref(db),
                updates
            );

        }

    }catch(error){

        console.error(
            "Reconcile error:",
            error
        );

    }finally{

        reconcileRunning = false;

    }

}


/* =========================================================
   CASH CALCULATION
   ========================================================= */

function getDeletedStudentIds(){

    return new Set(
        Object.keys(
            appState
            .settings
            .deletedStudents || {}
        )
    );

}


function getPersistentPaymentTotal(){

    let total = 0;

    const deleted =
        getDeletedStudentIds();


    Object.entries(
        appState.pembayaranStatus || {}
    )
    .forEach(
        ([studentId,periods])=>{

            if(
                deleted.has(studentId)
            ){
                return;
            }


            Object.values(
                periods || {}
            )
            .forEach(
                payment=>{

                    if(payment?.paid){

                        total +=
                            Number(
                                payment.amount
                            )
                            ||
                            Number(
                                appState.settings.weeklyFee
                            )
                            ||
                            0;

                    }

                }
            );

        }
    );


    return total;

}


function getLegacyUnmatchedCashIn(){

    let total = 0;

    const deleted =
        getDeletedStudentIds();


    Object.entries(
        appState.kasMasuk || {}
    )
    .forEach(
        ([id,item])=>{

            if(!item) return;


            if(
                item.siswaId &&
                deleted.has(item.siswaId)
            ){

                return;
            }


            if(
                item.jenis === "pembayaran" &&
                item.siswaId &&
                item.periodeKey
            ){

                const paid =
                    appState
                    .pembayaranStatus
                    ?.[
                        item.siswaId
                    ]
                    ?.[
                        item.periodeKey
                    ];


                if(paid?.paid){
                    return;
                }

            }


            total +=
                Number(item.jumlah) || 0;

        }
    );


    return total;

}


function getRawCashIn(){

    return (
        getPersistentPaymentTotal()
        +
        getLegacyUnmatchedCashIn()
    );

}


function getRawCashOut(){

    return Object
        .values(
            appState.kasKeluar || {}
        )
        .reduce(
            (sum,item)=>
                sum+
                (
                    Number(
                        item?.jumlah
                    ) || 0
                ),
            0
        );

}


function getDisplayedCashIn(){

    const offset =
        Number(
            appState
            .settings
            .resetState
            ?.cashInOffset
        ) || 0;


    return Math.max(
        0,
        getRawCashIn()-offset
    );

}


function getDisplayedCashOut(){

    const offset =
        Number(
            appState
            .settings
            .resetState
            ?.cashOutOffset
        ) || 0;


    return Math.max(
        0,
        getRawCashOut()-offset
    );

}


function getBalance(){

    return (
        getDisplayedCashIn()
        -
        getDisplayedCashOut()
    );

}

async function savePayment(){

    const studentId =
        document.getElementById(
            "paymentStudent"
        ).value;


    const periodKey =
        document.getElementById(
            "paymentPeriod"
        ).value;


    if(!studentId || !periodKey){

        showToast(
            "Lengkapi data pembayaran",
            "error"
        );

        return;
    }


    if(
        isPaymentPaid(
            studentId,
            periodKey
        )
    ){

        showToast(
            "Periode tersebut sudah dibayar",
            "error"
        );

        return;
    }


    const period =
        getPaymentPeriods()
        .find(
            p=>
                p.key ===
                periodKey
        );


    if(!period){

        showToast(
            "Periode tidak ditemukan",
            "error"
        );

        return;
    }


    const amount =
        Number(
            appState.settings.weeklyFee
        ) || 0;


    const newRef =
        push(
            ref(
                db,
                `${BASE}/kasMasuk`
            )
        );


    const now =
        new Date()
        .toISOString();


    const data = {

        jenis:"pembayaran",

        siswaId:studentId,

        namaSiswa:
            appState
            .siswa
            [studentId]
            ?.nama || "",

        periodeKey,

        periodeLabel:
            period.label,

        jumlah:amount,

        tanggal:now,

        createdAt:now

    };


    const updates = {};


    updates[
        `${BASE}/kasMasuk/${newRef.key}`
    ] = data;


    updates[
        `${BASE}/pembayaranStatus/${studentId}/${periodKey}`
    ] = {

        paid:true,

        amount,

        tanggal:now,

        kasMasukId:
            newRef.key

    };


    try{

        await update(
            ref(db),
            updates
        );


        closeModal();


        showToast(
            "Pembayaran berhasil disimpan"
        );

    }catch(error){

        console.error(error);

        showToast(
            "Gagal menyimpan pembayaran",
            "error"
        );

    }

}


window.savePayment =
    savePayment;

async function saveCashOut(){

    const keterangan =
        document
        .getElementById(

        .value
        .trim();


    const jumlah =
        Number(
            document
            .getElementById(
                "cashOutAmount"
            )
            .value
        );


    if(
        !keterangan ||
        !jumlah ||
        jumlah <= 0
    ){

        showToast(
            "Lengkapi data kas keluar",
            "error"
        );

        return;
    }


    try{

        const newRef =
            push(
                ref(
                    db,
                    `${BASE}/kasKeluar`
                )
            );


        const now =
            new Date()
            .toISOString();


        await set(
            newRef,
            {

                keterangan,

                jumlah,

                tanggal:now,

                createdAt:now

            }
        );


        closeModal();


        showToast(
            "Kas keluar berhasil disimpan"
        );

    }catch(error){

        console.error(error);

        showToast(
            "Gagal menyimpan kas keluar",
            "error"
        );

    }

}

function deleteStudent(id){

    const siswa =
        appState
        .siswa
        [id];


    confirmAction(

        "Hapus Siswa",

        `Data ${
            siswa?.nama ||
            "siswa"
        } akan dihapus dari daftar. Riwayat lama tetap disimpan. Lanjutkan?`,

        async()=>{

            try{

                const totalPaid =
                    Object
                    .values(
                        appState
                        .pembayaranStatus
                        ?.[id] || {}
                    )
                    .reduce(
                        (sum,p)=>
                            sum+
                            (
                                p?.paid
                                ?
                                Number(
                                    p.amount
                                )
                                ||
                                Number(
                                    appState
                                    .settings
                                    .weeklyFee
                                )
                                :
                                0
                            ),
                        0
                    );


                const updates = {};


                updates[
                    `${BASE}/settings/deletedStudents/${id}`
                ] = {

                    nama:
                        siswa?.nama ||
                        "",

                    totalPaid,

                    deletedAt:
                        new Date()
                        .toISOString()

                };


                updates[
                    `${BASE}/siswa/${id}`
                ] = null;


                await update(
                    ref(db),
                    updates
                );


                showToast(
                    "Siswa berhasil dihapus"
                );

            }catch(error){

                console.error(error);

                showToast(
                    "Gagal menghapus siswa",
                    "error"
                );

            }

        }

    );

}

    deleteStudent;

async function saveSettings(){

    const feeInput =
        document.getElementById(
            "settingWeeklyFee"
        );


    const dateInput =
        document.getElementById(
            "settingStartDate"
        );


    const weeklyFee =
        Number(
            feeInput.value
        );


    const startDate =
        dateInput.value;


    if(
        !Number.isFinite(
            weeklyFee
        )
        ||
        weeklyFee < 0
    ){

        showToast(
            "Nominal kas tidak valid",
            "error"
        );

        return;
    }


    if(!startDate){

        showToast(
            "Tanggal mulai wajib diisi",
            "error"
        );

        return;
    }


    try{

        /*
          Simpan langsung ke Firebase.
        */

        await update(
            ref(
                db,
                `${BASE}/settings`
            ),
            {

                weeklyFee,

                startDate

            }
        );


        /*
          Popup sukses hanya muncul
          setelah Firebase berhasil.
        */

        showToast(
            "Berhasil disimpan"
        );


        /*
          Render ulang agar nilai
          yang terlihat langsung sesuai.
        */

        setTimeout(
            ()=>{
                renderSettingsPage();
            },
            150
        );


    }catch(error){

        console.error(error);

        showToast(
            "Gagal menyimpan pengaturan",
            "error"
        );

    }

}

        );

    }catch(error){

        console.error(error);

        showToast(
            "Gagal melakukan reset",
            "error"
        );

    }

}


/* =========================================================
   SESSION RESTORE
   ========================================================= */

function restoreSession(){

    const raw =
        sessionStorage.getItem(
            "kasKelasSession"
        );


    if(!raw){
        return;
    }


    try{

        const session =
            JSON.parse(raw);


        if(
            session &&
            (
                session.role ===
                "bendahara"
                ||
                session.role ===
                "anggota"
            )
        ){

            /*
              Untuk anggota, pastikan siswa
              masih ada dan aktif.
            */

            if(
                session.role ===
                "anggota"
                &&
                (
                    !session.siswaId ||
                    !appState.siswa[
                        session.siswaId
                    ]
                )
            ){

                sessionStorage.removeItem(
                    "kasKelasSession"
                );

                return;
            }


            currentUser =
                session;


            showApp();

        }

    }catch(error){

        console.error(error);

        sessionStorage.removeItem(
            "kasKelasSession"
        );

    }

}


/* =========================================================
   ENTER KEY LOGIN
   ========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key !== "Enter" ||
            document.getElementById(
                "loginScreen"
            ).style.display === "none"
        ){
            return;
        }


        const anggotaHidden =
            document
            .getElementById(
                "loginAnggota"
            )
            .classList
            .contains("hidden");


        if(anggotaHidden){

            loginBendahara();

        }else{

            loginAnggota();

        }

    }
);


/* =========================================================
   START APPLICATION
   ========================================================= */

initListeners();

restoreSession();

</script>
