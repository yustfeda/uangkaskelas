<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAS KELAS VII B</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
    --navy:#0b1f3a;
    --navy2:#12345b;
    --green:#16a34a;
    --green2:#15803d;
    --red:#dc2626;
    --yellow:#f59e0b;
    --blue:#2563eb;
    --white:#fff;
    --bg:#f4f7fb;
    --text:#172033;
    --muted:#64748b;
    --border:#e2e8f0;
    --shadow:0 10px 30px rgba(15,23,42,.08);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
}

body.no-scroll{
    overflow:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.hidden{
    display:none!important;
}

/* LOGIN */
#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top left,rgba(37,99,235,.18),transparent 35%),
        radial-gradient(circle at bottom right,rgba(22,163,74,.14),transparent 35%),
        #f4f7fb;
}

.login-card{
    width:100%;
    max-width:430px;
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(15,23,42,.15);
}

.login-header{
    background:linear-gradient(135deg,var(--navy),var(--navy2));
    color:white;
    padding:30px 25px;
    text-align:center;
}

.login-logo{
    width:70px;
    height:70px;
    border-radius:20px;
    background:white;
    color:var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    font-size:30px;
}

.login-header h1{
    font-size:23px;
    margin-bottom:6px;
}

.login-header p{
    opacity:.8;
    font-size:12px;
}

.login-body{
    padding:25px;
}

.role-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    background:#eef2f7;
    border-radius:12px;
    padding:4px;
    margin-bottom:22px;
}

.role-tab{
    padding:11px;
    border-radius:9px;
    color:var(--muted);
    background:transparent;
    font-weight:700;
}

.role-tab.active{
    background:white;
    color:var(--navy);
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
    font-size:13px;
}

.form-control{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 13px;
    outline:none;
    background:white;
    color:var(--text);
}

.form-control:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.password-wrap{
    position:relative;
}

.password-wrap .form-control{
    padding-right:45px;
}

.password-toggle{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    color:var(--muted);
}

.btn{
    border-radius:10px;
    padding:11px 15px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:var(--navy);
    color:white;
}

.btn-success{
    background:var(--green);
    color:white;
}

.btn-danger{
    background:var(--red);
    color:white;
}

.btn-warning{
    background:var(--yellow);
    color:white;
}

.btn-secondary{
    background:#e2e8f0;
    color:#334155;
}

.btn-outline{
    background:white;
    border:1px solid var(--border);
    color:var(--navy);
}

.btn-block{
    width:100%;
}

.login-note{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin-top:15px;
}

/* APP */
#app{
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:250px;
    background:linear-gradient(180deg,var(--navy),#07162b);
    color:white;
    z-index:1000;
    display:flex;
    flex-direction:column;
    transition:transform .25s ease;
}

.sidebar-brand{
    padding:23px 20px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.sidebar-brand h2{
    font-size:17px;
}

.sidebar-brand p{
    font-size:11px;
    opacity:.65;
    margin-top:4px;
}

.nav-menu{
    padding:15px 10px;
    overflow-y:auto;
    flex:1;
}

.nav-section{
    color:#7890ad;
    font-size:10px;
    text-transform:uppercase;
    font-weight:800;
    padding:12px 12px 7px;
    letter-spacing:.8px;
}

.nav-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    color:#dbe7f5;
    background:transparent;
    padding:11px 12px;
    border-radius:9px;
    margin-bottom:3px;
    text-align:left;
}

.nav-item i{
    width:20px;
    text-align:center;
}

.nav-item:hover,
.nav-item.active{
    background:rgba(255,255,255,.1);
    color:white;
}

.sidebar-footer{
    padding:15px;
    border-top:1px solid rgba(255,255,255,.1);
}

.sidebar-user{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.12);
}

.sidebar-user small{
    color:#91a6c0;
    display:block;
    margin-top:2px;
}

.logout-side{
    width:100%;
    background:rgba(220,38,38,.15);
    color:#fecaca;
    padding:10px;
    border-radius:9px;
    font-weight:700;
}

.sidebar-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:999;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
}

.hamburger-btn{
    display:none;
    width:42px;
    height:42px;
    flex:0 0 42px;
    border:1px solid var(--border);
    border-radius:12px;
    background:#f8fafc;
    color:var(--navy);
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(15,23,42,.08);
    transition:background .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;
}

.hamburger-btn:hover{
    background:var(--navy);
    color:white;
    transform:translateY(-1px);
    box-shadow:0 7px 18px rgba(15,23,42,.16);
}

.hamburger-btn:active{
    transform:scale(.96);
}

.hamburger-btn i{
    font-size:17px;
    transition:transform .2s ease;
}

.topbar-title-wrap{
    min-width:0;
}

.app-title{
    display:none;
    font-size:15px;
    font-weight:900;
    letter-spacing:.8px;
    color:var(--navy);
    line-height:1.1;
    margin-bottom:3px;
}

/* CONTENT */
.main-content{
    margin-left:250px;
    min-height:100vh;
}

.topbar{
    height:72px;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 14px rgba(15,23,42,.04);
}

.page-title{
    font-size:20px;
    font-weight:800;
}

.page-subtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.top-user{
    display:flex;
    align-items:center;
    gap:10px;
}

.top-avatar{
    width:37px;
    height:37px;
    background:#e8eef7;
    color:var(--navy);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.content{
    padding:25px;
    max-width:1500px;
    margin:auto;
}

.welcome{
    background:linear-gradient(135deg,var(--navy),var(--navy2));
    color:white;
    padding:25px;
    border-radius:17px;
    margin-bottom:20px;
}

.welcome h2{
    font-size:22px;
    margin-bottom:6px;
}

.welcome p{
    opacity:.78;
    font-size:12px;
}

/* STATS */
.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    position:relative;
    overflow:hidden;
    background:linear-gradient(145deg,#071b3a 0%,#0b2d5c 55%,#123d73 100%);
    border:1px solid rgba(255,255,255,.10);
    border-radius:18px;
    padding:18px;
    box-shadow:0 12px 28px rgba(7,27,58,.18);
    color:#fff;
    min-height:142px;
}

.stat-card::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    right:-35px;
    bottom:-48px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
}

.stat-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:12px;
    background:rgba(255,255,255,.13);
    color:#fff;
    border:1px solid rgba(255,255,255,.12);
}

.icon-green,.icon-red,.icon-blue,.icon-yellow{
    background:rgba(255,255,255,.13);
    color:#fff;
}

.stat-title{
    font-size:11px;
    color:rgba(255,255,255,.76);
    text-transform:uppercase;
    letter-spacing:.8px;
    font-weight:800;
}

.stat-value{
    font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
    font-size:23px;
    font-weight:900;
    letter-spacing:.2px;
    margin-top:5px;
    color:#fff;
}

/* CARDS */
.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:var(--shadow);
    overflow:hidden;
    margin-bottom:20px;
}

.card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:16px 18px;
    border-bottom:1px solid var(--border);
}

.card-title{
    font-size:15px;
    font-weight:800;
}

.card-body{
    padding:18px;
}

.section-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:18px;
}

/* TABLE */
.table-wrap{
    overflow-x:auto;
    width:100%;
    padding-bottom:4px;
    scrollbar-width:auto;
    scrollbar-color:#94a3b8 #e2e8f0;
}

/* SCROLLBAR DIPERLEBAR */
.table-wrap::-webkit-scrollbar,
.recent-scroll::-webkit-scrollbar{
    height:12px;
}

.table-wrap::-webkit-scrollbar-track,
.recent-scroll::-webkit-scrollbar-track{
    background:#e2e8f0;
    border-radius:10px;
}

.table-wrap::-webkit-scrollbar-thumb,
.recent-scroll::-webkit-scrollbar-thumb{
    background:#94a3b8;
    border-radius:10px;
    border:2px solid #e2e8f0;
}

.table-wrap::-webkit-scrollbar-thumb:hover,
.recent-scroll::-webkit-scrollbar-thumb:hover{
    background:#64748b;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    background:#f8fafc;
    color:#64748b;
    font-size:11px;
    padding:12px;
    white-space:nowrap;
}

td{
    padding:12px;
    border-top:1px solid #eef2f7;
    font-size:12px;
    vertical-align:middle;
}

.badge{
    display:inline-flex;
    padding:5px 8px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
}

.badge-green{
    color:#166534;
    background:#dcfce7;
}

.badge-red{
    color:#991b1b;
    background:#fee2e2;
}

.badge-yellow{
    color:#92400e;
    background:#fef3c7;
}

.badge-blue{
    color:#1e40af;
    background:#dbeafe;
}

.action-group{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.action-btn{
    width:31px;
    height:31px;
    border-radius:8px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.action-edit{
    background:#dbeafe;
    color:#1d4ed8;
}

.action-delete{
    background:#fee2e2;
    color:#dc2626;
}

/* RECENT MOBILE SCROLL */
.recent-scroll{
    width:100%;
    max-width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:auto;
    scrollbar-color:#94a3b8 #e2e8f0;
}

.recent-scroll table{
    min-width:620px;
}


.payment-period-option:hover{
    background:#f8fafc;
}

.payment-period-option:has(input:checked){
    background:#eff6ff;
    border:1px solid #bfdbfe;
}

.payment-period-checkbox{
    width:16px;
    height:16px;
    accent-color:var(--navy);
}

/* ALERT */
.alert-card{
    border-left:4px solid var(--red);
}

.alert-content{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.alert-content p{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

/* EMPTY */
.empty{
    padding:30px 15px;
    text-align:center;
    color:var(--muted);
}

.empty i{
    font-size:30px;
    margin-bottom:10px;
    opacity:.4;
}

/* PAGE TOOLBAR */
.toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.toolbar-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

/* MODAL */
.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(2,6,23,.55);
    z-index:2000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal{
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:17px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:17px 20px;
    border-bottom:1px solid var(--border);
}

.modal-header h3{
    font-size:16px;
}

.modal-close{
    width:32px;
    height:32px;
    border-radius:8px;
    background:#f1f5f9;
    color:#475569;
}

.modal-body{
    padding:20px;
}

.modal-footer{
    padding:15px 20px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

/* TOAST */
#toastContainer{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:5000;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.toast{
    min-width:250px;
    max-width:350px;
    padding:13px 15px;
    border-radius:10px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    animation:toastIn .2s ease;
    display:flex;
    gap:9px;
    align-items:flex-start;
}

.toast-success{
    background:var(--green);
}

.toast-error{
    background:var(--red);
}

.toast-info{
    background:var(--navy);
}

@keyframes toastIn{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
}

/* SETTINGS */
.settings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.info-box{
    padding:14px;
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:12px;
    color:var(--muted);
}

.info-box strong{
    display:block;
    color:var(--text);
    font-size:14px;
    margin-top:3px;
}

/* RESPONSIVE */
@media(max-width:1000px){
    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:768px){

    .sidebar{
        transform:translateX(-105%);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .sidebar-overlay.show{
        display:block;
    }

    .main-content{
        margin-left:0;
    }

    .topbar{
        height:68px;
        padding:0 14px;
        z-index:1100;
    }

    .hamburger-btn{
        display:flex;
    }

    .app-title{
        display:block;
    }

    .topbar-title-wrap .page-title{
        font-size:15px;
        line-height:1.1;
    }

    .topbar-title-wrap .page-subtitle{
        display:none;
    }

    .top-user{
        display:none;
    }

    .page-title{
        font-size:17px;
    }

    .content{
        padding:15px;
    }

    .welcome{
        padding:19px;
        border-radius:14px;
    }

    .welcome h2{
        font-size:18px;
    }

    .stats-grid{
        gap:10px;
    }

    .stat-card{
        padding:14px;
    }

    .stat-value{
        font-size:17px;
    }

    .grid-2{
        grid-template-columns:1fr;
        gap:0;
    }

    .card{
        border-radius:13px;
    }

    .card-header{
        padding:14px;
    }

    .card-body{
        padding:14px;
    }

    .section-title{
        font-size:16px;
    }

    th,td{
        font-size:11px;
        padding:9px;
    }

    .settings-grid{
        grid-template-columns:1fr;
    }

    .btn{
        font-size:12px;
        padding:10px 12px;
    }

    #toastContainer{
        right:10px;
        left:10px;
        bottom:10px;
    }

    .toast{
        min-width:0;
        width:100%;
    }

    /* DAFTAR SISWA SEDIKIT LEBIH LONGGAR */
    .table-wrap table{
        min-width:760px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
    <div class="login-card">

        <div class="login-header">

            <div class="login-logo">
                <i class="fa-solid fa-wallet"></i>
            </div>

            <h1>KAS KELAS VII B</h1>

            <p>Sistem Pengelolaan Kas Kelas</p>

        </div>

        <div class="login-body">

            <div class="role-tabs">

                <button
                    class="role-tab active"
                    id="roleBendahara"
                    onclick="setLoginRole('bendahara')">

                    <i class="fa-solid fa-user-tie"></i>
                    Bendahara

                </button>

                <button
                    class="role-tab"
                    id="roleAnggota"
                    onclick="setLoginRole('anggota')">

                    <i class="fa-solid fa-users"></i>
                    Anggota

                </button>

            </div>

            <div id="bendaharaLogin">

                <div class="form-group">

                    <label>Username</label>

                    <input
                        id="loginUsername"
                        class="form-control"
                        type="text"
                        placeholder="Masukkan username">

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <div class="password-wrap">

                        <input
                            id="loginPassword"
                            class="form-control"
                            type="password"
                            placeholder="Masukkan password">

                        <button
                            class="password-toggle"
                            onclick="togglePassword('loginPassword',this)">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

            </div>

            <div id="anggotaLogin" class="hidden">

                <div class="form-group">

                    <label>Nama Siswa</label>

                    <select
                        id="loginStudent"
                        class="form-control">

                        <option value="">
                            Pilih nama siswa
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <div class="password-wrap">

                        <input
                            id="loginStudentPassword"
                            class="form-control"
                            type="password"
                            placeholder="Masukkan password">

                        <button
                            class="password-toggle"
                            onclick="togglePassword('loginStudentPassword',this)">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

            </div>

            <button

window.escapeHtml=function(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
};

window.formatRupiah=function(value){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            minimumFractionDigits:0
        }
    ).format(Number(value)||0);
};

function formatDate(timestamp){

    if(!timestamp) return "-";

    const d=new Date(timestamp);

    return d.toLocaleDateString(
        "id-ID",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    )+" "+
    d.toLocaleTimeString(
        "id-ID",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

function formatDateOnly(date){

    return new Date(date).toLocaleDateString(
        "id-ID",
        {
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    );
}

/* =========================================================
   PERIOD PAYMENT SYSTEM
========================================================= */

function getStartDate(){

    if(appState.settings.startDate){

        const d =
            new Date(
                appState.settings.startDate+
                "T00:00:00"
            );

        if(!isNaN(d.getTime())){
            return d;
        }
    }

    const d=new Date();

    d.setMonth(0);
    d.setDate(1);
    d.setHours(0,0,0,0);

    return d;
}

function getWeeklyFee(){

    return Number(
        appState.settings.weeklyFee
    ) || 0;
}

function getPaymentPeriods(){

    const start=getStartDate();

    const today=new Date();

    today.setHours(
        23,59,59,999
    );

    const result=[];

    let cursor=new Date(start);

    let index=1;

    while(cursor<=today){

        const periodStart=
            new Date(cursor);

        const periodEnd=
            new Date(cursor);

        periodEnd.setDate(
            periodEnd.getDate()+6
        );

        periodEnd.setHours(
            23,59,59,999
        );

        if(periodStart>today){
            break;
        }

        result.push({

            key:
                "PERIOD-"+
                periodStart.getFullYear()+
                "-"+
                String(
                    periodStart.getMonth()+1
                ).padStart(2,"0")+
                "-"+
                String(
                    periodStart.getDate()
                ).padStart(2,"0"),

            index:index,

            start:new Date(periodStart),

            end:new Date(periodEnd),

            label:
                `Minggu ${index} (${formatDateOnly(periodStart)} - ${formatDateOnly(periodEnd)})`

        });

        cursor.setDate(
            cursor.getDate()+7
        );

        index++;
    }

    return result;
}

function getPeriodByKey(key){

    return getPaymentPeriods()
        .find(p=>p.key===key);
}

function getStudentPaymentStatus(
    studentId,
    periodKey
){

    return !!(
        appState
        .pembayaranStatus?.[
            studentId
        ]?.[
            periodKey
        ]?.paid
    );
}

function getStudentPaidAmount(
    studentId
){

    let total=0;

    const periods=
        appState
        .pembayaranStatus?.[
            studentId
        ] || {};

    Object.values(periods)
        .forEach(p=>{

            if(p?.paid){

                total+=
                    Number(p.jumlah)||0;
            }

        });

    return total;
}

function getStudentUnpaidPeriods(
    studentId
){

    const periods=
        getPaymentPeriods();

    return periods.filter(
        period=>{

            return !getStudentPaymentStatus(
                studentId,
                period.key
            );

        }
    );
}


/* =========================================================
   ACCOUNTING
========================================================= */

function getPersistentCashInTotal(){

    /*
       SUMBER RESMI TOTAL KAS MASUK
       =============================
       HANYA transaksi yang benar-benar tersimpan di kasMasuk
       yang dihitung sebagai uang masuk.

       pembayaranStatus TIDAK ikut dijumlahkan karena hanya berfungsi
       sebagai status pembayaran anggota. Setiap pembayaran yang sah
       selalu membuat SATU transaksi kasMasuk dengan nominal yang sama.

       Dengan aturan ini:
       - Siswa bayar Rp2.000 -> kas masuk Rp2.000
       - Kas masuk manual Rp5.000 -> kas masuk Rp5.000
       - Kas keluar Rp1.000 -> saldo berkurang Rp1.000
       - Tidak ada nominal yang dikalikan 2 karena status pembayaran
         tidak pernah dijadikan sumber uang kedua.
    */
    let total=0;

    Object.values(
        appState.kasMasuk || {}
    ).forEach(tx=>{

        if(!tx) return;

        const amount=Number(tx.jumlah)||0;

        if(amount>0){
            total+=amount;
        }

    });

    return total;
}

function getRawCashOutTotal(){

    let total=0;

    Object.values(
        appState.kasKeluar || {}
    ).forEach(tx=>{

        total+=
            Number(tx?.jumlah)||0;

    });

    return total;
}

function getDisplayedCashIn(){

    /*
       TOTAL KAS MASUK DI BERANDA = TOTAL KAS MASUK DI MENU KAS MASUK.
       Jangan kurangi dengan offset tampilan. Sumber angka hanya
       transaksi yang benar-benar tersimpan di Firebase pada node
       ${DB}/kasMasuk.
    */
    return getPersistentCashInTotal();
}

function getDisplayedCashOut(){

    /*
       Sama seperti kas masuk, total kas keluar di beranda harus
       sama persis dengan transaksi pada menu Kas Keluar.
    */
    return getRawCashOutTotal();
}

function getDisplayedBalance(){

    const cashIn=getPersistentCashInTotal();
    const cashOut=getRawCashOutTotal();

    return cashIn-cashOut;
}


/* =========================================================
   REALTIME DATABASE
========================================================= */

function applyDatabaseSnapshot(snap){

    const data=snap?.val() || {};

    /*
       SATU-SATUNYA STATE SUMBER APLIKASI
       =================================
       Semua angka dashboard, halaman Kas Masuk, Kas Keluar,
       status pembayaran, dan daftar siswa dibentuk dari snapshot
       Firebase yang sama. Tidak ada angka kas yang ditambah secara
       manual setelah tombol Simpan ditekan.
    */
    appState.siswa=
        data.siswa || {};

    appState.kasMasuk=
        data.kasMasuk || {};

    appState.kasKeluar=
        data.kasKeluar || {};

    appState.pembayaranStatus=
        data.pembayaranStatus || {};

    appState.settings={
        ...defaultSettings,
        ...(data.settings || {}),
        resetState:{
            ...defaultSettings.resetState,
            ...((data.settings || {}).resetState || {})
        },
        deletedStudents:
            ((data.settings || {}).deletedStudents || {})
    };

    updateStudentSelect();
    refreshAllViews();
    updateConditionalNavigation();
}

function updateConditionalNavigation(){

    const navRiwayat=document.getElementById("navRiwayat");
    if(navRiwayat){
        const hasHistory=getHistoryForCurrentUser().length>0;
        navRiwayat.style.display=hasHistory ? "flex" : "none";
    }
}


function startListeners(){

    /*
       REALTIME LISTENER TUNGGAL
       =========================
       Seluruh halaman mendengarkan root kelas. Jadi ketika Bendahara
       menyimpan pembayaran, perubahan kasMasuk + pembayaranStatus
       diterima sebagai SATU snapshot Firebase dan dashboard Bendahara
       maupun Anggota ikut diperbarui otomatis.
    */
    onValue(
        ref(database,DB),
        snap=>{

            applyDatabaseSnapshot(snap);

            /*
               Hanya untuk melengkapi status pembayaran lama yang
               belum memiliki node pembayaranStatus. Fungsi ini tidak
               pernah menambah uang ke kas.
            */
            reconcilePaymentStatus();
        }
    );
}


/* =========================================================
   RECONCILE OLD PAYMENT DATA
========================================================= */

async function reconcilePaymentStatus(){

    if(reconciling) return;

    reconciling=true;

    try{

        const status=
            appState.pembayaranStatus || {};

        const changes={};

        for(
            const tx
            of Object.values(
                appState.kasMasuk || {}
            )
        ){

            if(
                tx?.siswaId &&
                tx?.periodeKey
            ){

                const existing=
                    status
                    ?.[
                        tx.siswaId
                    ]
                    ?.[
                        tx.periodeKey
                    ];

                if(!existing?.paid){

                    changes[
                        `${DB}/pembayaranStatus/${tx.siswaId}/${tx.periodeKey}`
                    ]={

                        paid:true,

                        jumlah:
                            Number(tx.jumlah)||0,

                        timestamp:
                            tx.timestamp ||
                            Date.now(),

                        namaSiswa:
                            tx.namaSiswa || "",

                        migrated:true
                    };
                }
            }
        }

        if(
            Object.keys(changes).length
        ){

            await update(
                ref(database),
                changes
            );
        }

    }catch(error){

        console.error(error);

    }finally{

        reconciling=false;
    }
}

    const students=

            appState.siswa

        .filter(
            ([id,s])=>{

                    s.aktif!==false &&
                    !(
                        appState
                        .settings
                        .deletedStudents || {}
                    )[id];

            }
        )
        .sort(
            (a,b)=>
                String(a[1].nama||"")
                .localeCompare(
                    String(b[1].nama||"")
                )
        );

    select.innerHTML=
        `<option value="">Pilih nama siswa</option>`+
        students.map(
            ([id,s])=>`

                <option value="${escapeHtml(id)}">
                    ${escapeHtml(s.nama)}
                </option>

            `
        ).join("");
}

                renderKasKeluarPage();
            break;

        case "siswa":
            container.innerHTML=
                renderSiswaPage();
            break;

        case "siswaNunggak":
            container.innerHTML=
                renderNunggakPage();
            break;

        case "riwayat":
            container.innerHTML=
                renderRiwayatPage();
            break;

        case "pengaturan":
            container.innerHTML=
                renderPengaturanPage();
            break;

        default:
            container.innerHTML=
                renderDashboard();
    }
}

function getHistoryForCurrentUser(){

    const list=[];

    Object.entries(
        appState.kasMasuk || {}
    ).forEach(
        ([id,tx])=>{

            if(!tx) return;

            if(
                appState.role==="anggota" &&
                tx.siswaId!==appState.userId
            ){
                return;
            }

            list.push({

                id,

                type:"masuk",

                timestamp:
                    Number(tx.timestamp)||0,

                nama:
                    tx.namaSiswa ||
                    (
                        tx.siswaId &&
                        appState.siswa[
                            tx.siswaId
                        ]?.nama
                    ) ||
                    "-",

                keterangan:
                    tx.keterangan ||
                    (
                        tx.periodeKey
                        ?"Pembayaran kas"
                        :"Kas masuk"
                    ),

                jumlah:
                    Number(tx.jumlah)||0

            });

        }
    );

    if(appState.role==="bendahara"){

        Object.entries(
            appState.kasKeluar || {}
        ).forEach(
            ([id,tx])=>{

                if(!tx) return;

                list.push({

                    id,

                    type:"keluar",

                    timestamp:
                        Number(tx.timestamp)||0,

                    nama:"Bendahara",

                    keterangan:
                        tx.keterangan ||
                        tx.nama ||
                        "Kas keluar",

                    jumlah:
                        Number(tx.jumlah)||0

                });

            }
        );
    }

    return list.sort(
        (a,b)=>
            b.timestamp-a.timestamp
    );
}

window.updateSelectedPaymentPeriod=
function(){

    const checkboxes=[
        ...document.querySelectorAll(
            ".payment-period-checkbox"
        )
    ];

    const amountInput=document.getElementById("paymentAmount");
    const info=document.getElementById("paymentInfo");

    if(!amountInput) return;

    const selected=checkboxes.filter(cb=>cb.checked);
    const weeklyFee=Number(getWeeklyFee())||0;
    const total=selected.length*weeklyFee;

    amountInput.value=total;

    if(info){
        if(selected.length){
            info.innerHTML=`
                <div class="info-box" style="border-color:#bfdbfe;background:#eff6ff;color:#1e3a8a">
                    <strong style="color:#1e40af">
                        ${selected.length} periode dipilih
                    </strong>
                    <div style="margin-top:4px">
                        ${formatRupiah(weeklyFee)} × ${selected.length} minggu =
                        <strong>${formatRupiah(total)}</strong>
                    </div>
                </div>
                <br>
            `;
        }else{
            info.innerHTML=`
                <div class="info-box">
                    Pilih periode yang benar-benar dibayarkan. Nominal akan dihitung otomatis.
                </div>
                <br>
            `;
        }
    }
};

window.updatePaymentPeriods=
function(){

    const studentId=document.getElementById("paymentStudent")?.value;
    const container=document.getElementById("paymentPeriodList");
    const info=document.getElementById("paymentInfo");

    if(!container) return;

    const periods=getPaymentPeriods();

    periods.forEach(period=>{
        const row=container.querySelector(
            `.payment-period-option[data-period-key="${CSS.escape(period.key)}"]`
        );
        const checkbox=row?.querySelector(".payment-period-checkbox");
        const label=row?.querySelector(".period-payment-label");

        if(!row || !checkbox) return;

        const paid=!!(
            studentId &&
            getStudentPaymentStatus(studentId,period.key)
        );

        checkbox.checked=false;
        checkbox.disabled=paid;
        row.style.opacity=paid?".55":"1";
        row.style.cursor=paid?"not-allowed":"pointer";
        row.style.background=paid?"#f8fafc":"transparent";

        if(label){
            label.textContent=paid
                ?"SUDAH DIBAYAR"
                :formatRupiah(Number(getWeeklyFee())||0);
            label.style.color=paid?"#16a34a":"var(--muted)";
            label.style.fontWeight=paid?"800":"400";
        }
    });

    const unpaid=studentId
        ?getStudentUnpaidPeriods(studentId)
        :[];

    if(info && studentId){
        info.innerHTML=unpaid.length
            ?`<div class="info-box">
                Belum dibayar:
                <strong>${unpaid.length} minggu — ${formatRupiah(unpaid.length*(Number(getWeeklyFee())||0))}</strong>
              </div><br>`
            :`<div class="info-box" style="border-color:#bbf7d0;background:#f0fdf4;color:#166534">
                <strong style="color:#166534">Siswa sudah melunasi seluruh periode kas.</strong>
              </div><br>`;
    }

    updateSelectedPaymentPeriod();
};

========================================================= */

window.savePayment=
async function(){

    if(window.__savingPayment){
        showToast("Pembayaran sedang diproses. Tunggu sampai selesai.","info");
        return;
    }

    const studentId=document.getElementById("paymentStudent")?.value;
    const selectedPeriods=[
        ...document.querySelectorAll(".payment-period-checkbox:checked")
    ].map(cb=>cb.value);
    const description=document.getElementById("paymentDescription")?.value.trim();
    const weeklyFee=Number(getWeeklyFee())||0;
    const totalAmount=selectedPeriods.length*weeklyFee;

    if(!studentId){
        showToast("Pilih siswa terlebih dahulu.","error");
        return;
    }

    if(!selectedPeriods.length){
        showToast("Pilih minimal satu periode pembayaran.","error");
        return;
    }

    if(weeklyFee<=0){
        showToast("Tarif kas mingguan belum ditentukan atau tidak valid.","error");
        return;
    }

    const student=appState.siswa[studentId];
    if(!student){
        showToast("Data siswa tidak ditemukan.","error");
        return;
    }

    const duplicate=selectedPeriods.filter(periodKey=>
        getStudentPaymentStatus(studentId,periodKey)
    );

    if(duplicate.length){
        showToast("Ada periode yang sudah dibayar. Segarkan pilihan periode.","error");
        updatePaymentPeriods();
        return;
    }

    window.__savingPayment=true;

    const saveButton=document.getElementById("savePaymentButton");
    if(saveButton){
        saveButton.disabled=true;
        saveButton.style.opacity=".65";
        saveButton.style.pointerEvents="none";
    }

    try{
        const updates={};
        const timestamp=Date.now();

        selectedPeriods.forEach((periodKey,index)=>{
            const txRef=push(ref(database,`${DB}/kasMasuk`));
            const txId=txRef.key;
            const txTimestamp=timestamp+index;

            const paymentData={
                siswaId:studentId,
                namaSiswa:student.nama,
                periodeKey:periodKey,
                jumlah:weeklyFee,
                keterangan:description || "Pembayaran kas mingguan",
                timestamp:txTimestamp,
                dibuatOleh:"Bendahara"
            };

            const statusData={
                paid:true,
                jumlah:weeklyFee,
                timestamp:txTimestamp,
                namaSiswa:student.nama,
                periodeKey:periodKey,
                transaksiId:txId,
                updatedBy:"Bendahara"
            };

            updates[`${DB}/kasMasuk/${txId}`]=paymentData;
            updates[`${DB}/pembayaranStatus/${studentId}/${periodKey}`]=statusData;

        });

        await update(ref(database),updates);

        /*
           KONFIRMASI LANGSUNG DARI REALTIME DATABASE
           ===========================================
           Setelah Firebase menerima transaksi, baca kembali root DB.
           Beranda dan menu Kas Masuk kemudian dirender dari snapshot
           tersebut, bukan dari nominal form. Ini memastikan angka yang
           tampil adalah angka yang benar-benar tersimpan.
        */
        const confirmedSnapshot=
            await get(ref(database,DB));

        applyDatabaseSnapshot(confirmedSnapshot);

        /*
           Listener onValue tetap aktif. Perangkat Bendahara maupun
           Anggota yang sedang membuka aplikasi akan menerima perubahan
           Firebase dan refresh otomatis.
        */

        showToast(
            `${selectedPeriods.length} periode berhasil dicatat. Total kas masuk ${formatRupiah(totalAmount)}.`,
            "success"
        );

        closeModal();

    }catch(error){
        console.error(error);
        showToast("Gagal menyimpan pembayaran.","error");
    }finally{
        window.__savingPayment=false;
    }
};

window.saveKasKeluar=
async function(id){

        document
        .getElementById(
            "expenseDescription"
        )
        .value
        .trim();

    const amount=
        Number(
            document
            .getElementById(
                "expenseAmount"
            )
            .value
        );

    if(!description){

        showToast(
            "Keterangan wajib diisi.",
            "error"
        );

        return;
    }

    if(amount<=0){

        showToast(
            "Jumlah tidak valid.",
            "error"
        );

        return;
    }

    const txId=
        id ||
        push(
            ref(
                database,
                `${DB}/kasKeluar`
            )
        ).key;

    try{

        const cashOutData={

            keterangan:
                description,

            jumlah:
                amount,

            timestamp:
                id
                ?Number(
                    appState
                    .kasKeluar[id]
                    ?.timestamp
                ) ||
                Date.now()
                :Date.now()

        };

        await set(
            ref(
                database,
                `${DB}/kasKeluar/${txId}`
            ),
            cashOutData
        );

        /*
           State lokal tidak diubah manual.
           Listener Firebase akan menerima data terbaru dan
           memperbarui dashboard dari Realtime Database.
        */

        showToast(
            id
            ?`Kas keluar ${formatRupiah(amount)} berhasil diperbarui.`
            :`Kas keluar ${formatRupiah(amount)} berhasil disimpan. Saldo telah diperbarui.`
        );

        closeModal();

    }catch(error){

window.saveEditKasMasuk=
async function(id){

    const tx=
        appState.kasMasuk[id];

    if(!tx) return;

    const amount=
        Number(
            document
            .getElementById(
                "editIncomeAmount"
            )
            .value
        );

    const description=
        document
        .getElementById(
            "editIncomeDescription"
        )
        .value
        .trim();

    if(amount<=0){

        showToast(
            "Jumlah tidak valid.",
            "error"
        );

        return;
    }

    const updates={};

    updates[
        `${DB}/kasMasuk/${id}/jumlah`
    ]=amount;

    updates[
        `${DB}/kasMasuk/${id}/keterangan`
    ]=
        description ||
        "Kas masuk";

    /*
       SINKRONISASI:
       Jika transaksi pembayaran siswa,
       status pembayaran siswa ikut berubah.
    */
    if(
        tx.siswaId &&
        tx.periodeKey
    ){

        updates[
            `${DB}/pembayaranStatus/${tx.siswaId}/${tx.periodeKey}/jumlah`
        ]=amount;

        updates[
            `${DB}/pembayaranStatus/${tx.siswaId}/${tx.periodeKey}/timestamp`
        ]=
            Number(
                tx.timestamp
            ) ||
            Date.now();

        updates[
            `${DB}/pembayaranStatus/${tx.siswaId}/${tx.periodeKey}/updatedBy`
        ]="Bendahara";
    }

    try{

        await update(
            ref(database),
            updates
        );

        showToast(
            "Kas masuk berhasil diperbarui dan disinkronkan ke anggota."
        );

        closeModal();

    }catch(error){

        console.error(error);

        showToast(
            "Gagal memperbarui kas masuk.",
            "error"
        );
    }
};

window.saveSettings=
async function(){

    const startDate=
        document
        .getElementById(
            "settingStartDate"

        .value;

        Number(
            document
            .getElementById(
                "settingWeeklyFee"

            .value

        showToast(
            "Jumlah kas per minggu harus lebih dari 0.",

        );

    try{

        await update(
            ref(

            }
        );

        showToast(

window.processReset=
async function(){

    const code=
        document
        .getElementById(
            "resetCode"
        )
        .value;

    if(code!=="060999"){

        showToast(
            "Kode reset salah.",
            "error"
        );

        return;
    }

    try{

        await update(
            ref(database),
            {

                [`${DB}/settings/resetState/cashInOffset`]:
                    getPersistentCashInTotal(),

                [`${DB}/settings/resetState/cashOutOffset`]:
                    getRawCashOutTotal(),

                [`${DB}/settings/resetState/updatedAt`]:
                    Date.now()

            }
        );

        showToast(
            "Saldo tampilan berhasil di-reset."
        );

        closeModal();

    }catch(error){

        console.error(error);

        showToast(
            "Gagal melakukan reset.",
            "error"
        );
    }
};
